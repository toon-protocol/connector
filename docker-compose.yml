# Local Blockchain Development Infrastructure
# Docker Compose with profiles for selective chain startup.
#
# Usage:
#   make anvil-up      Start Anvil + Faucet (EVM)
#   make anvil-down    Stop EVM services
#   make anvil-logs    Follow EVM logs
#   make solana-up     Start Solana test validator
#   make solana-down   Stop Solana services
#   make solana-logs   Follow Solana logs
#   make infra-up      Start every chain the connector settles on (EVM + Solana)
#   make infra-down    Stop them (preserves volumes)

# ── One project name, wherever this file is run from ──
# Compose defaults the project name to the basename of the directory holding
# this file, and prefixes every container, network and named volume with it.
# That made the same repository produce different, mutually invisible stacks:
# `connector-anvil-1` from the main checkout, `agent-a00677d430ef-anvil-1` from
# a git worktree of it. `make local-down` only removes the project it is
# standing in, so a stack started from a worktree survived a `make local-down`
# in the main checkout while still holding 8545/8899 — and, worse, its named
# state volumes survived with it. `local/README.md` is explicit that those must
# NOT outlive a run: a claim journal left behind satisfies the next run's money
# assertion without that run having paid anything. This machine carried a
# `connector_solo-state` volume for two days that way (issue #1122).
#
# Naming the project here rather than exporting COMPOSE_PROJECT_NAME from the
# Makefile is deliberate: `local/README.md` and the headers under `local/`
# document a hand-run `docker compose -f docker-compose.yml -f local/<t>/compose.yml`,
# and that path has to land in the same project as `make local-up` or the two
# would go back to being invisible to each other.
#
# One name means one stack per machine, which is what the machine can actually
# hold: every topology publishes 8545, 8899 and the connectors' client edges,
# so a second stack could never have run anyway — it would have failed on a
# port bind, half-started, and been unreachable from the other checkout's
# `make local-down`. `local/stack-guard.sh` turns that into a refusal that
# names the directory and topology already holding the stack.
name: connector

# ── Shared json-file log rotation for the long-running dev-chain services ──
# Incident 2026-06-26: on the self-hosted devnet box the solana-validator wrote
# a 121 MB UNROTATED Docker json log (it prints a status line ~30x/sec) on top
# of an oversized rocksdb ledger, which helped fill the box disk to 100%. A full
# disk silently FREEZES Solana block production (slot stops advancing) while
# /health still returns "ok", so faucet/settlement writes hang then 500
# ("Transaction was not confirmed in 30s") with no obvious cause. anvil and the
# faucet are similarly chatty. Cap every such service's container log
# at 30 MB total (10 MB x 3 rotated files) so logs can never fill /var/lib/docker.
# (The solana ledger itself is bounded separately by --limit-ledger-size in
# infra/solana/entrypoint.sh — the two together are the durable disk-full fix.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Anvil - Local Ethereum Node with Auto-Deployed Contracts
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    # Run as the user who INVOKED make, not as root and not as the image's own
    # `foundry` user. This service bind-mounts ./packages/contracts read-write
    # and `forge` writes four things into it — out/, cache/, broadcast/ and, on
    # a checkout whose submodules are not initialized, lib/ — so whoever this
    # container is decides who owns the developer's source tree afterwards.
    #
    # `user: root` was the previous answer, for the reason #104 records: the
    # image's baked-in uid 1000 cannot write the mount when the host dir
    # belongs to a different uid (a CI runner is 1001), and `forge script` then
    # dies with `"/contracts/out": Permission denied`. Running as the OWNER of
    # the mount solves that without handing root a writable path into the tree,
    # and root cost two distinct failures that both looked like something else:
    #
    #   * The artefacts came back root-owned, so the next `cargo test` could
    #     not rebuild them — `abi_provenance` runs a real `forge build` of
    #     packages/contracts — and the developer could not even `rm -rf` the
    #     directory to recover without sudo. Running the local environment
    #     broke the unit-test gate, with nothing connecting the two.
    #   * On a git worktree, or any checkout where `git submodule update
    #     --init` has not run, lib/forge-std and lib/openzeppelin-contracts
    #     exist and are EMPTY, owned by the developer. `forge install` clones
    #     into them and git refuses as root — "detected dubious ownership in
    #     repository at '/contracts/lib/forge-std'" — so the self-heal below
    #     never completed, the deploy compiled against absent OpenZeppelin
    #     sources, and every topology under local/ failed bring-up with
    #     `container ... is unhealthy` and no other clue.
    #
    # HOST_UID/HOST_GID are exported by the Makefile (`id -u` / `id -g`), so
    # every `make anvil-up` / `make infra-up` / `make local-*` gets this right.
    # A hand-run `docker compose up` falls back to 1000:1000, the image's own
    # user and the common single-developer case.
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    environment:
      # An arbitrary uid has no /etc/passwd entry in this image, so $HOME would
      # resolve to `/`, which is not writable. forge needs a writable home: it
      # downloads the solc pinned by foundry.toml into ~/.svm on every start
      # (the image ships none) and git wants somewhere for its config.
      HOME: /tmp
    profiles:
      - evm
      - app # issue #221 — reused by the app profile
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "Starting Anvil..."
        anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000 &
        ANVIL_PID=$$!

        echo "Waiting for Anvil to be ready..."
        until cast client --rpc-url http://localhost:8545 2>/dev/null | grep -q 'anvil'; do
          sleep 1
        done

        echo "Deploying contracts..."
        cd /contracts

        # DeployLocal.s.sol imports forge-std + openzeppelin-contracts from
        # lib/ (git submodules). In CI the checkout fetches them via
        # `submodules: recursive`, and every `make anvil-up` / `make infra-up` /
        # `make local-up` runs tools/contracts/init-libs.sh on the HOST first,
        # which is the same thing done from the checkout that owns the pin. This
        # is the LAST RESORT for the one caller neither covers: a hand-run
        # `docker compose up` on a clone made without `--recursive`, which the
        # headers under local/ document. Without it the stack comes up with no
        # USDC token and no TokenNetworkRegistry. See issue #104.
        #
        # PINNED TO A REVISION, and that is the whole of issue #1121. `forge
        # install <repo>` with no ref takes that repository's default branch:
        # this installed OpenZeppelin 5.7.0 into a tree whose submodule names
        # fcbae539 (5.5.0), and the next host-side `forge build` said so —
        # `Warning: Dependency 'lib/openzeppelin-contracts' revision mismatch`,
        # from inside abi_provenance's own passing test output. Two consumers
        # then compile against a version nobody chose: this deploy, and
        # `crates/connector-settlement-evm/tests/abi_provenance.rs`, which
        # diffs the committed ABI against a fresh build. An upstream release
        # that touched anything the ABI depends on would turn that gate red on
        # a machine that changed nothing, days after the container ran, and it
        # would read as "someone edited a contract".
        #
        # This installs only what is MISSING, so a tree an OLDER unpinned run
        # already polluted is repaired by tools/contracts/init-libs.sh rather
        # than here: it can tell an unregistered lib/ from a submodule, and this
        # sentinel check cannot.
        #
        # The revisions below are `packages/contracts/foundry.lock`'s, which are
        # the committed submodule shas.
        # `local_topologies_load.rs::the_contract_libs_this_chain_installs_are_pinned_to_the_lockfile`
        # holds these three copies to one figure, so the pin cannot rot in
        # silence the way an unpinned install did.
        #
        # ONE LIB AT A TIME, and each one repaired rather than topped up. A
        # single `forge install a b` fails as a unit, so a half-installed lib/
        # took the other lib down with it; and `forge install` into a directory
        # that already holds a partial clone errors instead of fixing it, which
        # is exactly the state a previously-failed run leaves behind. Removing
        # the directory first is what makes this idempotent on a broken tree as
        # well as on a clean one — and it is only possible at all because this
        # container runs as the owner of the mount (see `user:` above).
        install_lib() {
          if [ -f "$$3" ]; then
            return 0
          fi
          echo "Foundry lib $$1 is missing — installing $$2..."
          rm -rf "$$1"
          forge install "$$2" --no-git
        }
        install_lib lib/forge-std \
          foundry-rs/forge-std@rev=1801b0541f4fda118a10798fd3486bb7051c5dd6 \
          lib/forge-std/src/Script.sol
        install_lib lib/openzeppelin-contracts \
          OpenZeppelin/openzeppelin-contracts@rev=fcbae5394ae8ad52d8e580a3477db99814b9d565 \
          lib/openzeppelin-contracts/contracts/access/Ownable.sol

        # Deploy must succeed: the faucet and the EVM settlement tests depend on
        # the USDC token + TokenNetworkRegistry existing at deterministic
        # addresses. A silent failure here (the old `|| echo non-fatal`) is what
        # left the faucet reporting tokenReady:true with no token on-chain (#104).
        #
        # The success line is CONDITIONAL, which it was not. `sh -c` has no
        # `set -e` here — it cannot have one, the whole point of the tail of
        # this script is to keep anvil in the foreground — so a failed deploy
        # printed "Anvil ready with contracts deployed!" and then served an
        # empty chain forever. The healthcheck below still caught it, but what
        # a developer read in the log said the opposite of what had happened.
        if forge script script/DeployLocal.s.sol:DeployLocalScript \
             --rpc-url http://localhost:8545 --broadcast --skip-simulation; then
          echo "Anvil ready with contracts deployed!"
        else
          echo "============================================================"
          echo "CONTRACT DEPLOY FAILED. This anvil is serving an EMPTY chain:"
          echo "there is no MockERC20 USDC and no TokenNetworkRegistry on it,"
          echo "so this container will never pass its healthcheck and nothing"
          echo "that settles can start against it. The forge output above is"
          echo "the reason; the container stays up so it can be read."
          echo "============================================================"
        fi

        # Anvil stays in the foreground either way. Exiting here would let
        # `restart: unless-stopped` crash-loop the container, which replaces a
        # readable log with a scrolling one.
        wait $$ANVIL_PID
    volumes:
      - ./packages/contracts:/contracts
    ports:
      - '8545:8545'
    restart: unless-stopped
    logging: *default-logging
    # Healthy means THE SETTLEMENT TOPOLOGY IS DEPLOYED, not merely that the
    # RPC answers. `cast client` succeeds the moment anvil binds, which is
    # seconds before `forge script` finishes deploying — and everything
    # downstream that waits on this health gate then races the deploy:
    #
    #   * `EvmSettlementBackend::connect` resolves getTokenNetwork() through
    #     the registry and refuses to start when it comes back empty, so the
    #     connector dies with "failed to decode empty bytes" (observed
    #     exactly this, via local/'s solo topology).
    #   * a `cast send` of `mint(...)` to an address with NO CODE does not
    #     revert — it is an ordinary call to a plain account — so funding
    #     scripts report success having minted nothing.
    #   * issue #104's original symptom was this same class: the faucet
    #     reporting tokenReady:true with no token on-chain.
    #
    # `cast code` on the TokenNetworkRegistry returns `0x` until the deploy
    # lands, and its bytecode after. The address is the deterministic output
    # of DeployLocal.s.sol run by account 0 at a fixed nonce, which is the
    # same reason a committed config can name it.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "test \"$$(cast code 0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512 --rpc-url http://localhost:8545 2>/dev/null)\" != '0x' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Token Faucet - Provides USDC on Solana devnet and Base Sepolia
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  faucet:
    build:
      # Build context is the repo ROOT (not packages/faucet) so the Dockerfile
      # can COPY packages/faucet/ by its repo-relative path, matching
      # infra/linode-faucet/docker-compose.faucet.yml. See packages/faucet/Dockerfile.
      context: .
      dockerfile: packages/faucet/Dockerfile
    # Runs under BOTH evm and solana so it comes up alongside either local
    # chain tier. It has no local-anvil leg (local EVM is funded from genesis
    # plus mint-on-demand, never a faucet — see CLAUDE.md); its Solana route
    # NO-OPs with a clear 503 when its env isn't set, so an evm-only `up`
    # still works.
    profiles:
      - evm
      - solana
      - app # issue #221 — reused by the app profile
    environment:
      PORT: 3500

      # ── Solana (only active under the `solana` profile) ──
      # Mint authority keypair mounted below; deterministic local-validator USDC
      # mint from infra/solana/create-usdc-mint.sh, whose authority IS that
      # keypair. USDC only (no SOL): 1000 USDC per request.
      SOLANA_RPC_URL: http://solana-validator:8899
      SOLANA_USDC_MINT: H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H
      SOLANA_FAUCET_KEYPAIR: /keys/usdc-authority.json

    volumes:
      # Committed throwaway devnet treasury authority (mint authority + USDC
      # source). Read-only; only present/used under the solana profile.
      - ./infra/solana/usdc-authority.json:/keys/usdc-authority.json:ro
    ports:
      - '3500:3500'
    depends_on:
      # required:false so the faucet can also run under the `solana` profile
      # (where anvil isn't started) without compose erroring on the missing dep.
      # Under the evm profile anvil IS started, so the health gate still applies.
      anvil:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3500/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Solana Test Validator - Local Solana with Auto-Deployed Programs
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  solana-validator:
    image: ghcr.io/beeman/solana-test-validator:latest
    profiles:
      - solana
    entrypoint: []
    command:
      - sh
      - /entrypoint.sh
    volumes:
      - ./infra/solana/entrypoint.sh:/entrypoint.sh:ro
      # No committed fee-payer keypair: the entrypoint reuses the genesis-funded
      # validator-identity keypair the validator writes into its ledger dir as the
      # deploy fee-payer (the beeman image has no solana-keygen). The program id
      # stays deterministic via the mounted program keypair in /programs.
      # See infra/solana/entrypoint.sh.
      - ./target/deploy:/programs:ro
    # Validator ledger (genesis keypairs + state) lives in the container's
    # writable layer (DISK), not tmpfs. A RAM-backed tmpfs ledger fills under the
    # accounts/snapshot growth and the validator FREEZES after a few thousand
    # slots (observed on 2GB and 8GB alike); disk-backed keeps it producing. The
    # entrypoint's `--reset` still wipes it on every start, so chains stay
    # deterministic. `--limit-ledger-size` (entrypoint) caps growth.
    ports:
      - '8899:8899'
      - '8900:8900'
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    # Bounded json-file logs (10m x 3 = 30 MB) so a chatty or crash-looping
    # validator can't fill the box disk via /var/lib/docker. The validator was
    # observed writing a 121 MB UNROTATED log; the prior 50m x 3 cap (~150 MB)
    # still allowed that, so this tightens it to a true 30 MB. The ledger itself
    # is bounded separately by --limit-ledger-size in entrypoint.sh. See the
    # x-logging anchor at the top of this file for the full incident note.
    logging: *default-logging
    # NB: /health returning "ok" only proves RPC is up — it does NOT prove the
    # validator is still producing blocks. A disk-full validator freezes its slot
    # yet stays "healthy" here; monitor getSlot advancing (and disk) out-of-band.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8899/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
