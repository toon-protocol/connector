# Local Blockchain Development Infrastructure
# Docker Compose with profiles for selective chain startup.
#
# Usage:
#   make anvil-up      Start Anvil + Faucet (EVM)
#   make anvil-down    Stop EVM services
#   make anvil-logs    Follow EVM logs
#   make solana-up     Start Solana test validator
#   make solana-down   Stop Solana services
#   make solana-logs   Follow Solana logs
#   make infra-up      Start every chain the connector settles on (EVM + Solana)
#   make infra-down    Stop them (preserves volumes)

# ── One project name, wherever this file is run from ──
# Compose defaults the project name to the basename of the directory holding
# this file, and prefixes every container, network and named volume with it.
# That made the same repository produce different, mutually invisible stacks:
# `connector-anvil-1` from the main checkout, `agent-a00677d430ef-anvil-1` from
# a git worktree of it. `make local-down` only removes the project it is
# standing in, so a stack started from a worktree survived a `make local-down`
# in the main checkout while still holding 8545/8899 — and, worse, its named
# state volumes survived with it. `local/README.md` is explicit that those must
# NOT outlive a run: a claim journal left behind satisfies the next run's money
# assertion without that run having paid anything. This machine carried a
# `connector_solo-state` volume for two days that way (issue #1122).
#
# Naming the project here rather than exporting COMPOSE_PROJECT_NAME from the
# Makefile is deliberate: `local/README.md` and the headers under `local/`
# document a hand-run `docker compose -f docker-compose.yml -f local/<t>/compose.yml`,
# and that path has to land in the same project as `make local-up` or the two
# would go back to being invisible to each other.
#
# One name means one stack per machine, which is what the machine can actually
# hold: every topology publishes 8545, 8899 and the connectors' client edges,
# so a second stack could never have run anyway — it would have failed on a
# port bind, half-started, and been unreachable from the other checkout's
# `make local-down`. `local/stack-guard.sh` turns that into a refusal that
# names the directory and topology already holding the stack.
name: connector

# ── Shared json-file log rotation for the long-running dev-chain services ──
# Incident 2026-06-26: on the self-hosted devnet box the solana-validator wrote
# a 121 MB UNROTATED Docker json log (it prints a status line ~30x/sec) on top
# of an oversized rocksdb ledger, which helped fill the box disk to 100%. A full
# disk silently FREEZES Solana block production (slot stops advancing) while
# /health still returns "ok", so faucet/settlement writes hang then 500
# ("Transaction was not confirmed in 30s") with no obvious cause. anvil and the
# faucet are similarly chatty. Cap every such service's container log
# at 30 MB total (10 MB x 3 rotated files) so logs can never fill /var/lib/docker.
# (The solana ledger itself is bounded separately by --limit-ledger-size in
# infra/solana/entrypoint.sh — the two together are the durable disk-full fix.)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Anvil - local Ethereum with x402 and an ERC-3009 USDC placed at start
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # ADR 0075 decision 13: `x402BatchSettlement` and its collectors at their
  # canonical addresses and Circle's FiatToken v2.2 as USDC, placed from the
  # committed bytecode under crates/connector-settlement-evm/contracts/ by
  # infra/anvil/seed.sh -- the same bytes, placed the same way, as the tier-3
  # tests' `X402Chain::place`. `seed.sh`'s header has the address table.
  #
  # No Solidity toolchain and no source tree: nothing is compiled here, so
  # this service mounts only what it reads, READ-ONLY, and writes nothing a
  # developer owns. (It used to bind-mount ./packages/contracts read-write and
  # run `forge script DeployLocal.s.sol` against it, which is why it once had
  # to run as the invoking user and install pinned foundry libs; none of that
  # applies to a container that only reads committed hex.)
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles:
      - evm
      - app # issue #221 — reused by the app profile
    entrypoint: []
    command: ['sh', '/anvil/entrypoint.sh']
    volumes:
      - ./infra/anvil:/anvil:ro
      - ./crates/connector-settlement-evm/contracts:/evm:ro
    ports:
      - '8545:8545'
    restart: unless-stopped
    logging: *default-logging
    # Healthy means THE CHAIN IS SEEDED, not merely that the RPC answers.
    # `cast client` succeeds the moment anvil binds, seconds before seed.sh
    # finishes -- and everything downstream that waits on this gate would
    # then race the seed: a node refusing to start over a token with no code,
    # or a `cast send ... mint(...)` to a codeless address that does not
    # revert and funds nobody.
    #
    # The address is the LAST thing seed.sh creates -- the TokenNetwork the
    # connector still boots through until #1385 -- and seed.sh runs under
    # `set -e`, so code there means every step before it landed too.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "cast code 0x75537828f2ce51be7289709686A69CbFDbB714F1 --rpc-url http://localhost:8545 2>/dev/null | grep -Eq '^0x[0-9a-fA-F]+$$' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Token Faucet - Provides USDC on Solana devnet and Base Sepolia
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  faucet:
    build:
      # Build context is the repo ROOT (not packages/faucet) so the Dockerfile
      # can COPY packages/faucet/ by its repo-relative path, matching
      # infra/linode-faucet/docker-compose.faucet.yml. See packages/faucet/Dockerfile.
      context: .
      dockerfile: packages/faucet/Dockerfile
    # Runs under BOTH evm and solana so it comes up alongside either local
    # chain tier. It has no local-anvil leg (local EVM is funded from genesis
    # plus mint-on-demand, never a faucet — see CLAUDE.md); its Solana route
    # NO-OPs with a clear 503 when its env isn't set, so an evm-only `up`
    # still works.
    profiles:
      - evm
      - solana
      - app # issue #221 — reused by the app profile
    environment:
      PORT: 3500

      # ── Solana (only active under the `solana` profile) ──
      # Mint authority keypair mounted below; deterministic local-validator USDC
      # mint from infra/solana/create-usdc-mint.sh, whose authority IS that
      # keypair. USDC only (no SOL): 1000 USDC per request.
      SOLANA_RPC_URL: http://solana-validator:8899
      SOLANA_USDC_MINT: H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H
      SOLANA_FAUCET_KEYPAIR: /keys/usdc-authority.json

    volumes:
      # Committed throwaway devnet treasury authority (mint authority + USDC
      # source). Read-only; only present/used under the solana profile.
      - ./infra/solana/usdc-authority.json:/keys/usdc-authority.json:ro
    ports:
      - '3500:3500'
    depends_on:
      # required:false so the faucet can also run under the `solana` profile
      # (where anvil isn't started) without compose erroring on the missing dep.
      # Under the evm profile anvil IS started, so the health gate still applies.
      anvil:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3500/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Solana Test Validator - Local Solana with Auto-Deployed Programs
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  solana-validator:
    image: ghcr.io/beeman/solana-test-validator:latest
    profiles:
      - solana
    entrypoint: []
    command:
      - sh
      - /entrypoint.sh
    volumes:
      - ./infra/solana/entrypoint.sh:/entrypoint.sh:ro
      # No committed fee-payer keypair: the entrypoint reuses the genesis-funded
      # validator-identity keypair the validator writes into its ledger dir as the
      # deploy fee-payer (the beeman image has no solana-keygen). The program id
      # stays deterministic via the mounted program keypair in /programs.
      # See infra/solana/entrypoint.sh.
      - ./target/deploy:/programs:ro
      # solana-foundation's `payment-channels` and mainnet's p-token, the
      # programs every local channel lives on (ADR 0075 decision 13): the same
      # pinned, hash-checked dumps the in-process harness loads.
      - ./crates/connector-settlement-solana/fixtures:/fixtures:ro
    # Validator ledger (genesis keypairs + state) lives in the container's
    # writable layer (DISK), not tmpfs. A RAM-backed tmpfs ledger fills under the
    # accounts/snapshot growth and the validator FREEZES after a few thousand
    # slots (observed on 2GB and 8GB alike); disk-backed keeps it producing. The
    # entrypoint's `--reset` still wipes it on every start, so chains stay
    # deterministic. `--limit-ledger-size` (entrypoint) caps growth.
    ports:
      - '8899:8899'
      - '8900:8900'
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    # Bounded json-file logs (10m x 3 = 30 MB) so a chatty or crash-looping
    # validator can't fill the box disk via /var/lib/docker. The validator was
    # observed writing a 121 MB UNROTATED log; the prior 50m x 3 cap (~150 MB)
    # still allowed that, so this tightens it to a true 30 MB. The ledger itself
    # is bounded separately by --limit-ledger-size in entrypoint.sh. See the
    # x-logging anchor at the top of this file for the full incident note.
    logging: *default-logging
    # NB: /health returning "ok" only proves RPC is up — it does NOT prove the
    # validator is still producing blocks. A disk-full validator freezes its slot
    # yet stays "healthy" here; monitor getSlot advancing (and disk) out-of-band.
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8899/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
