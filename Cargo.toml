# NOTE on Cargo.lock (issue #567): blake3 (1.5.5), zeroize (1.8.1),
# zeroize_derive (1.4.2), proc-macro-crate (3.1.0) and indexmap (2.11.4) are
# deliberately held back in the lockfile. Newer versions of their dependency
# chains require Rust's 2024 edition, which the Solana SBF toolchain's frozen
# `cargo 1.79.0` cannot parse -- a blanket `cargo update` that floats them
# forward breaks `cargo build-sbf` for packages/solana-program (and with it
# connector-settlement-solana's validator-backed tests and CI's
# solana-program job on a cold cache). See
# packages/solana-program/deployments/devnet-public.md, "Reproducible-build
# comparison".
[workspace]
resolver = "2"
members = [
    "packages/solana-program",
    "crates/connector-btp",
    "crates/connector-domain",
    "crates/connector-runtime",
    "crates/connector-chain-rpc",
    "crates/connector-settlement",
    "crates/connector-settlement-evm",
    "crates/connector-settlement-solana",
    "crates/connector-rate-source",
    "crates/connector-rate-source-evm",
    "crates/connector-signer",
    "crates/connector-config",
    "crates/connector-peer-auth",
    "crates/connector-peer-btp",
    "crates/connector-peer-http",
    "crates/connector-client-edge",
    "crates/connector-operator",
    "crates/connector-cli",
    "crates/connector-bin",
    "crates/connector-vectors",
]

[workspace.package]
edition = "2021"
license = "MIT"
