# =============================================================================
# local/onion -- two connectors that CANNOT reach each other, peered over a
# real onion network.
#
# Merged ON TOP of the repository-root docker-compose.yml so the chains are the
# SAME services `make anvil-up` brings up:
#
#   docker compose -f docker-compose.yml -f local/onion/compose.yml \
#     --profile evm --profile solana --profile onion up -d
#
# `make local-up LOCAL_TOPOLOGY=onion` does exactly that, with one extra step
# no other topology needs -- see "The addresses do not exist yet" below.
#
# ── Why there are two networks ───────────────────────────────────────────────
#
# ADR 0070's Consequences are explicit that a fulfilled packet proves nothing
# about the circuit: a SOCKS dial that silently fell back to a direct
# connection would go green. So a direct dial has to be STRUCTURALLY
# IMPOSSIBLE, not merely unobserved, and docker gives that if it is asked for
# deliberately:
#
#   * `connector-a` and its `anon-a` sidecar sit on `onion-a`; `connector-b`,
#     its `anon-b` sidecar and the app behind it sit on `onion-b`.
#   * Containers on different user-defined bridge networks do not route to
#     each other, and docker's embedded DNS is PER NETWORK, so neither
#     connector can resolve the other's service name either. The only names
#     each has for the other are hidden-service ones.
#   * `anvil` joins BOTH, because both nodes settle on it. A container on two
#     bridges is not a router: it forwards nothing between them.
#   * Neither network is marked `internal`, and that is required: the `anon`
#     daemons have to reach the real onion network. What is isolated here is
#     the two networks from EACH OTHER.
#   * `connector-b` publishes NO host port. Its only door is the circuit.
#
# ── A peering is established from BOTH ends, so both nodes are onion nodes ────
#
# ADR 0075 decision 4: a peering is two one-way x402 channels, and each node
# is sent a `POST /peers` naming the OTHER's self-description URL -- A reads
# B's to open its channel toward B, and B reads A's to bind the voucher signer
# A's channel is signed by. On this topology the only way either reaches the
# other is a circuit, so EACH sidecar now does both jobs for its own node: it
# publishes that node's hidden service, and it is the SOCKS5 proxy that node
# dials the other's through. Two daemons, not one, because a single daemon
# reachable from both networks would be a process bridging exactly the two
# networks this file went to the trouble of separating (ADR 0070 decision 8).
#
# ── The addresses do not exist yet ───────────────────────────────────────────
#
# Each daemon generates its address, into `HiddenServiceDir/hostname`, the
# first time it runs. The connector never reads that file (ADR 0070 decision
# 7): the OPERATOR copies it into `[node]`. `local/keys.sh onion` plays the
# operator -- it starts both sidecars, reads both addresses, and renders the
# committed `local/onion/*.toml` into `local/.keys/onion/<node>/connector.toml`
# with each placeholder substituted. THAT RENDERED FILE IS WHAT THE MOUNTS
# BELOW NAME.
#
# ── BTP, deliberately ────────────────────────────────────────────────────────
#
# B publishes `ws://<addr>.anyone/ilp/btp`, and `POST /peers` prefers BTP
# wherever a node publishes both. The HTTP carriage asks its own client for a
# proxy; the websocket library the BTP carriage speaks has none at all, so its
# onion path builds a SOCKS5 stream itself -- the larger of the two carriage
# changes and the one a loopback fake can least stand in for. The client edge,
# the self-description and the claim-state ask ride the SAME onion service on
# the same port, because they are the same listener.
# =============================================================================

services:
  # ── A's hidden service, and A's way onto the onion network ─────────────────
  anon-a:
    # BUILT, not pulled (issue #1284): ghcr publishes no image for the daemon
    # release whose hidden-service TLD is `.anyone`.
    build:
      context: ./local/anon-image
    image: anon-live:v0.4.10.2
    profiles: [onion]
    init: true
    volumes:
      # PATHS ARE RELATIVE TO THE REPOSITORY ROOT, not to this file: compose
      # resolves relative bind mounts against the directory of the FIRST `-f`.
      - ./local/onion/anonrc-a:/etc/anon/anonrc:ro
      # The DataDirectory, holding the hidden service's key: a NAMED volume,
      # so the address survives a restart -- ADR 0070's Consequences call an
      # unpersisted one a config that goes stale on every counterparty
      # SILENTLY -- and `make local-down` removes it with everything else.
      - onion-a-anon:/var/lib/anon
    networks: [onion-a]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # Both halves. The hostname file appears at key generation, long before
      # the descriptor is published; `Bootstrapped 100%` is the first moment a
      # SOCKS request can be answered or the descriptor published.
      test:
        - 'CMD-SHELL'
        - "test -s /var/lib/anon/hidden_service/hostname && grep -q 'Bootstrapped 100%' /var/lib/anon/notice.log"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  # ── B's hidden service, and B's way onto the onion network ─────────────────
  # Its `HiddenServicePort` names `connector-b` by a FIXED IP rather than by
  # service name, and that is forced: `anon` resolves that target when it
  # PARSES its config, and this daemon starts before `connector-b` exists. The
  # same is true of `anon-a` and `connector-a`. See anonrc-b.
  anon-b:
    build:
      context: ./local/anon-image
    image: anon-live:v0.4.10.2
    profiles: [onion]
    init: true
    volumes:
      - ./local/onion/anonrc-b:/etc/anon/anonrc:ro
      - onion-b-anon:/var/lib/anon
    networks: [onion-b]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "test -s /var/lib/anon/hidden_service/hostname && grep -q 'Bootstrapped 100%' /var/lib/anon/notice.log"
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  # ── The payment-oblivious app, behind B ────────────────────────────────────
  # On B's network only: the sender cannot reach it, so "the app was reached"
  # is evidence a packet crossed the peering.
  stub-app:
    image: connector-rust:local
    profiles: [onion]
    entrypoint: ['/usr/local/bin/stub-app']
    command: ['0.0.0.0:3100']
    expose:
      - '3100'
    networks: [onion-b]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── B: the accepting half, reachable only at its hidden-service address ────
  connector-b:
    image: connector-rust:local
    profiles: [onion]
    command: ['/app/config/connector.toml']
    volumes:
      # THE RENDERED CONFIG, not the committed one: `local/keys.sh onion`
      # writes it into this node's own key directory with the daemons' real
      # addresses substituted for the committed placeholders.
      - ./local/.keys/onion/connector-b/connector.toml:/app/config/connector.toml:ro
      - ./local/.keys/onion/connector-b:/app/data:ro
      - onion-b-state:/app/state
    networks:
      onion-b:
        # FIXED, because `anon-b`'s HiddenServicePort names this address and
        # resolves it when it PARSES its config -- long before this container
        # exists. See anonrc-b.
        ipv4_address: 172.31.0.10
    # NO `ports`: the claim this topology makes is that the circuit is the only
    # way in. `local/keys.sh onion channels` writes to this node from INSIDE
    # its own container, over its loopback, for the same reason.
    depends_on:
      anvil:
        condition: service_healthy
      stub-app:
        condition: service_started
      # B's own peering write reads A's self-description through this daemon,
      # and its descriptor has to be publishable before A can dial in.
      anon-b:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # 127.0.0.1, NOT localhost: `client_edge_addr = "0.0.0.0:3000"` binds
      # IPv4 only, and `localhost` inside the container resolves `::1` first.
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── A: the dialing half, and the node the rehearsal is handed to ───────────
  connector-a:
    image: connector-rust:local
    profiles: [onion]
    command: ['/app/config/connector.toml']
    volumes:
      - ./local/.keys/onion/connector-a/connector.toml:/app/config/connector.toml:ro
      - ./local/.keys/onion/connector-a:/app/data:ro
      - onion-a-state:/app/state
    networks:
      onion-a:
        # FIXED, for anonrc-b's reason applied to anonrc-a: `anon-a`'s
        # HiddenServicePort names this address at parse time.
        ipv4_address: 172.29.0.10
    ports:
      # Published to loopback only, on a port no other topology uses. This
      # reaches A and nothing beyond it -- there is no route from here to B,
      # and a published port is not one either.
      - '127.0.0.1:3006:3000'
    depends_on:
      anvil:
        condition: service_healthy
      # A's peer dial, its claim-state ask and B's reading of A's
      # self-description all go through a daemon, so a bootstrapping one is
      # the difference between a peering and a `T01`.
      anon-a:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── The rehearsal ──────────────────────────────────────────────────────────
  # Its own profile so `up` never starts it: a one-shot that exits 0 or 1, run
  # by `make local-rehearse` via `docker compose run --rm`.
  #
  # It sits on A's network, so its `--seal-to` -- B's self-description, whose
  # identity the payload is sealed to (ADR 0018) -- can only be fetched over
  # the circuit. That is what `--socks-proxy` is doing here, and it is the same
  # host-selected rule applied to two URLs independently (ADR 0070 decision 5):
  # `--operator` names a container on this network and goes direct, `--seal-to`
  # names a hidden-service host and goes through `anon-a`.
  #
  # First the chain (A's channel toward B, read off `x402BatchSettlement`),
  # then TWO CROSSINGS and B's own voucher journal, exactly as `two-hop` does
  # and for the same reasons -- a voucher's verdict never gates the packet, and
  # the second crossing is the one issue #1102 broke.
  #
  # HERE THERE IS A THIRD REASON, and it is this topology's own: a fulfil says
  # nothing about the circuit. What the journal read adds is that the vouchers
  # arrived at all, over the only route into that network. And B's route is
  # pinned to ILP-over-HTTP while A peers over BTP (connector-b.toml), so a
  # crossing that reached B's app arrived in the PEER role, on a voucher from
  # the channel B bound to the peering.
  sender:
    image: connector-rust:local
    profiles: [sender]
    entrypoint: ['/bin/sh', '-c']
    networks: [onion-a]
    command:
      - |
        set -e
        . /app/rehearsal.sh
        # Figures and arithmetic as `two-hop`'s, with a larger fee so the two
        # topologies cannot mask each other's drift: A collects 1200, keeps
        # its 200 (keys.sh's table), and forwards B's committed price of 1000.
        AMOUNT=1200
        PRICE=1000
        FEE=200
        CROSSINGS=2
        DEPOSIT=100000000
        PROXY=socks5h://anon-a:9050
        if [ "$$((AMOUNT - PRICE))" != "$$FEE" ]; then
          echo "AMOUNT - PRICE is not FEE: this rehearsal's own figures disagree." >&2
          exit 1
        fi
        # B's self-description URL, as keys.sh read it out of anon-b's own
        # HiddenServiceDir/hostname -- never a committed value.
        if [ ! -s /app/b-onion-hostname ]; then
          echo "local/keys.sh onion never recorded B's hidden-service address." >&2
          exit 1
        fi
        SEAL_TO="http://$$(cat /app/b-onion-hostname)/ilp"
        echo "--- B is at $$SEAL_TO, reached through $$PROXY"
        CHANNEL=$$(peering_key a-b)
        channel_holds "$$CHANNEL" "$$DEPOSIT" a-b
        send() {
          /usr/local/bin/connector send \
            --operator     http://connector-a:3000 \
            --operator-key /app/data/operator-send.key \
            --to           g.local.onion.b.app \
            --seal-to      "$$SEAL_TO" \
            --socks-proxy  "$$PROXY" \
            --target       / \
            --amount       "$$AMOUNT" \
            --body         /app/data/payload.json \
            "$$@"
        }
        # A rendezvous takes a while on a fresh circuit, and a `--dry-run`
        # fetches B's self-description and sends no packet, so waiting costs no
        # crossing the money assertion would have to account for.
        echo '--- waiting for a circuit to B (connector send --dry-run reaches it or nothing does)'
        reached=0
        attempt=1
        while [ "$$attempt" -le 20 ]; do
          if send --dry-run >/dev/null 2>&1; then
            reached=1
            break
          fi
          echo "    attempt $$attempt: no rendezvous yet"
          attempt=$$((attempt + 1))
          sleep 15
        done
        if [ "$$reached" != "1" ]; then
          echo "B's self-description was unreachable over the circuit after 5 minutes." >&2
          echo "Nothing here can route to that container any other way, which is the point --" >&2
          echo "check 'docker compose logs anon-a anon-b' for the bootstrap." >&2
          send --dry-run || true
          exit 1
        fi
        echo '--- crossing 1: priced at B, covered by A before it is sent'
        send --expect-fulfill
        echo '--- crossing 2: the covering voucher must ADVANCE, not repeat'
        send --expect-fulfill
        paid /app/payee-state "$$CHANNEL" B "$$CROSSINGS" "$$PRICE"
        echo "--- the peering paid B for every crossing it carried, over the circuit"
    volumes:
      - ./local/.keys/onion/connector-a:/app/data:ro
      # B's recorded address -- one file, and nothing secret of B's.
      - ./local/.keys/onion/connector-b/onion-hostname:/app/b-onion-hostname:ro
      - ./local/.keys/onion/peerings:/app/peerings:ro
      - ./local/rehearsal.sh:/app/rehearsal.sh:ro
      # B's state volume, READ-ONLY, purely to read its voucher journal.
      - onion-b-state:/app/payee-state:ro

  # Both nodes settle on the one anvil, so it is on both networks -- and
  # forwards nothing between them.
  anvil:
    networks: [onion-a, onion-b]

# Pinned subnets, because each connector's address is pinned (see anonrc-a and
# anonrc-b). /24s, not /16s, and neither is local/anyone's 172.30.0.0/16: a
# pool that overlaps any other docker network on the machine is refused when
# compose creates it, which fails bring-up for a reason unrelated to anything
# this topology tests.
networks:
  onion-a:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  onion-b:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  onion-a-state:
  onion-b-state:
  # Each daemon's DataDirectory, hidden-service key included. Named volumes,
  # never bind mounts, so no hidden-service key ever sits on the host
  # filesystem where it could be committed.
  onion-a-anon:
  onion-b-anon:
