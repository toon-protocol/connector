# =============================================================================
# local/onion -- connector A, the node that DIALS an onion peer.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# A terminates nothing. Its only route to the app is a forward across the
# peering to B, and B is on a DIFFERENT docker network with no route to this
# one -- so a packet that comes back FULFILLed can only have crossed the
# circuit. That is the whole subject of this topology, and it is the reason
# the networks are split: ADR 0070's own Consequences say a fulfilled packet
# proves nothing about the circuit, so a SOCKS dial that silently fell back to
# a direct connection would go green. Here there is nothing to fall back to.
#
# THE .anyone HOSTS IN THESE FILES ARE PLACEHOLDERS (ADR 0070 decision 7). Each
# daemon generates its node's real address and the operator copies it down;
# `local/keys.sh onion` does that copying and renders the result into
# `local/.keys/onion/<node>/connector.toml`, which is what compose mounts.
#
# ── The peering is not in this file ──────────────────────────────────────────
#
# ADR 0075: a peering is two one-way x402 channels, established by a signed
# `POST /peers` on EACH end naming the other's self-description URL.
# `local/keys.sh onion channels` sends A one naming B's hidden-service URL --
# A reads B's self-description over the circuit, opens and funds its channel
# toward B on anvil, and dials B's `ws://<addr>.anyone/ilp/btp` from then on --
# and sends B one naming A's, which is why A now publishes a hidden service of
# its own (see `[node]` below). Its figures are in keys.sh's table: `a-b`'s fee
# of 200, and A's forwarding route `g.local.onion.b` at price 1200.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where this node's outbound channel and its vouchers are journaled (ADR 0075
# decision 8), and the runtime peering row is kept.
state_dir = "/app/state"

# ── The one SOCKS5 proxy this node dials onion endpoints through ─────────────
# ADR 0070 decision 3. `anon-a` is the sidecar on this node's network, run in
# the relationship this repository already has with `anvil` -- infra the node
# talks to, never something it contains (decision 8).
#
# `socks5h`, and the `h` is not a preference: `socks5://` resolves the host
# NAME locally and no resolver here can resolve a hidden-service one.
# `Config::load` refuses the other scheme by name.
#
# ONE key, and no per-peer twin. Which dials take it is read off each URL's own
# host: B's self-description, its BTP endpoint and its claim-state ask are at a
# `.anyone` host and go through here; `[settlement.evm] rpc_url` does not and
# goes direct, with no exemption written anywhere.
socks_proxy = "socks5h://anon-a:9050"

# `peer_allow_plaintext_endpoints` is deliberately ABSENT, and its absence is
# part of what this topology proves. Every plaintext URL this node dials sits
# at a hidden-service host, and ADR 0070 decision 2 permits the plaintext
# schemes there independently of that switch -- a v3 onion address IS the
# ed25519 key the circuit is authenticated to.

[signer]
key_file = "/app/data/signer.key"

# What A publishes at `GET /ilp` (ADR 0050), at A's OWN hidden-service address:
# B's `POST /peers` reads this document over the circuit to learn the voucher
# signer A's channel is signed by, and binds that channel to the peering. No
# other route to A exists from B's network.
[node]
addresses = ["g.local.onion.a"]
http_endpoint = "http://placeholderplaceholderplaceholderplaceholderplaceholdera.anyone/ilp"

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only, dialed direct ──────────────────────────────────────
# `local/solo/connector.toml` has why each value is what it is. Settlement RPC
# is not an onion endpoint and is not proxied (ADR 0070 decision 4): `anvil`
# is on both networks, and each node reaches it from its real address.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.evm.key]
key_file = "/app/data/settlement.key"
