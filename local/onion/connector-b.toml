# =============================================================================
# local/onion -- connector B, the node that is reachable ONLY at a
# hidden-service address.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# THE .anyone HOSTS BELOW ARE PLACEHOLDERS, committed as such on purpose (ADR
# 0070 decision 7). The `anon` daemon generates the real address into its
# `HiddenServiceDir/hostname` the first time it runs, and the OPERATOR copies
# it into `[node]`. The connector never reads that file and never speaks the
# daemon's control protocol. `local/keys.sh onion` plays the operator: it
# starts the sidecars, reads the addresses, and renders this file with them
# substituted into `local/.keys/onion/connector-b/connector.toml`, which is
# what compose actually mounts. A placeholder still ENDS IN `.anyone`, so this
# committed file loads through the real parser -- `local_topologies_load.rs`
# reads exactly these bytes.
#
# WHAT THIS NODE HAS THAT NO OTHER NODE UNDER local/ HAS: no clearnet address
# at all. It sits on its own docker network with no route to the node that
# dials it, and nothing publishes a host port for it. The only door is the
# circuit.
#
# B holds no peering row. `local/keys.sh onion channels` sends B a signed
# `POST /peers` naming A's hidden-service URL -- written from inside B's own
# container, since B has no other door -- which reads A's self-description
# through `anon-b` and binds the voucher signer of the channel A opens toward
# B (ADR 0075 decision 4).
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where B's inbound vouchers are journaled (`client-edge-claims.log`): the file
# the rehearsal reads to prove the peering was actually paid rather than
# merely traversed.
state_dir = "/app/state"

# CF-17: a peer carriage rides this node's own listener -- there is no second
# socket (ADR 0027) and, here, no second onion service either.
# `HiddenServicePort 80 172.31.0.10:3000` publishes ONE port, and `GET /ilp`
# (the self-description), `GET /ilp/btp` (the peering) and `POST /ilp` (the
# client edge A asks claim-state on) are all behind it. An onion address is a
# HOST: it changes where bytes are addressed and nothing about what is
# listening.
#
# `"btp"` rather than `"both"`: no ILP-over-HTTP peer carriage is mounted here
# at all, so A's packets can only arrive on BTP frames -- over the circuit,
# because there is no other route to this container.
peer_expose = "btp"

# B's own way out, for its own `POST /peers` naming A's hidden-service URL:
# `anon-b`, the sidecar on B's network, which also publishes B's service.
# `socks5h` for `connector-a.toml`'s reason.
socks_proxy = "socks5h://anon-b:9050"

[signer]
key_file = "/app/data/signer.key"

# ── What this node publishes about itself (ADR 0050) ─────────────────────────
# Both endpoints at B's hidden-service host. A's `POST /peers` prefers the BTP
# one, and asks claim-state at the HTTP one -- through its own proxy, because
# the host is an onion host (ADR 0070).
[node]
addresses = ["g.local.onion.b"]
http_endpoint = "http://placeholderplaceholderplaceholderplaceholderplaceholderb.anyone/ilp"
btp_endpoint = "ws://placeholderplaceholderplaceholderplaceholderplaceholderb.anyone/ilp/btp"

# ── The terminated route ─────────────────────────────────────────────────────
# `price = 1000`, paid by a voucher A signs BEFORE each packet is sent (ADR
# 0042, ADR 0075 decision 6) -- 1200 sent, A's fee of 200 kept, 1000
# forwarded, exactly this price.
#
# `transport = "http"` is the PEER-ROLE PROOF, mirrored from `two-hop`: A
# peers with B over BTP, a CLIENT arriving over BTP is refused a route pinned
# to ILP-over-HTTP (ADR 0072), and a PEER is not held to a client's pin -- so a
# crossing that reaches this app arrived on a voucher from the channel B bound
# to the peering.
[[routes]]
prefix = "g.local.onion.b.app"
handler_url = "http://stub-app:3100/"
price = 1000
transport = "http"

# The operator surface, for keys.sh's `POST /peers`, which is reached over B's
# own loopback from inside its container.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only, dialed direct ──────────────────────────────────────
# The same deployment A names (`local/solo/connector.toml` has why each value
# is what it is), reached from this node's real address: settlement RPC is not
# an onion endpoint (ADR 0070 decision 4).
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.evm.batch_settlement]
asset_eip712_name = "USDC"
asset_eip712_version = "2"
