# =============================================================================
# local/dealing -- connector C. The far side of the boundary.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# The mirror of A: one chain, one peering, no idea that the hop before B was
# denominated in anything else. A packet arriving here has crossed anvil and
# then the Solana validator, and its amount has been through a rate -- and this
# node cannot tell, because nothing on the wire says so and nothing needs to.
# The number it is paid is in the unit of the channel it is paid on, which is
# the only unit an amount has ever had (ADR 0071 decision 7).
#
# THIS NODE DECLARES NO `[[tokens]]`: dealing is a property of the hop that
# sits on a boundary, not of the path.
#
# The rehearsal's payload is sealed to THIS node's `[signer]` identity (ADR
# 0018) -- neither A nor B can open it.
#
# C holds no peering row. `local/keys.sh dealing channels` sends C a signed
# `POST /peers` naming B's URL, which binds B's Solana voucher signer; B's
# channel toward C shows up here when B posts its `open` to C's sponsor
# endpoint (ADR 0075 decision 3), in this topology's 9-decimal mint.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where C's inbound vouchers are journaled (`client-edge-claims.log`): the file
# the rehearsal reads to prove the crossing was paid for AT THE CONVERTED
# FIGURE rather than merely traversed.
state_dir = "/app/state"

# CF-17: the peer carriage rides this node's own listener, and B dials it over
# ILP-over-HTTP.
peer_expose = "http"

# C's own `POST /peers` reads B's self-description at a plaintext URL (CF-18).
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What C publishes at `GET /ilp` (ADR 0050): its URL, its Solana x402 terms,
# the sponsor endpoint B posts its `open` to, and its voucher signer.
[node]
addresses = ["g.local.dealing.b.c"]
http_endpoint = "http://connector-c:3000/ilp"

# ── The terminated route ─────────────────────────────────────────────────────
# `price = 0`, as `mixed-chain`'s C: what this hop is paid is the forwarded
# amount, 4350000 base units of the 9-decimal mock per crossing, on a real
# Solana voucher -- the CONVERTED figure, which is the whole subject.
#
# `transport = "btp"` is the PEER-ROLE PROOF (see `local/mixed-chain/
# connector-c.toml`): B pays C over ILP-over-HTTP, a client arriving over HTTP
# is refused a route pinned to BTP, and a peer is not held to a client's pin.
[[routes]]
prefix = "g.local.dealing.b.c.app"
handler_url = "http://stub-app:3100/"
price = 0
transport = "btp"

[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: Solana only, in this topology's own mint ─────────────────────
# The 9-decimal mock `local/keys.sh dealing` creates and asserts against this
# line; `decimals = 9` is checked against the mint's own at boot.
[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "5i3gfxLCbMdWppYxEsa55MNLkxwAZHsm3SqoJWyKFckX"
decimals = 9

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

[settlement.solana.batch_settlement]
min_sponsored_deposit = 1
