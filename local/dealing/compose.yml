# =============================================================================
# local/dealing -- three connectors, two peerings, TWO DENOMINATIONS.
#
# Merged ON TOP of the repository-root docker-compose.yml so the chains are the
# SAME services `make anvil-up` / `make solana-up` bring up, on one network:
#
#   docker compose -f docker-compose.yml -f local/dealing/compose.yml \
#     --profile evm --profile solana --profile dealing up -d
#
# `make local-up LOCAL_TOPOLOGY=dealing` does exactly that.
#
#   connector-a  --EVM peering-->  connector-b  --Solana peering-->  connector-c
#                6-decimal USDC    (DEALS)       9-decimal mock       stub-app
#
# The packet is originated at A's operator surface and terminates at C's app,
# and the DENOMINATION changes at B: 1100 µUSDC arrive, 4350000 base units of a
# nine-decimal mock leave, at a rate B has declared and a spread B earns
# (ADR 0071).
#
# `local/mixed-chain` is the same three-node shape on the same two chains and
# is NOT this: both of its legs hold 6-decimal USDC, it declares no
# `[[tokens]]`, and decision 2's absence rule leaves it on the ordinary
# unconverted path. This is the only stack in the repository where a shipped
# image converts anything. Both peerings are x402 ones, established by
# `local/keys.sh dealing channels` once the nodes are serving (ADR 0075).
# =============================================================================

services:
  # ── The payment-oblivious app, behind C ────────────────────────────────────
  stub-app:
    image: connector-rust:local
    profiles: [dealing]
    entrypoint: ['/usr/local/bin/stub-app']
    command: ['0.0.0.0:3100']
    expose:
      - '3100'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── C: Solana only, terminates the app's prefix ────────────────────────────
  # Brought up first and waited on by B, which is waited on by A: each node
  # dials the next, and a peering whose far side is not serving answers `T01
  # peer unreachable` rather than failing loudly, so an undefined start order
  # would make the first rehearsal a coin toss.
  connector-c:
    image: connector-rust:local
    profiles: [dealing]
    command: ['/app/config/connector.toml']
    # PATHS ARE RELATIVE TO THE REPOSITORY ROOT, not to this file. Compose
    # resolves relative bind mounts against the PROJECT directory, which is the
    # directory of the FIRST `-f` file -- always ./docker-compose.yml here.
    volumes:
      - ./local/dealing/connector-c.toml:/app/config/connector.toml:ro
      - ./local/.keys/dealing/connector-c:/app/data:ro
      # A NAMED volume, not a bind mount: the image creates /app/state owned by
      # uid 10001 so a fresh named volume inherits that ownership.
      - dealing-c-state:/app/state
    ports:
      - '127.0.0.1:3009:3000'
    depends_on:
      solana-validator:
        condition: service_healthy
      stub-app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # 127.0.0.1, NOT localhost: `client_edge_addr = "0.0.0.0:3000"` binds
      # IPv4 only, while `localhost` in-container resolves `::1` first.
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── B: the denomination boundary ───────────────────────────────────────────
  # The only container here that depends on BOTH chains being healthy, which is
  # the compose-level statement of what its config says: two settlement
  # backends, either of which failing to connect is a refuse-to-start -- and
  # since ADR 0071 those two tables are also where each of its peerings' TOKENS
  # are read from, so a boundary this node could not verify both ends of is a
  # node that does not start.
  connector-b:
    image: connector-rust:local
    profiles: [dealing]
    command: ['/app/config/connector.toml']
    volumes:
      - ./local/dealing/connector-b.toml:/app/config/connector.toml:ro
      - ./local/.keys/dealing/connector-b:/app/data:ro
      - dealing-b-state:/app/state
    ports:
      - '127.0.0.1:3008:3000'
    depends_on:
      anvil:
        condition: service_healthy
      solana-validator:
        condition: service_healthy
      connector-c:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── A: EVM only, and the node the rehearsal is handed to ───────────────────
  connector-a:
    image: connector-rust:local
    profiles: [dealing]
    command: ['/app/config/connector.toml']
    volumes:
      - ./local/dealing/connector-a.toml:/app/config/connector.toml:ro
      - ./local/.keys/dealing/connector-a:/app/data:ro
      - dealing-a-state:/app/state
    ports:
      - '127.0.0.1:3007:3000'
    depends_on:
      anvil:
        condition: service_healthy
      connector-b:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── The rehearsal ──────────────────────────────────────────────────────────
  # Its own profile so `up` never starts it: a one-shot that exits 0 or 1, run
  # by `make local-rehearse` via `docker compose run --rm`.
  #
  # First the chains: A's channel toward B off `x402BatchSettlement`, B's
  # toward C off `payment-channels` -- in this topology's own 9-decimal mint,
  # so its collateral is a thousand times the base units of the EVM leg's for
  # the same hundred tokens.
  #
  # TWO packets, for `local/two-hop`'s reason (issue #1102): one crossing
  # cannot see a payer re-signing the same cumulative amount forever. Two can.
  #
  # Then BOTH journals are read, and on this topology that pair is not two
  # spellings of one check. B's is 1100 per crossing, in µUSDC, unconverted:
  # A crosses no boundary. C's is 4350000 per crossing, in base units of a
  # nine-decimal token: B does. `--expect-fulfill` cannot see either -- AND ON
  # THIS TOPOLOGY IT WOULD MISS MORE THAN A FREE CROSSING. A boundary converting
  # at the wrong rate, or not converting at all, fulfils exactly as happily:
  # the packet reaches the app either way, and only the figure in C's journal
  # is different. That figure is the whole point of this stack, so it is what
  # is asserted, exactly.
  sender:
    image: connector-rust:local
    profiles: [sender]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        . /app/rehearsal.sh
        # 1200 is this path's COST (`CONTEXT.md`) IN THE SENDER'S OWN UNIT,
        # and on this topology that qualification is the whole of ADR 0071
        # decision 7: the sender pays A's posted price in µUSDC and never meets
        # a 9-decimal figure. 1200 leaves, A keeps its flat 100, and 1100 µUSDC
        # arrives at the boundary; what leaves it is
        #
        #   floor(1100 * 4000/1 * 99/100) - 6000 = 4350000
        #
        # base units of the 9-decimal mock (connector-b.toml has the long
        # version). A figure wrong at C and right at B is the RATE, the SPREAD
        # or the outgoing FEE having moved -- or the boundary not converting
        # at all, which would put 1100 there and fulfil every packet
        # regardless.
        AMOUNT=1200
        OWED_AT_B=1100
        OWED_AT_C=4350000
        CROSSINGS=2
        EVM_DEPOSIT=100000000
        SOLANA_DEPOSIT=100000000000
        A_B=$$(peering_key a-b)
        B_C=$$(peering_key b-c)
        channel_holds "$$A_B" "$$EVM_DEPOSIT" a-b
        channel_holds "$$B_C" "$$SOLANA_DEPOSIT" b-c
        send() {
          /usr/local/bin/connector send \
            --operator     http://connector-a:3000 \
            --operator-key /app/data/operator-send.key \
            --to           g.local.dealing.b.c.app \
            --seal-to      http://connector-c:3000/ilp \
            --target       / \
            --amount       "$$AMOUNT" \
            --body         /app/data/payload.json \
            --expect-fulfill
        }
        echo '--- crossing 1: A -> B (converts) -> C -> the app'
        send
        echo '--- crossing 2: a second covered crossing on BOTH peerings (issue #1102)'
        send
        # The a-b leg's PEER-ROLE PROOF: B's own route, pinned to the carriage A
        # does not pay B over (connector-b.toml). A client is refused it and a
        # peer is not, so reaching this app says A's channel is bound to the
        # peering -- the channel every voucher B's journal holds arrived on.
        echo '--- crossing 3: A -> B only, to the route B pins against clients'
        /usr/local/bin/connector send \
          --operator     http://connector-a:3000 \
          --operator-key /app/data/operator-send.key \
          --to           g.local.dealing.b.app \
          --seal-to      http://connector-b:3000/ilp \
          --target       / \
          --amount       "$$AMOUNT" \
          --body         /app/data/payload.json \
          --expect-fulfill
        # The two units, side by side, which is the whole topology in two
        # reads. B is paid in what arrived; C is paid in what the boundary
        # converted it into.
        paid /app/b-state "$$A_B" "B (EVM, 6dp USDC)" "$$((CROSSINGS + 1))" "$$OWED_AT_B"
        paid /app/c-state "$$B_C" "C (Solana, 9dp mock)" "$$CROSSINGS" "$$OWED_AT_C"
        echo "--- B was paid $$OWED_AT_B uUSDC and C $$OWED_AT_C base units per crossing: converted at the declared rate"
    volumes:
      # A's keys: the sender signs the operator write with A's allowlisted key
      # and posts the fixture body from the same directory.
      - ./local/.keys/dealing/connector-a:/app/data:ro
      # The peerings keys.sh established on this run -- each one's channel key.
      - ./local/.keys/dealing/peerings:/app/peerings:ro
      - ./local/rehearsal.sh:/app/rehearsal.sh:ro
      # The two payees' state volumes, READ-ONLY, purely to read their voucher
      # journals. The sender runs as the same uid 10001 that wrote them.
      - dealing-b-state:/app/b-state:ro
      - dealing-c-state:/app/c-state:ro

volumes:
  dealing-a-state:
  dealing-b-state:
  dealing-c-state:
