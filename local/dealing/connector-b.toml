# =============================================================================
# local/dealing -- connector B. THE DENOMINATION BOUNDARY.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# This is the file the topology exists for, and it is the ONLY COMMITTED CONFIG
# IN THIS REPOSITORY THAT DEALS. B is paid over a peering whose channel holds
# 6-decimal USDC on anvil and pays over one whose channel holds a 9-decimal
# mock SPL token on the local validator. Those are two different tokens, so
# every forward across this node is a CONVERSION (ADR 0071 decision 1): the
# outgoing amount is `floor(amount * rate) - fee`, the rate is one this file
# declares, and the fee is subtracted in the OUTGOING leg's unit.
#
# WHAT IS DIFFERENT FROM `local/mixed-chain`, WHICH IS THE SAME SHAPE: that
# B declares no `[[tokens]]`, so ADR 0071's absence rule leaves it on the
# ordinary `amount_after_fee` path. The whole of the difference between the
# two directories is the `[[tokens]]`, `[[rates]]` and `[rate_guards]` blocks
# below.
#
# WHAT IS THE SAME: the wire. No packet, header or voucher gained an asset
# field (decision 7). A voucher is denominated by the channel it is written
# on, so the voucher this node signs for C is an ordinary Solana voucher for an
# ordinary integer -- 4350000 of them per crossing -- and the one A signs for
# this node is an ordinary EIP-712 voucher for 1100.
#
# ── The peerings are not in this file ────────────────────────────────────────
#
# ADR 0075: each peering is two one-way x402 channels, established from a URL
# by a signed `POST /peers` on each end. `local/keys.sh dealing channels` makes
# this node's writes -- naming A's URL, and naming C's (opening B's channel
# toward C, in the 9-decimal mint, through C's sponsor endpoint) -- and holds
# the peering figures in its topology table: `b-c`'s fee of 6000 and cap of
# 1000000000, both in the OUTGOING 9-decimal unit (ADR 0071 decision 1 amends
# ADR 0061 in exactly that clause), and this node's forwarding route
# `g.local.dealing.b.c` at price 1100 -- in the INCOMING unit, the one a
# route's price is charged in.
#
# A runtime x402 peering has no `[[peers]]` row to resolve its token from, so
# the token each peering deals in is read off its own channel binding (#1382):
# its chain's `token_address` below. That is what the `[[tokens]]` rows name.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# B's inbound vouchers (A's, on EVM) and the vouchers B signs on its own
# Solana channel toward C are journaled here (ADR 0075 decision 8).
state_dir = "/app/state"

# `"http"` on both legs, and that is this topology declining to prove
# something twice: `local/mixed-chain` is where a shipped image carries a
# packet over BTP. What is unproven anywhere else is below the `[[tokens]]`
# block.
peer_expose = "http"
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What B publishes at `GET /ilp` (ADR 0050): the URL A's `POST /peers` dials
# and C's reads, with this node's x402 terms and voucher signers on both
# chains.
[node]
addresses = ["g.local.dealing.b"]
http_endpoint = "http://connector-b:3000/ilp"

# ── The PEER-ROLE PROOF on the a-b leg ─────────────────────────────────────
# B forwards everything else it is paid for, and a runtime forwarding route
# cannot be pinned -- so a voucher on A's channel would pay for a forward just
# as well if B had never bound that channel to the peering and admitted it as a
# CLIENT's. This one terminated route closes that: it is pinned to
# BTP, A pays B over ILP-over-HTTP, a client is refused a route pinned to
# the other carriage (ADR 0072), and a peer is not held to a client's pin. The
# rehearsal sends one packet here on the SAME channel as its forwards, so if it
# reaches this app, A's channel is bound to the peering -- and every voucher on
# it arrived in the peer role. Priced at exactly what A forwards (1100), so the
# journal read holds it to the same figure as every other crossing.
[[routes]]
prefix = "g.local.dealing.b.app"
handler_url = "http://stub-app:3100/"
price = 1100
transport = "btp"

# ── The operator surface, and the two jobs it has here ───────────────────────
# keys.sh's `POST /peers`, `POST /routes/peers` and `POST /channels/:id/fund`
# are signed with the allowlisted key. Its second job is new with ADR 0071 and
# is a READ: `GET /rates` reports every ordered pair this node deals, live or
# stale, out of the very table the forwarding path converts against (issue
# #1297) -- the page an operator of a dealing node looks at first.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── What this node deals (ADR 0071 decision 3) ───────────────────────────────
# One row per token this node holds a channel in: the EVM table's USDC and the
# Solana table's 9-decimal mock. EXACTLY ONE ROW IS THE NUMERAIRE, and USDC is
# it -- the stable thing every quote is taken against.
#
# Neither row carries a `quote`: there is no AMM on either disposable chain
# and no Solana-side `RateSource` exists, so this pair runs the STATIC ROW
# below -- decision 3's arm for "a pair that cannot self-source".
[[tokens]]
asset = "evm:0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
numeraire = true

[[tokens]]
asset = "solana:5i3gfxLCbMdWppYxEsa55MNLkxwAZHsm3SqoJWyKFckX"

# ── The rate, and the whole of the arithmetic ────────────────────────────────
# ORDERED, never sorted: this row prices `evm USDC -> solana mock` and says
# nothing about the other direction.
#
# 4000/1 is a MID over BASE UNITS, and it folds two independent things into
# one ratio (decision 4): the SCALE -- 10^6 base units of a 6-decimal token
# against 10^9 of a 9-decimal one, a factor of 1000 -- and the PRICE -- the
# mock is worth a quarter of a USDC here, another factor of 4. Nowhere in the
# connector are the two separable again, deliberately: scale is not price, and
# `[settlement] decimals` stays a boot-time assertion against the chain rather
# than an input to value arithmetic.
#
# A static row NEVER GOES STALE -- `ttl` governs an observation, and an
# operator's declaration is not one -- which is why this topology rehearses
# the same an hour after bring-up.
[[rates]]
from = "evm:0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
to = "solana:5i3gfxLCbMdWppYxEsa55MNLkxwAZHsm3SqoJWyKFckX"
rate = { numerator = 4000, denominator = 1 }

# ── The three guards (ADR 0071 decision 5) ───────────────────────────────────
# Required as a set the moment any `[[rates]]` row exists.
#
# `spread` IS WHAT THIS HOP EARNS FOR DEALING, a separate earnings stream from
# the flat fee (decision 8), applied against the sender: 4000/1 at 1/100 deals
# at 3960/1. So one packet's arithmetic, end to end, is:
#
#     1100 arrive          (1200 sent, A keeps its flat 100)
#     x 3960/1             (the 4000 mid, less this node's 1% spread)
#     = 4356000            floor, always the connector's way (decision 4)
#     - 6000               this node's flat fee on the `b-c` peering
#     = 4350000            forwarded, and the figure the covering voucher
#                          advances C's watermark by
#
# The rehearsal reads C's journal for 4350000 per crossing, which is wrong if
# the rate, the spread or the fee moved.
#
# `ttl_secs` and `max_move` govern OBSERVATIONS and bind nothing on a static
# row; they are written because the guard set is all-or-nothing.
[rate_guards]
spread = { numerator = 1, denominator = 100 }
ttl_secs = 300
max_move = { numerator = 5, denominator = 100 }

# ── Settlement: BOTH chains ──────────────────────────────────────────────────
# `local/solo/connector.toml` has why each EVM value is what it is. The Solana
# table settles in THIS TOPOLOGY'S OWN 9-decimal mint, created by
# `local/keys.sh dealing` from a keypair derived at a fixed index of the
# public anvil mnemonic -- so the address is committable -- and asserted
# against this line by that script. `decimals = 9` is checked against the
# mint's own at boot.
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.evm.batch_settlement]
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "5i3gfxLCbMdWppYxEsa55MNLkxwAZHsm3SqoJWyKFckX"
decimals = 9

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

[settlement.solana.batch_settlement]
min_sponsored_deposit = 1
