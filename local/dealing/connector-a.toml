# =============================================================================
# local/dealing -- connector A. The ORDINARY end, and that is its whole job.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# A -> B on EVM, B -> C on Solana, and B sits on a real DENOMINATION boundary:
# 6-decimal USDC on the leg it is paid on, a 9-decimal mock SPL token on the
# leg it pays on. B converts at a rate it has declared (ADR 0071); this file
# declares nothing, deals nothing, and forwards exactly as it did before that
# record existed.
#
# THAT IS THE ASSERTION THIS FILE MAKES. `[[tokens]]` is absent here, so no
# forward A makes can resolve a boundary and the converting arm is not reached
# at all. ADR 0071 costs a node that deals nothing exactly nothing.
#
# ── The peering is not in this file ──────────────────────────────────────────
#
# ADR 0075: a peering is two one-way x402 channels, established by a signed
# `POST /peers` on each end (see `local/two-hop/connector-a.toml`).
# `local/keys.sh dealing channels` makes A's writes and holds A's figures in
# its topology table: `a-b`'s fee of 100, and the forwarding route
# `g.local.dealing.b` at price 1200.
#
# 1200 is this path's COST (`CONTEXT.md`) IN THIS NODE'S OWN UNIT. The path
# crosses a denomination at B, so no single unit could express the whole cost;
# A charges in µUSDC, keeps its flat 100 and forwards 1100 -- exactly B's
# route price, in the unit B's route is charged in.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where this node's outbound channel and its vouchers are journaled (ADR 0075
# decision 8).
state_dir = "/app/state"

# Issue #678, gap 3. B is a plain container port with no TLS terminator in
# front of it; the peering, B's self-description and the claim-state ask all
# reach it over plain HTTP (CF-18).
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What A publishes at `GET /ilp` (ADR 0050): the document B's `POST /peers`
# reads to bind A's channel.
[node]
addresses = ["g.local.dealing.a"]
http_endpoint = "http://connector-a:3000/ilp"

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only ─────────────────────────────────────────────────────
# `local/solo/connector.toml` has why each value is what it is.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.evm.key]
key_file = "/app/data/settlement.key"
