# =============================================================================
# local/two-hop -- connector B, the ACCEPTING half of the peering.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# B terminates the app's prefix and is paid over the peering. The packet the
# rehearsal sends is sealed to THIS node's `[signer]` identity, not to A's
# (ADR 0018): a payload is sealed to the connector that TERMINATES it, and A is
# a forwarding hop that cannot open it. `connector send`'s `--seal-to` says so.
#
# Like A, B holds no peering row. `local/keys.sh two-hop channels` sends B a
# signed `POST /peers` naming A's URL, which is how B learns A's voucher signer
# from A's self-description and binds the channel A opens toward it to the
# peering (ADR 0075 decision 4). B opens a channel of its own toward A in the
# same write -- a peering is two one-way channels -- which nothing in this
# topology ever pays on, since no packet flows from B to A.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where B's inbound vouchers are journaled -- `client-edge-claims.log`, the
# one book an x402 channel keeps whichever role its vouchers arrive under
# (`peer-carriage-spec.md` §1.8). It is the file the rehearsal reads to prove
# the peering was actually paid rather than merely traversed.
state_dir = "/app/state"

# CF-17: peer carriages ride this node's own listener, told apart from clients
# by authentication rather than by port -- there is no second socket (ADR
# 0027). `"http"` because this topology peers over ILP-over-HTTP; the BTP twin
# is `mixed-chain`'s first hop.
peer_expose = "http"

# B's own `POST /peers` reads A's self-description at
# `http://connector-a:3000/ilp`, which is plaintext (CF-18).
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What B publishes at `GET /ilp` (ADR 0050): the URL A's `POST /peers` dials,
# and -- off the `[settlement.evm]` table below -- the x402 terms A opens its
# channel on and the voucher signer A binds B's by. An http endpoint only, so
# A peers over ILP-over-HTTP: `POST /peers` prefers BTP wherever a node
# publishes both, and this topology is the HTTP one.
[node]
addresses = ["g.local.two-hop.b"]
http_endpoint = "http://connector-b:3000/ilp"

# ── The terminated route ─────────────────────────────────────────────────────
# `stub-app` is the connector image's second binary: it answers `POST /`, holds
# no secret and performs no cryptography, so it supplies nothing toward the
# packet's fulfilment -- the connector derives that itself from the sealed
# request (ADR 0019). The trailing slash on handler_url is load-bearing:
# `HttpAppClient::deliver` does `handler_url.join(&target)`, and RFC 3986 makes
# an absolute-path reference REPLACE the base's path.
#
# `price = 1000`: THIS NODE BOTH TERMINATES AND PRICES THIS ROUTE. A peer
# PREPARE to it must arrive carrying a voucher that advances the channel's
# watermark by at least the price, or it is refused `F06` with the x402
# greeting (`peer-carriage-spec.md` §3.1, issue #880). A covers every forward
# with a voucher BEFORE it is sent (ADR 0042, ADR 0075 decision 6), asking this
# node's `POST /ilp/claim-state` where its watermark stands -- which is what
# lets crossing 2 advance past crossing 1 rather than repeat it (issue #1102).
#
# The rehearsal sends 1100, A retains its `fee` of 100 and forwards 1000 --
# exactly this price, so the gate has no slack in either direction.
#
# `transport = "btp"`: THE PEER-ROLE PROOF. A CLIENT arriving over
# ILP-over-HTTP is refused a route pinned to BTP (ADR 0072), and a PEER is not
# held to a client's pin. A peers with B over HTTP, so a crossing that reaches
# this route at all arrived in the peer role -- on a voucher from a channel
# whose signer B bound to the peering. A voucher from an UNBOUND channel is
# admitted as a client's and would pay this price just as well, so without
# the pin nothing in the rehearsal could tell a peering from a paying client.
[[routes]]
prefix = "g.local.two-hop.b.app"
handler_url = "http://stub-app:3100/"
price = 1000
transport = "btp"

# The operator surface, because B is now written to: keys.sh's `POST /peers`
# is what binds A's channel. The bearer token gates reads, `write_keys` is the
# ed25519 PUBLIC-key allowlist (ADR 0008); both are files keys.sh writes.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only ─────────────────────────────────────────────────────
# The same chain, token and EIP-712 domain A names. It has to be: a peering is
# refused unless both nodes' x402 terms name the same network (`POST /peers`'
# `NetworkMismatch`), and a voucher is verified against the channel's own
# config on this chain.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.evm.key]
key_file = "/app/data/settlement.key"
