# =============================================================================
# local/two-hop -- two connectors, one peering, a packet that crosses it.
#
# Merged ON TOP of the repository-root docker-compose.yml so the chains are the
# SAME services `make anvil-up` brings up, on one network:
#
#   docker compose -f docker-compose.yml -f local/two-hop/compose.yml \
#     --profile evm --profile solana --profile two-hop up -d
#
# `make local-up LOCAL_TOPOLOGY=two-hop` does exactly that. One compose project
# means one network, which means the connectors reach the chain and each other
# by service name -- `anvil:8545`, `connector-b:3000`.
#
# This is the containerised counterpart of `crates/connector-cli/tests/
# peering_from_a_url.rs`, which proves the same x402 peering in-process against
# an anvil it spawns per test. What that cannot say anything about is the image:
# two of them, as uid 10001, each with its own mounted config, its own key
# files and its own state volume, discovering each other over a container
# network. That is this.
#
# The peering itself is not in any file here: `local/keys.sh two-hop channels`
# establishes it once both nodes are serving, with a signed `POST /peers` on
# each end (ADR 0075 decision 4). See local/README.md, "How a peering is
# established here".
# =============================================================================

services:
  # ── The payment-oblivious app, behind B ────────────────────────────────────
  # The connector image's second binary. Not published: only B dials it, which
  # is what makes "the app was reached" evidence that a packet crossed the
  # peering rather than something the host could arrange directly.
  stub-app:
    image: connector-rust:local
    profiles: [two-hop]
    entrypoint: ['/usr/local/bin/stub-app']
    command: ['0.0.0.0:3100']
    expose:
      - '3100'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ── B: the accepting half ──────────────────────────────────────────────────
  # Started first, and A waits on its health gate: A dials B, and a peering
  # whose far side is not yet serving answers `T01 peer unreachable` rather
  # than failing loudly, so bringing them up in an undefined order would make
  # the first rehearsal a coin toss.
  connector-b:
    image: connector-rust:local
    profiles: [two-hop]
    command: ['/app/config/connector.toml']
    # PATHS ARE RELATIVE TO THE REPOSITORY ROOT, not to this file. Compose
    # resolves relative bind mounts against the PROJECT directory, which is the
    # directory of the FIRST `-f` file -- always ./docker-compose.yml here.
    volumes:
      - ./local/two-hop/connector-b.toml:/app/config/connector.toml:ro
      # Written by local/keys.sh, gitignored, never committed (ADR 0012). One
      # directory per node, named after this service.
      - ./local/.keys/two-hop/connector-b:/app/data:ro
      # A NAMED volume, not a bind mount: the image creates /app/state owned by
      # uid 10001 so a fresh named volume inherits that ownership. A host bind
      # mount arrives root-owned and the connector refuses to start.
      - two-hop-b-state:/app/state
    ports:
      # Published to loopback only, on a port no other topology uses so two of
      # them can be up at once without a collision the operator has to diagnose.
      - '127.0.0.1:3002:3000'
    depends_on:
      anvil:
        condition: service_healthy
      stub-app:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # GET /ilp/identity is unauthenticated and free, and answering it means
      # the config loaded, the settlement backend connected, and the router is
      # serving. `docker ps` showing "Up" proves none of that.
      #
      # 127.0.0.1, NOT localhost. `client_edge_addr = "0.0.0.0:3000"` binds
      # IPv4 only, while `localhost` inside the container resolves `::1` first
      # -- so busybox wget gets "Connection refused" from a healthy connector.
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── A: the forwarding half, and the node the rehearsal is handed to ────────
  connector-a:
    image: connector-rust:local
    profiles: [two-hop]
    command: ['/app/config/connector.toml']
    volumes:
      - ./local/two-hop/connector-a.toml:/app/config/connector.toml:ro
      - ./local/.keys/two-hop/connector-a:/app/data:ro
      - two-hop-a-state:/app/state
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      anvil:
        condition: service_healthy
      connector-b:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── The rehearsal ──────────────────────────────────────────────────────────
  # Its own profile so `up` never starts it: a one-shot that exits 0 or 1, run
  # by `make local-rehearse` via `docker compose run --rm`.
  #
  # First the chain: A's channel toward B is read off `x402BatchSettlement`
  # itself and must still hold the collateral keys.sh topped it up to, before
  # anything is sent -- so a failure names the missing collateral rather than
  # a puzzling voucher further down.
  #
  # Then TWO packets. A covers each PREPARE with a voucher BEFORE it is sent
  # (ADR 0042, ADR 0075 decision 6), so crossing 1 arrives already paid for --
  # which is what lets B price the route it terminates. The second crossing is
  # what makes this a measurement rather than a demonstration, because it is
  # the one issue #1102 broke: a covering payer asks the payee where its
  # watermark stands, and a payee answering out of the wrong book reports zero
  # forever -- so crossing 2 re-signs crossing 1's amount, advances nothing,
  # and is refused `F06`. One crossing cannot see that; two can.
  #
  # Every crossing reaching B's route at all is ALSO the peer-role proof:
  # that route is pinned to BTP (connector-b.toml) and A peers over HTTP, so
  # only a voucher on a channel B bound to the peering gets through.
  #
  # Then B's own journal (local/rehearsal.sh's `paid`): exactly one voucher
  # per crossing on A's channel, each advancing B's watermark by exactly the
  # PRICE A forwarded. The operator's own packet pays A no fee (ADR 0061,
  # #1466), so A forwards the whole AMOUNT; the peering's fee is still above
  # zero (`local_topologies_load.rs`), so a node that charged it would forward
  # less than B's price and be refused.
  sender:
    image: connector-rust:local
    profiles: [sender]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        . /app/rehearsal.sh
        # The figures this rehearsal is written around, and the arithmetic
        # that relates them (ADR 0028, ADR 0010, issue #1144):
        #
        #   AMOUNT = PRICE -- the packet is the operator's own, so A charges
        #     it no fee (ADR 0061, #1466) and forwards all of it.
        #   PRICE  -- B's committed price, and therefore the whole of what A
        #     forwards, so the coverage gate has no slack.
        #   DEPOSIT -- what keys.sh topped A's channel up to.
        AMOUNT=1000
        PRICE=1000
        CROSSINGS=2
        DEPOSIT=100000000
        CHANNEL=$$(peering_key a-b)
        channel_holds "$$CHANNEL" "$$DEPOSIT" a-b
        send() {
          /usr/local/bin/connector send \
            --operator     http://connector-a:3000 \
            --operator-key /app/data/operator-send.key \
            --to           g.local.two-hop.b.app \
            --seal-to      http://connector-b:3000/ilp \
            --target       / \
            --amount       "$$AMOUNT" \
            --body         /app/data/payload.json \
            --expect-fulfill
        }
        # Probe before paying (ADR 0011): an amount-0 packet is refused, and
        # the refusal states what the path costs. A charges its operator's own
        # packet nothing, so the figure is B's PRICE and no more. It must be
        # asserted on the printed figure -- the probe exits zero on any cost.
        echo '--- probe: what does a packet to B cost, before any is sent'
        probed=$$(/usr/local/bin/connector probe \
          --operator     http://connector-a:3000 \
          --operator-key /app/data/operator-send.key \
          --to           g.local.two-hop.b.app \
          --seal-to      http://connector-b:3000/ilp \
          --target       / \
          --body         /app/data/payload.json \
          --json)
        echo "$$probed"
        case "$$probed" in
          *'"outcome":"complete"'*) ;;
          *)
            echo "PROBE: an amount-0 probe of B's priced route must read a complete sum." >&2
            exit 1
            ;;
        esac
        case "$$probed" in
          *'"accumulatedCost":'"$$PRICE"'}'* | *'"accumulatedCost":'"$$PRICE"',*) ;;
          *)
            echo "PROBE: the path to B must cost $$PRICE (B's price, A taking no fee)." >&2
            exit 1
            ;;
        esac
        echo '--- crossing 1: priced at B, covered by A before it is sent'
        send
        echo '--- crossing 2: the covering voucher must ADVANCE, not repeat'
        send
        paid /app/payee-state "$$CHANNEL" B "$$CROSSINGS" "$$PRICE"
        echo "--- the peering paid B $$PRICE for each of $$CROSSINGS crossings; A takes no fee on its operator's own packet"
    volumes:
      # A's keys: the sender signs the operator write with A's allowlisted key
      # and posts the fixture body from the same directory.
      - ./local/.keys/two-hop/connector-a:/app/data:ro
      # The peerings keys.sh established on this run -- each one's channel key.
      - ./local/.keys/two-hop/peerings:/app/peerings:ro
      - ./local/rehearsal.sh:/app/rehearsal.sh:ro
      # B's state volume, READ-ONLY, purely to read its voucher journal. The
      # sender runs as the same uid 10001 that wrote it.
      - two-hop-b-state:/app/payee-state:ro

volumes:
  two-hop-a-state:
  two-hop-b-state:
