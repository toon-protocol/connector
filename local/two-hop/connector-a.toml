# =============================================================================
# local/two-hop -- connector A, the FORWARDING half of the peering.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# A terminates nothing. Its only route to the app is a forward across the
# peering to B, so a packet that comes back FULFILLed can only have crossed
# it. That is the whole subject of this topology, and it is the containerised
# counterpart of `crates/connector-cli/tests/peering_from_a_url.rs`, which
# proves the same peering in-process against an anvil it spawns itself and
# therefore cannot say anything about the image.
#
# ── The peering is not in this file, on purpose ──────────────────────────────
#
# ADR 0075: every channel is an x402 `batch-settlement` channel, and a peering
# is TWO of them -- A->B carries A's vouchers to B, B->A carries B's to A. A
# peering is established from a URL (ADR 0058, as 0075 decision 4 amends it):
# each node is sent one signed `POST /peers` naming the other's
# self-description URL, opens and funds only ITS OWN outbound channel, and
# binds the other's channel toward it by the voucher signer the other's
# self-description publishes. Nobody pastes a key or a channel id anywhere, so
# there is no `[[peer_channels]]` row (which would name B's voucher signer) or
# `[[pay_channels]]` row (which would name A's own outbound channel) here --
# the runtime peering binds and registers both itself (ADR 0075, #1380).
#
# `local/keys.sh two-hop channels` makes those writes once both nodes are
# serving, and it is where this peering's facts live -- its `fee` (100), the
# forwarding route `g.local.two-hop.b` at `price` 1100 (`POST /routes/peers`),
# and the opening and topped-up deposits. They are operator writes against a
# running node, which is exactly what ADR 0058 made them; ADR 0009's config
# creates nothing on a chain.
#
# THE ARITHMETIC, WRITTEN OUT, BECAUSE NOTHING IN THE CODE CHECKS IT. ADR 0028:
# A collects its route's `price`, forwards `price - fee`, and so earns exactly
# `fee`, which composes across a path only while `price - fee` is at least
# the next hop's price:
#
#     A collects 1100, retains 100, forwards 1000
#     B terminates at 1000, and 1100 - 100 == 1000 exactly, with no slack
#
# `local_topologies_load.rs` holds A's two figures in keys.sh's table, B's
# `price` below in connector-b.toml and the rehearsal's AMOUNT/PRICE/FEE to
# that one arithmetic; no container can notice a price or a fee quietly
# dropped to zero.
# =============================================================================

# 0.0.0.0 so the container's published port reaches it. Same port inside every
# node's container; the host-side mapping in compose.yml is what tells them
# apart.
client_edge_addr = "0.0.0.0:3000"

# Where this node's outbound channel lives across a restart (ADR 0075 decision
# 8: journaled before its opening transaction is sent, and every voucher before
# it is handed out) and where the runtime peering row is kept.
state_dir = "/app/state"

# Issue #678, gap 3. B is a plain container port with no TLS terminator in
# front of it, and a peer URL is `https://` only unless a node says otherwise
# -- one top-level line, default false, node-wide (CF-18). It covers reading
# B's self-description, dialing B's carriage and asking B's claim-state, all
# of which `POST /peers` does over `http://connector-b:3000/ilp`.
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What this node publishes about itself at `GET /ilp` (ADR 0050) -- the
# document B's `POST /peers` reads to find A's voucher signer. Without it B
# could not bind A's channel, and A's vouchers would arrive at B as a
# client's rather than a peer's.
[node]
addresses = ["g.local.two-hop.a"]
http_endpoint = "http://connector-a:3000/ilp"

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
# Both are FILES, not literals, and both are written by local/keys.sh. The
# bearer token gates reads; `write_keys` is the ed25519 PUBLIC-key allowlist
# that gates every write -- `POST /peers`, `POST /routes/peers`,
# `POST /channels/:id/fund` from keys.sh, and `POST /packets` from
# `connector send`, which originates the packet this topology exists to prove.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only ─────────────────────────────────────────────────────
# One chain on this topology, deliberately -- `solo` already proves both
# backends can be live at once, and what this one adds is a second node. The
# Solana validator is still started, because `make local-up` brings up the
# whole local chain environment rather than a per-topology subset; nothing here
# dials it.
#
# The token and the EIP-712 domain are
# `local/solo/connector.toml`'s, for the reasons written there. The
# `[settlement.evm]` key is also what signs this node's vouchers (ADR 0075
# decision 3: `payerAuthorizer == payer`), so its address is the voucher
# signer A's self-description publishes and B binds.
[settlement.evm]
rpc_url = "http://anvil:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.evm.key]
key_file = "/app/data/settlement.key"
