# =============================================================================
# local/mixed-chain -- connector B. THE CHAIN BOUNDARY.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# This is the file the topology exists for. B is paid over a peering whose
# vouchers are EIP-712 `Voucher`s on an `x402BatchSettlement` channel on
# anvil, and pays over a peering whose vouchers are ed25519 messages on a
# `payment-channels` channel on the local Solana validator -- so ONE node, ONE
# packet path, and the money changes chain in the middle of it.
#
# Nothing in this file converts anything: it declares no `[[tokens]]`, so
# neither peering resolves to a token and this node sits on no boundary (ADR
# 0071's absence rule). The amount that leaves for C is the amount that arrived
# from A minus this hop's FLAT fee of 50 on the `b-c` peering (in
# `local/keys.sh`'s table), never a share of what arrived. `local/dealing`'s B
# is this node with a rate table.
#
# THE MIDDLE IS DOUBLY MIXED (issue #1155). A reaches this node over BTP
# (`peer_expose = "btp"` below, and the `btp_endpoint` B publishes, which
# `POST /peers` prefers) and this node reaches C over ILP-over-HTTP, so one
# packet crosses both carriages as well as both chains, and the hop that reads
# it off one wire and writes it onto the other is this one.
#
# ── Two peerings, four channels, none of them in this file ───────────────────
#
# ADR 0075: each peering is two one-way x402 channels, and each node opens only
# its own. `local/keys.sh mixed-chain channels` writes `POST /peers` to this
# node twice -- naming A's URL (binding A's EVM voucher signer, and opening a
# B->A channel nothing pays on) and naming C's URL (opening and funding B's
# Solana channel toward C through C's sponsor endpoint, decision 3, and
# binding C's) -- and then `POST /routes/peers` for `g.local.mixed.b.c`.
#
# One thing this file used to say that the runtime peering cannot: A's
# peering here was `forwarded_claim_enforcement = "enforce"` (ADR 0042 item
# 3), the only enforcing peering in the repository. A runtime peering has no
# such knob and observes (the default), so an uncovered arrival from A would
# now be forwarded and logged rather than refused `F06`. The rehearsal still
# catches it -- B's journal must show exactly one 1100 voucher per crossing --
# but the enforcing refusal itself no longer runs on a shipped image. It comes
# back with config-declared x402 peerings (#1380).
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# B's inbound vouchers (A's, on EVM) are journaled here, and so are the
# vouchers B signs on its own outbound channels (ADR 0075 decision 8).
state_dir = "/app/state"

# Both axes, because this node is on both ends of a peering: it ACCEPTS from A
# over BTP (`peer_expose`), and reads A's and C's self-descriptions and dials C
# over plaintext HTTP (`peer_allow_plaintext_endpoints`, since both are plain
# container ports with no TLS terminator). A carriage name and a URL scheme
# are separate settings for exactly this reason (peer-carriage-spec.md §2.1).
#
# `"btp"` and not `"both"`, deliberately: no ILP-over-HTTP peer carriage is
# mounted here at all, so A's packets can only have arrived on BTP frames.
peer_expose = "btp"
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What B publishes at `GET /ilp` (ADR 0050). BOTH endpoints: the BTP one is
# what A's `POST /peers` dials -- BTP is preferred where a node publishes
# both -- and the HTTP one is where A asks B's claim-state, which is plain
# HTTP whichever carriage the packets ride (ADR 0075 decision 6). BTP rides
# `GET /ilp/btp` on the same listener `client_edge_addr` binds.
[node]
addresses = ["g.local.mixed.b"]
http_endpoint = "http://connector-b:3000/ilp"
btp_endpoint = "ws://connector-b:3000/ilp/btp"

# ── The PEER-ROLE PROOF on the a-b leg ─────────────────────────────────────
# B forwards everything else it is paid for, and a runtime forwarding route
# cannot be pinned -- so a voucher on A's channel would pay for a forward just
# as well if B had never bound that channel to the peering and admitted it as a
# CLIENT's. This one terminated route closes that: it is pinned to
# ILP-over-HTTP, A pays B over BTP, a client is refused a route pinned to
# the other carriage (ADR 0072), and a peer is not held to a client's pin. The
# rehearsal sends one packet here on the SAME channel as its forwards, so if it
# reaches this app, A's channel is bound to the peering -- and every voucher on
# it arrived in the peer role. Priced at exactly what A forwards (1100), so the
# journal read holds it to the same figure as every other crossing.
[[routes]]
prefix = "g.local.mixed.b.app"
handler_url = "http://stub-app:3100/"
price = 1100
transport = "http"

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
# keys.sh's `POST /peers`, `POST /routes/peers` and `POST /channels/:id/fund`
# are signed with the allowlisted key; reads carry the bearer token.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: BOTH chains ──────────────────────────────────────────────────
# `local/solo/connector.toml` has why each value is what it is. The EVM table
# is where A's channel toward B lives; the Solana table is where B's channel
# toward C lives, opened through C's sponsor endpoint so that C holds its
# `payee` seat.
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.evm.batch_settlement]
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.solana]
rpc_url = "http://solana-validator:8899"
program_id = "HY4AYFNe5Vg5BkEwAURNsGY3uFAvGMNpAQPRtgoasJiR"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

[settlement.solana.batch_settlement]
min_sponsored_deposit = 1
