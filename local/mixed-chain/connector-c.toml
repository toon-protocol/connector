# =============================================================================
# local/mixed-chain -- connector C. Settles on Solana, and knows nothing else.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# C terminates the app's prefix and is paid over its Solana peering with B.
# The packet the rehearsal sends is sealed to THIS node's `[signer]` identity
# (ADR 0018), because C is the connector that terminates it.
#
# C holds no peering row. `local/keys.sh mixed-chain channels` sends C a
# signed `POST /peers` naming B's URL, which binds B's Solana voucher signer to
# the peering -- the channel B opens toward C shows up here when B posts its
# `open` to C's sponsor endpoint (ADR 0075 decision 3), with C in the `payee`
# and `rent_payer` seats -- and opens C's own channel toward B, which nothing
# here ever pays on.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where C's inbound vouchers are journaled (`client-edge-claims.log`), which
# the rehearsal reads to prove the Solana leg was paid.
state_dir = "/app/state"

# B dials this node over ILP-over-HTTP (issue #1155 moved only `a-b` to BTP).
peer_expose = "http"

# C's own `POST /peers` reads B's self-description at a plaintext URL (CF-18).
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What C publishes at `GET /ilp` (ADR 0050): the URL B's `POST /peers` dials,
# and -- off the `[settlement.solana]` table -- the terms B opens its channel
# on, the sponsor endpoint it posts the `open` to, and the voucher signer B
# binds C's by. HTTP only: this leg is the ILP-over-HTTP one.
[node]
addresses = ["g.local.mixed.b.c"]
http_endpoint = "http://connector-c:3000/ilp"

# ── The terminated route ─────────────────────────────────────────────────────
# `price = 0`: what the hop is paid here is the forwarded amount, 1050 per
# crossing on a real Solana voucher, not a route price -- this topology is
# about the chain boundary, not about pricing a termination (`two-hop` does
# that).
#
# `transport = "btp"` is the PEER-ROLE PROOF, as on `two-hop`'s B: B peers with
# C over ILP-over-HTTP, a CLIENT arriving over HTTP is refused a route pinned
# to BTP (ADR 0072), and a PEER is not held to a client's pin -- so a packet
# that reaches this app arrived on a voucher from a channel C bound to the
# peering.
[[routes]]
prefix = "g.local.mixed.b.c.app"
handler_url = "http://stub-app:3100/"
price = 0
transport = "btp"

[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: Solana only ──────────────────────────────────────────────────
# `local/solo/connector.toml` has why each value is what it is.
# `min_sponsored_deposit` bounds the opening deposit of any channel B opens
# toward C through C's sponsor endpoint.
[settlement.solana]
rpc_url = "http://solana-validator:8899"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6
min_sponsored_deposit = 1

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"
