# =============================================================================
# local/mixed-chain -- connector A. Settles on EVM, and knows nothing else.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# A -> B on EVM, B -> C on Solana, and the packet reaches C's app. What this
# topology is FOR is the middle: ONE node holding two settlement backends and a
# peering on each, so a packet crosses a chain boundary between two hops.
#
# It is NOT a conversion. What keeps this path unconverted is ADR 0071's
# ABSENCE RULE (decision 2): no config here declares `[[tokens]]`, so no hop
# resolves a token for either of its peerings, no hop sits on a boundary, and
# every one of them runs the code it ran before the record. Both legs hold
# 6-decimal USDC anyway, so there is nothing here to convert.
#
# Every amount on this path is therefore the same 6-decimal USDC-shaped
# integer, and the only thing that ever changes it between hops is a hop
# subtracting its own FLAT fee (issue #1144): 1200 in, 1100 across the
# boundary, 1050 delivered. `local/dealing` is the same three-node shape with
# the middle node dealing, and the difference between the two directories is
# exactly the `[[tokens]]` and `[[rates]]` blocks this one does not have.
#
# A's role in that is to be the ordinary end: one chain, one peering, no idea
# that the hop after B is on a different one. It is also the one node in this
# repository whose peering rides BTP: B publishes a `btp_endpoint`, `POST
# /peers` prefers BTP wherever a node publishes both, and B exposes nothing
# else to a peer -- so `a-b` is a `ws://` peering while `b-c` is `http://`, and
# the packet B forwards arrived over a different wire than the one it leaves
# on (issue #1155).
#
# ── The peering is not in this file ──────────────────────────────────────────
#
# ADR 0075: a peering is two one-way x402 channels, each opened by its own
# payer, and it is established from a URL by a signed `POST /peers` on each
# end (see `local/two-hop/connector-a.toml` for the long version). `local/keys.sh
# mixed-chain channels` makes those writes, and it holds this path's peering
# figures in its topology table: `a-b`'s fee of 100, and A's forwarding route
# `g.local.mixed.b` at price 1200.
#
#     A collects 1200, retains 100, forwards 1100
#     B collects 1100, retains  50, forwards 1050 to C's unpriced termination
#
# `local_topologies_load.rs` holds that table, C's committed price and the
# rehearsal's figures to the one sum.
# =============================================================================

client_edge_addr = "0.0.0.0:3000"

# Where this node's outbound channel and its vouchers are journaled (ADR 0075
# decision 8) and the runtime peering row is kept.
state_dir = "/app/state"

# Issue #678, gap 3. B is a plain container port with no TLS terminator in
# front of it. Node-wide and default false (CF-18); it covers both plaintext
# schemes -- `ws://` is exactly as plaintext as `http://` -- so it allows the
# `ws://connector-b:3000/ilp/btp` carriage, B's `http://` self-description and
# the `http://` claim-state ask alike.
peer_allow_plaintext_endpoints = true

[signer]
key_file = "/app/data/signer.key"

# What A publishes at `GET /ilp` (ADR 0050): the document B's own
# `POST /peers` reads to find A's voucher signer and bind A's channel.
[node]
addresses = ["g.local.mixed.a"]
http_endpoint = "http://connector-a:3000/ilp"

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
# Both FILES, written by local/keys.sh: the bearer token gates reads, the
# ed25519 PUBLIC-key allowlist gates every write -- keys.sh's `POST /peers`,
# `POST /routes/peers` and `POST /channels/:id/fund`, and the rehearsal's
# `POST /packets`.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: EVM only ─────────────────────────────────────────────────────
# `local/solo/connector.toml` has why each value is what it is. The settlement
# key signs A's vouchers (ADR 0075 decision 3), so its address is the voucher
# signer A publishes and B binds.
[settlement.evm]
rpc_url = "http://anvil:8545"
contract_address = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6

[settlement.evm.key]
key_file = "/app/data/settlement.key"

[settlement.evm.batch_settlement]
asset_eip712_name = "USDC"
asset_eip712_version = "2"
