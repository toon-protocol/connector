# local/solo -- the stand-alone xrpld the XRPL leg settles on (ADR 0087).
#
# The config the test harness runs (`connector_settlement_xrpl::test_support`),
# for the same reason: the code's default reserves (10 XRP base, 2 XRP owner)
# are not the network's (1 XRP, 0.2 XRP), and a node's reserve arithmetic is
# only worth rehearsing against the network's. `[network_id]` is ADR 0087
# decision 5's stand-alone id, which the node's `[settlement.xrpl.1000]` table
# is keyed by and checks `server_info` against at boot.
#
# Stand-alone: the chain closes a ledger only when told to (`ledger_accept`),
# which local/keys.sh does after funding the node. Nothing here is a secret --
# the genesis account's is the one printed in XRPL's own documentation.

[server]
port_rpc_admin_local

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[node_db]
type=NuDB
path=/tmp/xrpld/db/nudb

[database_path]
/tmp/xrpld/db

[debug_logfile]
/tmp/xrpld/debug.log

[network_id]
1000

[voting]
reference_fee = 10
account_reserve = 1000000
owner_reserve = 200000

[ssl_verify]
0
