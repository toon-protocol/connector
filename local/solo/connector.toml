# =============================================================================
# local/solo -- one connector, both chains, a payment-oblivious app.
#
# LOCAL / DEV ONLY. `infra/linode-*` owns devnet; nothing here is deployed,
# published or SSH'd anywhere, and every chain this file names is disposable.
#
# What this topology is FOR: proving the SHIPPED IMAGE runs. `cargo test`
# already covers the connector's behaviour far better than a container can --
# it spawns its own anvil and solana-test-validator per test (ADR 0007). What
# it structurally cannot check is the thing every deploy depends on: that the
# image, running as uid 10001, with this file mounted at
# /app/config/connector.toml, key files under /app/data and a real volume at
# /app/state, boots and serves a packet. `devnet_configs_load.rs` boots the
# fleet's own committed connector-rust.toml fixtures through the real binary,
# which is the half a GitHub runner can check without a chain. Here there is
# one, so this is an assertion rather than a boot-only check. (There is no
# candidate-image-vs-fleet-config gate any more -- ADR 0068 retired
# promote-to-fleet.yml, which used to run one before moving a fleet tag.)
#
# Every address below is deterministic, which is what lets this file be
# committed rather than generated. Secrets are not: every key is a PATH
# (ADR 0009/0012), written by `local/keys.sh` into a gitignored directory.
# =============================================================================

# 0.0.0.0 so the container's published port reaches it.
client_edge_addr = "0.0.0.0:3000"

# A named volume in compose.yml, not a bind mount: the image runs as uid 10001
# and creates this path so a fresh named volume inherits that ownership. Without
# a state_dir every channel's watermark lives in process memory, and a restart
# hands a payer every claim it already spent back as free service (issue #605).
state_dir = "/app/state"

[signer]
key_file = "/app/data/signer.key"

# ── The one locally-terminated route ─────────────────────────────────────────
# `stub-app` is the connector image's second binary: it answers `POST /`, holds
# no secret and performs no cryptography, so it supplies nothing toward the
# packet's fulfilment -- the connector derives that itself from the sealed
# request (ADR 0019). That is the property worth having behind a route here:
# "the app answered" and "the packet was paid for" stay separable.
#
# The trailing slash on handler_url is load-bearing. `HttpAppClient::deliver`
# does `handler_url.join(&target)`, and RFC 3986 makes an absolute-path
# reference REPLACE the base's path -- so the sender's `--target /` and this
# base have to agree on where the app actually serves.
[[routes]]
prefix = "g.local.solo"
handler_url = "http://stub-app:3100/"
price = 0

# ── Operator surface (ADR 0008) ──────────────────────────────────────────────
# Both are FILES, not literals, and both are written by local/keys.sh. The
# bearer token gates reads; `write_keys` is the ed25519 PUBLIC-key allowlist
# that gates `POST /packets` -- which is how `connector send` originates the
# packet this topology exists to prove. Nothing secret is committed: the
# allowlist holds public keys, and the private half never leaves .keys/.
[operator]
bearer_token_file = "/app/data/operator-bearer-token"
write_keys_file = "/app/data/operator-write-keys"

# ── Settlement: BOTH chains, live at once -- and EVM on two networks ─────────
# Deliberately both. `connector-cli`'s
# `a_both_chains_config_attaches_and_routes_both_backends` proves this concern
# in-process; nothing else stands a node up with an EVM and a Solana
# backend attached simultaneously and boots it. A present-but-unsatisfiable
# settlement block is a hard startup failure, so this section coming up at all
# is itself the assertion.
#
# Every channel is an x402 `batch-settlement` channel (ADR 0075): on EVM
# `x402BatchSettlement` at its canonical address, on Solana solana-foundation's
# `payment-channels` at `CHNLx...` -- both constants of the binary, and both
# placed on the local chains by `infra/anvil/seed.sh` and
# `infra/solana/entrypoint.sh`. The node reads each at boot and refuses to
# start on a chain without it. Both halves of the port are always on: this
# node pays over its own outbound channels and is paid over channels opened
# toward it.
#
# `token_address` is Circle's FiatToken v2.2, deployed by `infra/anvil/seed.sh`
# from anvil's account 0 at nonce 1 -- deterministic, so committable. It is
# named "USDC", version "2", which is the EIP-712 domain its ERC-3009
# `receiveWithAuthorization` signs under and so what the two `asset_eip712_*`
# keys must say. `connect` reads its `decimals()` and refuses to start if 6 is
# wrong (issue #564).
[settlement.eip155.31337]
rpc_url = "http://anvil:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.eip155.31337.key]
key_file = "/app/data/settlement.key"

# ── A second EVM network: the same chain on another chain id (ADR 0086) ──────
# `anvil-31338` is the root anvil run again on 31338 (local/solo/compose.yml),
# seeded by the same `infra/anvil/seed.sh`, so its USDC is at the SAME address
# as 31337's -- which is why every asset here is CAIP-19 and every voucher names
# its network: the token address alone cannot say which chain a value is on.
# The node checks at boot that this RPC answers `eth_chainId` with 31338, that
# x402 is placed there, and that no two tables report one chain id; it then
# publishes one `accepts[]` entry per table. Same key file as 31337's: one
# settlement address on every network (user story 3), funded on both by
# `local/keys.sh`.
[settlement.eip155.31338]
rpc_url = "http://anvil-31338:8545"
token_address = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
decimals = 6
asset_eip712_name = "USDC"
asset_eip712_version = "2"

[settlement.eip155.31338.key]
key_file = "/app/data/settlement.key"

# `token_address` is the deterministic mock mint from
# `infra/solana/create-usdc-mint.sh`, seeded by `make solana-mint-usdc`, under
# the SPL Token id -- which on the local validator is mainnet's p-token, loaded
# from the same pinned fixture the in-process harness loads. That target fails
# loudly rather than warning, because a validator without this mint cannot
# satisfy this line and the node will refuse to start.
#
# `min_sponsored_deposit` is the smallest opening deposit this node's sponsor
# endpoint co-signs an `open` for (ADR 0074 decision 9): a counterparty that
# peers with this node posts its payer-signed `open` there.
[settlement.solana]
rpc_url = "http://solana-validator:8899"
token_address = "H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"
decimals = 6
min_sponsored_deposit = 1

[settlement.solana.key]
key_file = "/app/data/settlement-solana.key"

# ── XRPL: a third family, on the stand-alone ledger (ADR 0087) ───────────────
# The `xrpld` container (local/solo/compose.yml) is the test harness's chain:
# stand-alone, network id 1000, so the table is keyed `1000` and the node
# refuses to start if `server_info` says otherwise. No contract and no token:
# a channel is the ledger's own PayChannel and holds XRP. The key file is an
# XRPL family seed, generated by local/keys.sh (never committed) and funded
# from the genesis account -- a node whose account is missing or below the base
# reserve is refused at boot, so booting is itself the assertion. The solo
# node opens no XRPL channel; the rehearsal asserts the greeting carries the
# entry.
[settlement.xrpl.1000]
rpc_url = "http://xrpld:5005"

[settlement.xrpl.1000.key]
key_file = "/app/data/settlement-xrpl.key"

# ── What each table holds (ADR 0087 decision 6, #1636) ───────────────────────
# An XRPL table refuses to boot with no `[[tokens]]`, and a node that declares
# any must declare the token of every settlement table, so all four are here.
# Nothing else is: no numeraire, rate or guard. This node holds no peering and
# converts nothing. Its one route terminates here.
#
# As in `local/dealing`, the Solana prefix is a fixed label: the local validator
# starts from a fresh genesis, and a table matches a Solana asset by its mint.
[[tokens]]
asset = "eip155:31337/erc20:0xe7f1725e7734ce288f8367e1bb143e90bb3f0512"

[[tokens]]
asset = "eip155:31338/erc20:0xe7f1725e7734ce288f8367e1bb143e90bb3f0512"

[[tokens]]
asset = "solana:LocaLSoLanaVaLidatorGenesis11111/token:H8HSreUF2s8r8hem4qMttE3bWYCpFuh71jbuos5bA77H"

[[tokens]]
asset = "xrpl:1000/slip44:144"
