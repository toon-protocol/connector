# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TOON faucet box — faucet app + nginx/TLS. NO connector, NO ILP config of any
# kind (toon-meta `docs/two-node-architecture.md` §4.5 — that doc lives in
# toon-meta, not this repo; connector#898 tracks the faucet box here). This box
# is reached over plain HTTPS, by humans and by client bootstrap code; it is
# not a node on the network, so it has no `[[peers]]` row naming it anywhere,
# no signer key, no settlement key, no state directory, no payment channel.
#
# USDC only (§4.6): the local-anvil EVM leg and the native-SOL leg are retired
# from the faucet app itself (packages/faucet/src/index.js), and the Mina leg
# left with Mina (ADR 0065-mina). This box's env below configures only the two
# surviving USDC legs, Base Sepolia and Solana devnet.
#
# Run from the CONNECTOR REPO ROOT:
#   docker compose -f infra/linode-faucet/docker-compose.faucet.yml up -d
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  faucet:
    # Build context is the REPO ROOT (not packages/faucet): the Dockerfile
    # COPYs packages/faucet/ by its repo-relative path. See
    # packages/faucet/Dockerfile.
    build:
      context: ../..
      dockerfile: packages/faucet/Dockerfile
    environment:
      PORT: 3500
      # ── Solana — public devnet, USDC only ──────────────────────────────
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # This box's OWN mint, created by ./create-devnet-usdc-mint.sh with the
      # treasury below as its authority — so the leg MINTS on demand and can
      # never run dry. No default: a box must name the mint it can actually
      # mint, and inheriting another box's would be a leg that 503s with an
      # authority mismatch. Unset → the Solana leg is disabled.
      SOLANA_USDC_MINT: ${SOLANA_USDC_MINT:-}
      SOLANA_FAUCET_KEYPAIR: /keys/usdc-authority.json
      SOLANA_DRIP_COOLDOWN_MS: ${SOLANA_DRIP_COOLDOWN_MS:-86400000}
      # The native-SOL route (POST /api/solana/request) and its
      # SOLANA_SOL_AMOUNT config are retired entirely (issue #945, §4.6) —
      # only the USDC-only drip runs on this box.
      # ── Base Sepolia — PUBLIC Base testnet (chainId 84532) ─────────────
      # Mints the ungated mock USDC (mint() needs no faucet USDC balance); the
      # faucet key only needs Base Sepolia ETH for gas. Unset key → route 503s.
      BASE_SEPOLIA_FAUCET_KEY: ${BASE_SEPOLIA_FAUCET_KEY:-}
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      BASE_SEPOLIA_USDC: ${BASE_SEPOLIA_USDC:-0x0C996d7c934c79a6255254875607Fe69df25C0E1}
      BASE_SEPOLIA_USDC_AMOUNT: ${BASE_SEPOLIA_USDC_AMOUNT:-1000}
      # §4.6 pinned this to '0': USDC only, no native gas from this box. That
      # left a devnet payer able to open a channel (gasless, through the
      # facilitator) but never to LEAVE one, because initiateWithdraw and
      # finalizeWithdraw are the payer's own transactions and no public Base
      # Sepolia faucet is on the path a newcomer follows. A first-run test on
      # 2026-10-13 stranded two devnet deposits exactly this way. A best-effort
      # drip of a little ETH, only while the key sits above
      # BASE_SEPOLIA_ETH_RESERVE, closes the loop; the USDC mint is still the
      # leg's job and still never fails on the ETH leg (base-sepolia.js).
      # Solana stays SOL-less: treasury SOL is scarce (#945) and the chain's
      # own airdrop works for devnet.
      BASE_SEPOLIA_ETH_AMOUNT: ${BASE_SEPOLIA_ETH_AMOUNT:-0.001}
    volumes:
      # Fresh treasury keypair, generated ON THIS BOX (§4.4) by
      # ./generate-solana-treasury.sh — never copied from another box. It is
      # this box's mint AUTHORITY as well as its fee payer.
      #
      # Long syntax with create_host_path: false on purpose. Docker's default
      # is to CREATE a missing bind source as an empty DIRECTORY, and that is
      # exactly what happened here: the path below sat as a 0-byte directory
      # for weeks, `createSolanaFaucet` saw no keypair file, and the leg
      # quietly served 503s while every container reported healthy. Failing
      # `up` outright is the honest behaviour — a box with no treasury cannot
      # do this job, and should say so at the moment it is started.
      - type: bind
        source: /root/keys/solana-usdc-treasury.json
        target: /keys/usdc-authority.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3500/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      faucet:
        condition: service_healthy
        required: false
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - faucet_certbot_conf:/etc/letsencrypt:ro
      - faucet_certbot_www:/var/www/certbot:ro
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - faucet_certbot_conf:/etc/letsencrypt
      - faucet_certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  faucet_certbot_conf:
  faucet_certbot_www:
