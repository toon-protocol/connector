# Closes the issues a merged PR says it closes (`Closes #N`, `Fixes #N`, `Resolves #N`).
#
# GitHub does this itself only when the repository's "Auto-close issues with merged
# linked pull requests" setting is on, and that setting can't be read or changed
# through the API. The AFK factory depends on it: a ticket blocked by another
# becomes ready only when its blocker closes. So this does the same job itself, and
# does nothing when GitHub has already closed the issue.
#
# It closes issues with the GitHub App token, not GITHUB_TOKEN, because events
# caused by GITHUB_TOKEN start no other workflows. With the App token, the close
# starts agent-implement.yml's sweep, so the next ticket starts right away.
#
# pull_request_target, so the job has secrets for a PR from a fork too. It never
# checks out the PR's code; it only reads the PR's closing references and body
# through the API, and never interpolates either into a shell command.
#
# The same file is in every toon-protocol factory repo. Keep them identical.

name: close-linked-issues

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  close:
    # GitHub only closes issues for PRs merged into the default branch, so this matches.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Close the issues this PR closes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # GitHub's own parse of the PR's closing references, limited to this repository.
          linked=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){closingIssuesReferences(first:50){nodes{number repository{nameWithOwner}}}}}}' \
            -F o="${REPO%/*}" -F n="${REPO#*/}" -F p="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == env.REPO) | .number')

          # The body's closing keywords too, since GitHub sometimes doesn't link one.
          # Only a bare `#N` counts, which means an issue in this repository.
          body=$(gh pr view "$PR" -R "$REPO" --json body --jq .body)
          parsed=$(grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<<"$body" \
            | grep -oE '[0-9]+$' || true)

          numbers=$(printf '%s\n%s\n' "$linked" "$parsed" | grep -E '^[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "PR #$PR closes no issue."
            exit 0
          fi

          for n in $numbers; do
            kind=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else .state end' 2>/dev/null || echo missing)
            case "$kind" in
              open)
                gh issue close "$n" -R "$REPO" --reason completed \
                  --comment "Closed by #$PR, which was merged and says it closes this issue."
                echo "#$n: closed" ;;
              *) echo "#$n: $kind, left alone" ;;
            esac
          done
