# auto-merge shim — forwards this repo's PR lifecycle events to the central
# auto-merge pass in toon-meta (toon-meta#285, epic #270).
#
# Fanned out from toon-meta (canonical trigger set; the workflow_run list below
# is per-repo). All logic (the five merge preconditions, the check-set honesty
# rule, the native-auto-merge seam, the merge cap) lives ONCE in toon-meta —
# this shim only decides WHEN to invoke it:
#   * one of this repo's own pull_request workflows completed on a factory
#     branch (sandcastle/ or agent/) — the PR's gate just finished, the usual
#     moment a PR becomes eligible (workflow_run below; see the check_suite
#     note);
#   * a review was submitted on a factory PR — the factory-ops APPROVE (#282)
#     is the precondition that often flips last;
#   * a PR merged into this repo — under strict protection (#272) that merge
#     just put every other open PR behind `main`, and updating those branches
#     is part of the pass;
#   * a label was added to or removed from a factory PR (#358) — a label
#     change is the one state change that can make a PR mergeable, or
#     repair-eligible, with no other event. Clearing `needs:human` is the
#     concrete case that bit this fleet: connector#923/#935 sat mergeable for
#     5.5h after the label was cleared because nothing else fired before the
#     next cron — that clear is `unlabeled`, not `labeled`;
#   * a factory PR's branch was pushed to (`synchronize`, #357) — so a repair
#     attempt's own push is re-evaluated as soon as it lands, not up to 6h
#     later.
#
# `secrets: inherit` hands the called workflow this repo's FACTORY_OPS_TOKEN
# (org secret, monitored by toon-meta's factory-ops-credential workflow) —
# which is both the merge credential and the definition of "approved".
# Writes are still gated centrally: until the org Actions variable
# AUTOMERGE_APPLY is 'true', every run is a no-write dry-run report.

name: auto-merge-shim

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed, labeled, unlabeled, synchronize]
  # No check_suite here: check suites for Actions runs are created via
  # GITHUB_TOKEN, and GITHUB_TOKEN-created events never trigger workflows — it
  # was a dead trigger. workflow_run is the working replacement: it fires when
  # one of THIS repo's pull_request workflows (enumerated by name below —
  # workflow_run matches `name:`, so keep this list in step with any rename)
  # finishes on a PR head branch.
  workflow_run:
    workflows:
      - "Agent image"
      - "agent:review"
      - "CI"
    types: [completed]

permissions:
  contents: read
  # actions: write because the CALLED fleet pass (toon-meta auto-merge.yml)
  # requests it for same-repo fix-runner dispatch (toon-meta#385) — a
  # reusable workflow's permissions must be a SUBSET of its caller's, so a
  # shim capped at contents:read startup-fails the whole call. Observed
  # fleet-wide 2026-08-14 ~16:05Z: every shim run startup_failure, all
  # event forwarding silently dead.
  actions: write

jobs:
  forward:
    # Only factory branches matter. A plain close (not merged) changes
    # nobody's mergeability; labeled/unlabeled/synchronize are scoped to
    # factory branches the same way pull_request_review and workflow_run are.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'pull_request' && (
        github.event.action == 'labeled' ||
        github.event.action == 'unlabeled' ||
        github.event.action == 'synchronize') && (
        startsWith(github.event.pull_request.head.ref, 'sandcastle/') ||
        startsWith(github.event.pull_request.head.ref, 'agent/'))) ||
      (github.event_name == 'pull_request_review' && (
        startsWith(github.event.pull_request.head.ref, 'sandcastle/') ||
        startsWith(github.event.pull_request.head.ref, 'agent/'))) ||
      (github.event_name == 'workflow_run' && (
        startsWith(github.event.workflow_run.head_branch, 'sandcastle/') ||
        startsWith(github.event.workflow_run.head_branch, 'agent/')))
    uses: toon-protocol/toon-meta/.github/workflows/auto-merge.yml@main
    with:
      repos: ${{ github.repository }}
    secrets: inherit
