# Fleet operations — live devnet work on the faucet node, run as a workflow
# rather than as an agent (toon-meta#335, toon-meta#309).
#
# ── THE HOST, AND THE ONE NODE THIS FILE OPERATES ───────────────────────────
# The devnet is ONE host (infra ADR 0001): the Linode labelled `relay`. It
# runs the relay, store, gas-station and workload-gateway nodes, the faucet,
# and the edge — one Caddy that terminates TLS for every public hostname on
# the host and owns ports 80 and 443. The Linodes that used to be labelled
# `faucet`, `store`, `gas`, `toon-gateway` and `toon-provider` are deleted.
#
# Every node on the host is GitOps (ADR 0068): its own repository holds a
# `deploy/` bundle, a `toon-auto-apply-<node>.timer` on the host applies it,
# and nothing outside the host can make a node deploy. This file does not
# offer to. Issue #1213 found an earlier version scp'ing connector config to
# a checkout no running container read any more, and "confirming" the write
# by re-reading the same dead path.
#
# The faucet is the exception, and the only thing this file touches. It has
# no connector — it is not a node on the ILP network, it has no route, no
# price and no key but its mint authority — it has no timer, and it is
# deployed BY HAND from THIS repo's `infra/linode-faucet/`:
#
#   checkout   /root/faucet-connector      (this repo, DETACHED at a pinned
#                                           commit; a partial clone)
#   compose    /root/faucet-connector/infra/linode-faucet
#   project    linode-faucet
#   files      docker-compose.faucet.yml   (committed)
#              docker-compose.edge.yml     (HOST-LOCAL, untracked: joins the
#                                           `edge-faucet` network under the
#                                           alias `faucet`, and parks nginx
#                                           and certbot behind a profile that
#                                           is never activated)
#   env        infra/linode-faucet/.env    (host-local, gitignored)
#
# `/root/connector` on the host is a STALE, UNRELATED checkout. Nothing here
# reads or writes it.
#
# ── THE RULE THIS FILE EXISTS TO ENCODE ─────────────────────────────────────
# Every compose command against the faucet runs from its compose directory,
# with `-p linode-faucet` and BOTH files. The committed file alone still
# declares the old nginx and certbot services, which publish 80 and 443; a
# compose command that drops the edge overlay would start them, and they
# would fight the edge for its ports and take every hostname on the host down
# with them (infra ADR 0001, Consequences). So:
#
#   * every write first asks compose which services these two files would
#     start (`config --services`) and REFUSES unless the answer is exactly
#     `faucet`. A missing or edited overlay is caught here, before anything
#     is written;
#   * every write names the `faucet` service, with `--no-deps`. There is no
#     `service` input any more: nginx and certbot are not the faucet's to
#     start, and the faucet is the only service this file may touch;
#   * every write RE-READS the host afterwards and fails the job unless the
#     project holds exactly one container, `faucet`, created from both files
#     and attached to `edge-faucet`.
#
# ── WHAT EACH OPERATION DOES ────────────────────────────────────────────────
# `box-status`  READ-ONLY. Host load, memory and disk, every container on the
#               host, and the faucet node in full: the checkout's commit and
#               cleanliness, which services the two compose files would start,
#               and the running container's health, image, compose files and
#               networks. It runs `uptime`, `free`, `df`, `docker ps`/
#               `inspect`, `docker compose config`/`ps`, and `git log`/
#               `branch`/`status` (with `--no-optional-locks`, so not even the
#               index is refreshed) — and nothing else. It never fetches,
#               starts, stops or recreates anything, and writes no file.
#
# `restart`     `docker compose … restart faucet`. Restarts the container that
#               is already running, from the image it already has. It does
#               not rebuild, does not re-read the compose files (ADR 0009:
#               `up -d` does not reload a bind-mounted file either), and does
#               not move the checkout.
#
# `deploy`      Moves the faucet to a commit. The faucet has NO image pin:
#               compose BUILDS it from the checkout (`build: context: ../..`),
#               so the checkout's commit IS the deploy. (This verb used to
#               `git pull --ff-only` and `compose pull` an `image:` pin; on a
#               detached checkout the pull fails, and the faucet has no pin to
#               pull.) So `deploy`:
#                 1. resolves `ref` to a full commit ON THE RUNNER, and refuses
#                    one that is not on `main` — a rollback is any older commit
#                    of `main`; a branch is never deployable;
#                 2. refuses a checkout with tracked changes (a human is
#                    mid-edit there) or without the edge overlay;
#                 3. `git fetch origin <sha>` and `git checkout --detach <sha>`
#                    — no `-f`, so an untracked file the commit would overwrite
#                    fails the checkout instead of being clobbered;
#                 4. the only-`faucet` gate, now against the NEW commit's
#                    compose file;
#                 5. `compose build faucet` — and if the gate or the build
#                    fails, the checkout goes back to the commit it was at, so
#                    the checkout keeps naming what is actually running;
#                 6. `compose up -d --no-deps faucet`, which recreates the
#                    container from the image just built;
#                 7. re-reads the host: HEAD is the commit, the running
#                    container's image IS the image just built, and the
#                    project invariants above hold.
#
# ── SAFETY ──────────────────────────────────────────────────────────────────
#   * `apply` defaults to false. A dry run reads the host, prints the exact
#     commands it would run, and changes nothing.
#   * `box-status` never takes the write path and is safe at any time.
#   * Every write is followed by gates that read the host back rather than
#     trust the write's exit code: the project invariants, the container's own
#     Docker healthcheck turning `healthy` after the write, and
#     `https://faucet.devnet…/health` answering 200 THROUGH THE EDGE — the
#     faucet publishes no host port, so the edge is the only way to it.
#   * The SSH key is written 0600 to a job-local file and removed in an
#     `always()` step. Host keys are pinned per run via `accept-new`, so a
#     changed host key fails the run instead of being trusted silently.
#
# ── WHY A WORKFLOW AND NOT AN AGENT ─────────────────────────────────────────
# A class of devnet tickets is blocked on nothing but reach: read what the
# host is actually running, restart or redeploy the faucet. Those are not
# design decisions — they are deterministic operations a human has been doing
# by hand at a terminal.
#
# It must not run inside the agent sandbox. `.sandcastle/sandbox-
# secrets.ts` forwards exactly two values into the container
# (CLAUDE_CODE_OAUTH_TOKEN, GH_TOKEN); an SSH key with root on the host is
# not going to be the third. The key reaches a GitHub-hosted runner executing
# THIS file — reviewed, committed, deterministic — and never reaches a
# container running agent-authored code. Same shape as `funded-ops.yml` and
# `fleet-health.yml`.
#
# An agent DISPATCHES this (its App token carries `actions: write`) and reads
# the run's summary back. It never holds the credential.
#
# ── REQUIRED SECRETS ────────────────────────────────────────────────────────
#   DEVNET_SSH_KEY   Private half of a DEVNET-SCOPED key authorized as root on
#                    the host. NOT the operator's personal key, and NOT
#                    E2E_DEV_MNEMONIC (which is mainnet-capable — see
#                    .sandcastle/sandbox-secrets.ts).
#   LINODE_CLI_TOKEN Existing org secret. Used only to resolve the host's
#                    label to its current IP, so no IP is hardcoded here.

name: fleet-ops

run-name: "fleet-ops ${{ inputs.operation }} on faucet (apply=${{ inputs.apply }})"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "box-status (read) — restart | deploy (writes). All three act on the faucet node only."
        type: choice
        required: true
        default: box-status
        options: [box-status, restart, deploy]
      ref:
        description: "deploy: the commit of main to move the faucet to (a sha, or `main` for its tip). Anything not on main is refused."
        type: string
        required: false
        default: "main"
      apply:
        description: "Perform the write. false = dry run, reads and prints only."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # One fleet operation at a time. Two concurrent runs could restart the
  # faucet while another is mid-deploy against it.
  group: fleet-ops
  cancel-in-progress: false

jobs:
  fleet-ops:
    runs-on: ubuntu-latest
    # A deploy BUILDS the faucet image on a 1 GB host.
    timeout-minutes: 30
    env:
      OPERATION: ${{ inputs.operation }}
      REF: ${{ inputs.ref }}
      APPLY: ${{ inputs.apply }}
      LINODE_API: https://api.linode.com/v4
      HOST_LABEL: relay
      FAUCET_URL: https://faucet.devnet.toonprotocol.dev

    steps:
      # ── Fail closed, and fail EARLY, on a missing credential ──────────────
      # Without this the job would get as far as ssh and emit an unreadable
      # "Permission denied (publickey)" with no hint that the secret is simply
      # not set yet.
      - name: Preconditions
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          if [ -z "${DEVNET_SSH_KEY:-}" ]; then
            echo "::error::DEVNET_SSH_KEY is not set. This workflow cannot reach the host."
            echo "::error::It is a one-time human step: mint a devnet-scoped key, add it as an"
            echo "::error::org secret, and authorize it as root on the devnet host."
            fail=1
          fi
          if [ -z "${LINODE_CLI_TOKEN:-}" ]; then
            echo "::error::LINODE_CLI_TOKEN is not set — cannot resolve the host's label to an IP."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "Preconditions OK."

      # ── deploy: which commit, exactly ─────────────────────────────────────
      # Resolved here, on the runner, so the dry run and the apply name the
      # same full sha, and a ref that is not on `main` never reaches the host.
      - name: Resolve the commit to deploy
        id: target
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha 2>/dev/null) \
             || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$REF' does not name a commit of $REPO."
            exit 1
          fi
          # `<sha>...main` is `ahead` or `identical` exactly when the commit
          # is an ancestor of main (or main itself).
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          case "$status" in
            ahead|identical) ;;
            *)
              echo "::error::$sha is not on main (compare status: $status). The faucet deploys only commits of main."
              exit 1
              ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "'$REF' is $sha, on main."

      - name: Resolve the host IP from its Linode label
        id: host
        env:
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          ip=$(curl -sf -H "Authorization: Bearer $LINODE_CLI_TOKEN" \
                 "$LINODE_API/linode/instances" \
               | jq -r --arg l "$HOST_LABEL" '.data[] | select(.label==$l) | .ipv4[0]' | head -1)
          if [ -z "$ip" ] || [ "$ip" = "null" ]; then
            echo "::error::No Linode labelled '$HOST_LABEL'."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "The devnet host ('$HOST_LABEL') is $ip."

      - name: Install SSH key
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          HOST_IP: ${{ steps.host.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVNET_SSH_KEY" > ~/.ssh/devnet
          chmod 600 ~/.ssh/devnet
          # accept-new: trust on first use for this ephemeral runner, but a
          # CHANGED host key still fails rather than being accepted silently.
          {
            echo "Host devnet-host"
            echo "  HostName $HOST_IP"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/devnet"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          if ! ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-host true; then
            echo "::error::Cannot SSH to the devnet host. Is DEVNET_SSH_KEY authorized as root on it?"
            exit 1
          fi
          echo "SSH reachable."

      - name: Run operation
        id: run
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          sshhost() { ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-host "$@"; }
          say() { echo "$@" >> "$GITHUB_STEP_SUMMARY"; }

          # ── The faucet's compose invocation, and nothing else ─────────────
          # Prepended to every on-host script. This is the ONE place the
          # directory, project and file list are spelled.
          PRELUDE=$(cat <<'PRELUDE_SCRIPT'
          set -euo pipefail
          export LC_ALL=C
          CHECKOUT=/root/faucet-connector
          COMPOSE_DIR=$CHECKOUT/infra/linode-faucet
          PROJECT=linode-faucet
          compose() {
            (cd "$COMPOSE_DIR" && docker compose -p "$PROJECT" \
               -f docker-compose.faucet.yml -f docker-compose.edge.yml "$@")
          }
          # Exactly `faucet`, or refuse. Without the overlay the committed
          # file alone would also start nginx and certbot on 80/443.
          only_faucet() {
            local services
            [ -f "$COMPOSE_DIR/docker-compose.edge.yml" ] \
              || { echo "REFUSING: $COMPOSE_DIR/docker-compose.edge.yml is missing"; return 1; }
            services=$(compose config --services | sort | tr '\n' ' ')
            [ "$services" = "faucet " ] \
              || { echo "REFUSING: the two compose files would start [${services% }], not exactly [faucet]"; return 1; }
          }
          faucet_cid() { compose ps -q faucet; }
          PRELUDE_SCRIPT
          )

          # ── box-status: READ-ONLY ─────────────────────────────────────────
          STATUS=$(cat <<'STATUS_SCRIPT'
          echo "== host"
          uptime
          free -m
          df -h /
          echo
          echo "== containers"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Label "com.docker.compose.project"}}'
          echo
          echo "== faucet checkout ($CHECKOUT)"
          git -C "$CHECKOUT" log -1 --format='HEAD %H  %cs  %s'
          echo "branch: [$(git -C "$CHECKOUT" branch --show-current || true)]  (empty = detached, as it should be)"
          echo "changes (tracked and untracked; the edge overlay is expected here):"
          git -C "$CHECKOUT" --no-optional-locks status --porcelain | sed 's/^/  /'
          echo
          echo "== faucet compose ($COMPOSE_DIR, project $PROJECT)"
          echo "services these two files would start: $(compose config --services | sort | tr '\n' ' ')"
          only_faucet && echo "only-faucet gate: PASS"
          compose ps -a
          cid=$(faucet_cid)
          if [ -n "$cid" ]; then
            docker inspect -f 'health: {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}  started: {{.State.StartedAt}}  restarts: {{.RestartCount}}' "$cid"
            docker inspect -f 'image: {{.Config.Image}} {{.Image}}' "$cid"
            docker inspect -f 'compose files: {{index .Config.Labels "com.docker.compose.project.config_files"}}' "$cid"
            docker inspect -f 'networks: {{range $n, $_ := .NetworkSettings.Networks}}{{$n}} {{end}}' "$cid"
          else
            echo "NO faucet container in project $PROJECT"
          fi
          STATUS_SCRIPT
          )

          # ── The read-back every write ends with ───────────────────────────
          # $1: the commit HEAD must be at ('' = do not check).
          # $2: the StartedAt the container had before the write, which it
          #     must no longer have ('' = do not check).
          # $3: 'built' = the running image must be the image compose just
          #     built for the faucet.
          VERIFY=$(cat <<'VERIFY_SCRIPT'
          want_sha=${1:-}; before=${2:-}; built=${3:-}
          fail=0
          bad() { echo "FAIL: $*"; fail=1; }
          if [ -n "$want_sha" ]; then
            head=$(git -C "$CHECKOUT" rev-parse HEAD)
            [ "$head" = "$want_sha" ] || bad "checkout HEAD is $head, not $want_sha"
          fi
          only_faucet || fail=1
          # Nothing but the faucet in the project — not even a stopped nginx.
          others=$(docker ps -a --filter "label=com.docker.compose.project=$PROJECT" \
                     --format '{{.Label "com.docker.compose.service"}}' | grep -vx faucet || true)
          [ -z "$others" ] || bad "project $PROJECT also holds: $(echo "$others" | tr '\n' ' ')"
          cid=$(faucet_cid)
          if [ -z "$cid" ]; then
            bad "no faucet container"
            exit 1
          fi
          files=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$cid")
          case "$files" in
            *docker-compose.faucet.yml*docker-compose.edge.yml*) ;;
            *) bad "the faucet container was created from [$files], not both compose files" ;;
          esac
          nets=$(docker inspect -f '{{range $n, $_ := .NetworkSettings.Networks}}{{$n}} {{end}}' "$cid")
          case " $nets" in
            *" edge-faucet "*) ;;
            *) bad "the faucet container is on [${nets% }], not on the edge-faucet network" ;;
          esac
          if [ -n "$before" ]; then
            now=$(docker inspect -f '{{.State.StartedAt}}' "$cid")
            [ "$now" != "$before" ] || bad "the faucet container was not restarted (StartedAt still $now)"
          fi
          if [ "$built" = built ]; then
            running=$(docker inspect -f '{{.Image}}' "$cid")
            image=$(docker inspect -f '{{.Config.Image}}' "$cid")
            wanted=$(docker image inspect -f '{{.Id}}' "$image")
            [ "$running" = "$wanted" ] || bad "the running image $running is not the image just built ($image = $wanted)"
          fi
          # The container's own healthcheck, re-evaluated after the write
          # (interval 30s, so allow a few rounds).
          health=unknown
          for _ in $(seq 1 40); do
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")
            [ "$health" = healthy ] && break
            sleep 3
          done
          [ "$health" = healthy ] || bad "the faucet container is '$health', not healthy, 120s after the write"
          docker inspect -f 'faucet: {{.Name}} {{.Config.Image}} {{.Image}} started={{.State.StartedAt}}' "$cid"
          echo "health: $health"
          exit "$fail"
          VERIFY_SCRIPT
          )

          # ── restart ───────────────────────────────────────────────────────
          RESTART=$(cat <<'RESTART_SCRIPT'
          only_faucet
          compose restart faucet
          RESTART_SCRIPT
          )

          # ── deploy: move the detached checkout, build, recreate ───────────
          # $1: the full sha, resolved and checked against main on the runner.
          DEPLOY=$(cat <<'DEPLOY_SCRIPT'
          sha=$1
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "REFUSING: '$sha' is not a full sha"; exit 1; }
          cd "$CHECKOUT"
          dirty=$(git --no-optional-locks status --porcelain --untracked-files=no)
          [ -z "$dirty" ] || { echo "REFUSING: tracked changes in $CHECKOUT — a human is mid-edit:"; echo "$dirty"; exit 1; }
          only_faucet
          old=$(git rev-parse HEAD)
          echo "checkout: $old -> $sha"
          restore() {
            echo "restoring the checkout to $old, which is still what is running"
            git -c advice.detachedHead=false checkout --quiet --detach "$old"
          }
          git fetch --quiet --no-tags origin "$sha"
          git -c advice.detachedHead=false checkout --quiet --detach "$sha"
          [ "$(git rev-parse HEAD)" = "$sha" ] || { echo "FAIL: HEAD did not move to $sha"; restore; exit 1; }
          # The gate again, against the NEW commit's compose file.
          only_faucet || { restore; exit 1; }
          compose build faucet || { echo "FAIL: build"; restore; exit 1; }
          compose up -d --no-deps faucet
          DEPLOY_SCRIPT
          )

          # Every on-host script runs as PRELUDE + script, under `bash -c`
          # rather than `bash -s`: a command that reads stdin (compose, git)
          # would otherwise swallow the rest of a script fed on stdin. The
          # script travels base64'd so no quoting survives to the remote
          # shell; its arguments are shell-quoted.
          onhost() {
            local script=$1 b64; shift
            b64=$(printf '%s\n%s\n' "$PRELUDE" "$script" | base64 -w0)
            sshhost "bash -c \"\$(echo $b64 | base64 -d)\" onhost $(printf '%q ' "$@")" </dev/null
          }

          # What each write runs, spelled out for the dry run.
          CD='cd /root/faucet-connector/infra/linode-faucet'
          DC='docker compose -p linode-faucet -f docker-compose.faucet.yml -f docker-compose.edge.yml'

          say "## fleet-ops — faucet · \`$OPERATION\`"
          say ""
          say "Host \`$HOST_LABEL\`, IP resolved from its Linode label. Mode: **$([ "$APPLY" = "true" ] && echo APPLY || echo DRY-RUN)**."
          say ""

          case "$OPERATION" in

            box-status)
              say '```'
              onhost "$STATUS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
              say '```'
              ;;

            restart)
              if [ "$APPLY" != "true" ]; then
                say "**Dry run.** Would run on the host:"
                say ""
                say '```sh'
                say "$CD"
                say "$DC config --services   # refuse unless exactly: faucet"
                say "$DC restart faucet"
                say '```'
                say ""
                say "then re-read: only \`faucet\` in the project, both compose files, on \`edge-faucet\`, restarted, healthy; and \`$FAUCET_URL/health\` through the edge."
                say ""
                say '```'
                onhost "$STATUS" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
                say '```'
                exit 0
              fi
              # shellcheck disable=SC2016  # expanded on the host, on purpose
              before=$(onhost 'docker inspect -f "{{.State.StartedAt}}" "$(faucet_cid)"')
              say '```'
              onhost "$RESTART" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
              say '```'
              say "### Read-back"
              say '```'
              if ! onhost "$VERIFY" "" "$before" "" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
                say '```'
                echo "::error::post-restart read-back failed"
                exit 1
              fi
              say '```'
              say "Restarted \`faucet\`."
              ;;

            deploy)
              # shellcheck disable=SC2016  # expanded on the host, on purpose
              current=$(onhost 'git -C "$CHECKOUT" rev-parse HEAD')
              say "The checkout is at \`$current\`; \`$REF\` is \`$TARGET_SHA\`, on main."
              say ""
              changed=$(gh api "repos/$REPO/compare/$current...$TARGET_SHA" \
                          --jq '.files[]?.filename | select(startswith("packages/faucet/") or startswith("infra/linode-faucet/"))' 2>/dev/null \
                        || echo "(could not compare)")
              say "Faucet files that change between them (\`packages/faucet/\`, \`infra/linode-faucet/\`):"
              say '```'
              say "${changed:-(none — the rebuild should be a no-op)}"
              say '```'
              if [ "$APPLY" != "true" ]; then
                say "**Dry run.** Would run on the host:"
                say ""
                say '```sh'
                say "cd /root/faucet-connector"
                say "git status --porcelain --untracked-files=no   # refuse unless empty"
                say "git fetch --no-tags origin $TARGET_SHA"
                say "git checkout --detach $TARGET_SHA"
                say "$CD"
                say "$DC config --services   # refuse unless exactly: faucet"
                say "$DC build faucet        # on failure: git checkout --detach $current"
                say "$DC up -d --no-deps faucet"
                say '```'
                say ""
                say "then re-read: HEAD is \`$TARGET_SHA\`, the running image is the one just built, only \`faucet\` in the project, both compose files, on \`edge-faucet\`, healthy; and \`$FAUCET_URL/health\` through the edge."
                say ""
                say "The gates, against the checkout as it is now:"
                say '```'
                # shellcheck disable=SC2016  # expanded on the host, on purpose
                onhost 'only_faucet && echo "only-faucet gate: PASS"; d=$(git -C "$CHECKOUT" --no-optional-locks status --porcelain --untracked-files=no); if [ -z "$d" ]; then echo "tracked changes: none"; else echo "tracked changes (deploy would refuse):"; echo "$d"; fi' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
                say '```'
                exit 0
              fi
              say '```'
              if ! onhost "$DEPLOY" "$TARGET_SHA" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
                say '```'
                echo "::error::deploy failed on the host — see the summary"
                exit 1
              fi
              say '```'
              say "### Read-back"
              say '```'
              if ! onhost "$VERIFY" "$TARGET_SHA" "" built 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
                say '```'
                echo "::error::post-deploy read-back failed"
                exit 1
              fi
              say '```'
              say "Deployed the faucet at \`$TARGET_SHA\` (was \`$current\`). To roll back, deploy \`$current\`."
              ;;
          esac

      # ── Through the edge ──────────────────────────────────────────────────
      # The faucet publishes no host port; the public hostname, via the
      # edge's Caddy, is the only way anybody reaches it. A write that left
      # the container healthy but off the edge network is still an outage.
      - name: Verify the faucet serves through the edge
        if: >-
          inputs.apply &&
          (inputs.operation == 'restart' || inputs.operation == 'deploy')
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -sf -m 10 "$FAUCET_URL/health" >/dev/null; then
              echo "$FAUCET_URL/health answers 200 through the edge." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo "::error::$FAUCET_URL/health did not answer 200 within 90s after the write."
          echo "**UNHEALTHY through the edge after the write — investigate before running anything else.**" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/devnet ~/.ssh/config
