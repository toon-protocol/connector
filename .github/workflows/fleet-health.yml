# Fleet health — the after-deploy check a node's own apply does not make.
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
# The devnet is ONE host (infra ADR 0001): the Linode labelled `relay`, a
# 1 GB nanode, running the relay, store, gas-station and workload-gateway
# nodes, the faucet, and the edge — one Caddy that terminates TLS for every
# public hostname. Each node deploys by GitOps (connector ADR 0068): a
# `toon-auto-apply-<node>.timer` on the host fast-forwards that node's own
# repository every five minutes, applies its `deploy/` bundle, waits for its
# connector to go `healthy`, and only then records the commit in
# `deploy/.applied`. The edge deploys the same way from toon-protocol/infra.
# The faucet is deployed by hand and has no timer.
#
# That apply gate is real, and it is also all there is. It asks about ONE
# container, ONCE, at deploy time. Nothing it does notices:
#
#   * a container that went down AFTER the apply — a crash-loop presents as
#     `Up 3 seconds` on any single look, and the apply has long since exited;
#   * a container that is `Up` but whose door is shut — connector#972's own
#     wording, "the container being `Up` is not sufficient evidence";
#   * an apply that keeps FAILING. The timer retries on every tick and
#     reports it to a journal nobody reads, while the node sits on the last
#     commit that did apply. A merge that never reaches the host looks, from
#     GitHub, exactly like a merge that did;
#   * the edge in front of a healthy node answering 502, or with a bad
#     certificate — loopback reaches the container directly and never sees it;
#   * the host itself running out of memory or disk. Every node on it now
#     shares 961 MB and one root filesystem, so one node's leak takes the
#     others down with it (ADR 0001, "Consequences").
#
# ── WHAT REACHES A HUMAN ────────────────────────────────────────────────────
# Detection nobody sees is worth nothing, so the alert is an ISSUE, not a red
# tick on a cron nobody watches:
#
#   * On failure this opens (or updates) a single rolling GitHub issue in this
#     repo titled `[fleet-health] devnet fleet is unhealthy`, labelled
#     `needs:human` + `bug`, carrying the full probe table and how to roll
#     back. `needs:human` is the org's existing human-queue label
#     (toon-meta#347), so the alert lands in a queue that is already swept
#     rather than inventing a channel of its own. Opening an issue also emails
#     everyone watching the repo, which a failed scheduled run does not do
#     reliably (GitHub mails only the cron's last editor).
#   * While it stays red the alert's BODY is rewritten on every run -- so the
#     issue always shows the current verdict -- but the thread gains a comment
#     only when the failure CHANGES SHAPE. A rolling alert that commented on
#     every run buried itself: #1248 collected 137 near-identical comments over
#     three weeks, and nobody could tell that day's failure from the one that
#     opened it. A quiet thread under a red alert now means "same failure,
#     still failing", which is information; the body carries how long it has
#     been that way and over how many runs.
#   * A subsequent green run COMMENTS the recovery on that issue and CLOSES
#     it, so the issue's open/closed state is the devnet's current verdict and
#     a human never has to work out whether an old alert is still live.
#   * The job itself also fails, so a scheduled or dispatched run that finds
#     the devnet down is visibly red, not a silent probe nobody reads.
#
# ── HOW IT REACHES THE HOST ─────────────────────────────────────────────────
# Same model as fleet-ops.yml and funded-ops.yml, and for the same reason: an
# SSH key with root on the host reaches a GitHub-hosted runner executing THIS
# reviewed, committed file, and never an agent sandbox. The host's IP is
# resolved from its Linode label (`relay`) per run, never hardcoded.
#
# This workflow is strictly READ-ONLY on the host. The on-host script runs
# `docker ps`/`inspect`/`compose port`, `systemctl show`/`is-active`/
# `list-unit-files`, `journalctl` (read), `git rev-parse`/`log -g`, `cat`,
# `df`, and `curl` against loopback — and nothing else. It never fetches (it
# reads what the timer last fetched), never starts, stops or recreates
# anything, and writes no file, not even to /tmp. There is no `apply` input
# because there is nothing here to apply; a node applies itself.
#
# ── WHAT IT PROBES, AND WHY THAT SET ────────────────────────────────────────
# The watched set is not a hardcoded service list. It is DISCOVERED on the
# host as every compose project a `toon-auto-apply-*.timer` that is enabled
# there deploys — the timer's service names the node's `deploy/auto-apply.sh`,
# and the containers whose `com.docker.compose.project.working_dir` is that
# directory are the node — plus `linode-faucet`, named explicitly because it
# is hand-deployed and has no timer to discover it by. That is precisely the
# set of containers that can change underneath us without a human, plus the
# one that cannot change without one.
#
# Every container in that set needs a serving probe in the `case` below. A
# container with NO PROBE DEFINED is a FAILURE, not a skip: adding a service
# to a node's bundle without saying how to tell whether it is serving is the
# omission this file exists to refuse.
#
# Today that discovers ten containers: `connector` in each of the four node
# projects, `relay`, `store`, `gas-station`, `gateway`, the edge's `caddy`,
# and the faucet.
#
# Two probe layers, because each catches what the other cannot:
#
#   1. ON THE HOST, per container: state (running, not restarting) sampled
#      TWICE at least 15s apart, so a crash-loop is caught by a rising
#      `RestartCount`; Docker's own healthcheck wherever one is defined; and
#      for each connector a real `GET /ilp/identity` on the loopback port
#      `docker compose port` reports for it. The Rust connector has NO
#      `/health` (`/health`, `/healthz`, `/status` and `/` all 404);
#      `/ilp/identity` 200s only once the process is serving AND has read its
#      signer key file.
#      Per auto-apply node: the timer is active and fired recently, the last
#      apply exited `success`, and the node is not stuck behind `main` — see
#      "THE STALENESS RULE" on the probe job.
#      Per host: MemAvailable and root-disk headroom.
#   2. FROM THE RUNNER, over the public internet, one request per public
#      hostname. This is the only layer that crosses the edge: a Caddy that
#      cannot reach its upstream, or serves a certificate that does not cover
#      the name, looks perfect from loopback. Every hostname has an EXPECTED
#      answer, not just "not 5xx":
#        - `proxy.{relay,ario,gas,gateway}.devnet…/ilp/identity` → 200
#        - `relay-ws.devnet…/` → **426 Upgrade Required**, the honest liveness
#          signal for a WebSocket-only endpoint (a 200 there would mean
#          something other than the relay is answering)
#        - `dvm.devnet…/health`, `gas.devnet…/health`, `faucet.devnet…/health`
#          → 200 (each is the app behind the node, not its connector)
#        - `gw.devnet…/` and a fresh random `<label>.gw.devnet…/` → **503**
#          with `toon-gateway-reason: no_grant`: the gateway answered and
#          dialled nobody, which is its healthy, empty state.
#
# ── WHAT THE PROBES ABOVE CANNOT SEE: A FORWARDED ROUTE ─────────────────────
# Everything above asks whether a node is up and answering for ITSELF. Nothing
# above asks whether one node can still reach another, and on 2026-08-28 that
# cost two multi-hour outages, both of them green on every check in this file
# for their whole duration:
#
#   * **10:26Z, `T01 peer unreachable`** on `g.toon.relay.store` and
#     `g.toon.relay.gas`, from a connector restart on the relay node. Every
#     container was `running`, every `GET /ilp/identity` was 200, every public
#     edge answered. Found at 17:20Z, by a human sending a job by hand.
#   * **01:27Z, `T00 … would not report the claim state of channel FDi2TCT9…`**
#     on `g.toon.store.relay`, from an SPL mint cutover. On Solana the channel
#     PDA is seeded with the mint (`["channel", min(p1,p2), max(p1,p2), mint]`),
#     so changing the mint on one node moves every channel id it shares — and
#     the far side is then asked about a channel it has never heard of. Found
#     at 13:45Z, the same way.
#
# Co-locating the nodes did not remove this class: a hop between two nodes on
# the same host is still a real hop — two connectors, two keys, one payment
# channel (ADR 0001). Two jobs ask about it, and they are deliberately NOT the
# same question:
#
#   `peering-crosscheck` — FREE, and on every run. It reads nothing but each
#     node's public `GET /ilp` self-description (ADR 0050) and holds the
#     documents to each other: does every forwarded prefix land on a node that
#     actually routes it, at a price the forward covers, over a peering whose
#     two sides still derive channel ids from the SAME settlement facts. That
#     last clause is the 01:27Z outage, caught with no credential and no money.
#     It also catches two things nothing has ever checked — a forward to a
#     prefix nobody routes, and a forward priced under the far side, both of
#     which charge a payer and then refuse them.
#
#   `paid-probe` — DISPATCH ONLY, and OFF by default, because it SPENDS. It
#     originates a real packet across a real peering and reads what comes back,
#     which is the only thing that proves a packet crosses. See its own header
#     for why it needs no funded CI wallet and what it does cost.
#
# The division is the honest one. A cross-check of two documents can prove the
# two sides AGREE; it cannot prove a packet gets through, and nothing free can.
# The 10:26Z outage is the proof: every document stayed correct throughout —
# the peering was simply not up, and only a packet could say so.

name: fleet-health

on:
  schedule:
    # Every 15 minutes. A node's timer applies a merge within one 5-minute
    # tick, so this is not a race to beat a bad deploy — nothing here can
    # prevent one. It bounds how long a dead service stays unnoticed, which is
    # the thing that actually hurts: the swap#134 crash-loop was found by a
    # human happening to look.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      settle_seconds:
        description: 'Seconds to wait before probing (let a just-merged commit reach the host: one 5-minute timer tick plus the apply).'
        type: string
        required: false
        default: '0'
      paid_probe:
        description: 'Cross a paid forwarded route. `send` SPENDS (~2000 base units, ~$0.002) from the relay node own peer channels.'
        type: choice
        required: false
        default: 'off'
        options: ['off', dry-run, send]

permissions:
  contents: read
  issues: write

concurrency:
  # Never two health runs at once — the second would race the first's
  # open/close of the rolling alert issue and could close an alert the other
  # run had just opened.
  group: fleet-health
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Does the image the fleet is ABOUT to run (or already runs) still accept
  # the config the fleet actually has?
  #
  # This is the swap#134 check, and it needs no host and no credential: the
  # maker's config is committed here (infra/linode-relay/swap.config.json is
  # the file the maker bind-mounted at /app/config/swap.config.json), and the
  # image is public.
  #
  # NOTE: no swap maker runs on the one-host devnet (infra ADR 0001 left it
  # off the host), so today this guards a config nothing deploys. It stays
  # because crates/connector-bin/tests/fleet_release_gate.rs pins it, and
  # retiring it is that test's change as much as this file's — a follow-up,
  # not a side effect of rewriting the host probes.
  #
  # It runs on this cron rather than only in CI on purpose. A connector PR is
  # not what breaks this: swap merging a new REQUIRED config key is, and that
  # happens in another repo on its own schedule. CI here would never see it.
  # The preventive half lives where the tag actually moves — swap's
  # publish-swap-image.yml boots the image it just built against THIS file
  # before it lets `:release` move (see docs/operators/fleet-release-and-health.md).
  # This job is the backstop for when that gate is bypassed or a config edit
  # lands here instead.
  # ─────────────────────────────────────────────────────────────────────────
  config-compat:
    name: Committed maker config still boots the release image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.compat.outputs.verdict }}
      detail: ${{ steps.compat.outputs.detail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Boot ghcr.io/toon-protocol/swap:release against the committed maker config
        id: compat
        run: |
          set -uo pipefail
          IMAGE=ghcr.io/toon-protocol/swap:release
          CONFIG=infra/linode-relay/swap.config.json

          docker pull -q "$IMAGE" || {
            echo "verdict=inconclusive" >> "$GITHUB_OUTPUT"
            echo "detail=could not pull $IMAGE" >> "$GITHUB_OUTPUT"
            echo "::warning::could not pull $IMAGE — compat unproven this run"
            exit 0
          }

          # The maker validates its whole config BEFORE allocating any
          # resource (packages/swap/src/swap-node.ts `validateConfig`), so an
          # incompatible config exits within a second or two. A COMPATIBLE one
          # goes on to open sockets and dial a relay, and would run forever --
          # hence the timeout. Surviving the timeout IS the pass condition;
          # we are asking "was this config refused", not "does this node work".
          #
          # ── The config file alone is NOT what the maker ran ───────────────
          # Caught by this gate on its own first run (connector#1000): booting
          # the file by itself fails `[INVALID_CONFIG] SwapNodeConfig: one of
          # mnemonic or secretKey is required`, and the maker did not, because
          # ./infra/linode-relay/docker-compose.relay.swap.yml supplies
          # `SWAP_AUTOGEN_IDENTITY=1` -- the maker then self-generates a
          # BIP-39 mnemonic on first boot and persists it to its state volume
          # (swap#127). The file is only half of the maker's configuration; the
          # overlay's `environment:` and its writable `statePath` volume are
          # the other half.
          #
          # So the gate reproduces the SERVICE, not just the file. Both halves
          # are mirrored from that overlay, and
          # crates/connector-bin/tests/fleet_release_gate.rs asserts the
          # overlay still declares exactly this environment -- so adding a
          # variable there without adding it here is a build failure rather
          # than a gate that quietly validates something the maker never ran.
          #
          # NOT mirrored: the overlay's `working_dir: /app/state`. It pairs with
          # an entrypoint override naming an ABSOLUTE `/app/dist/cli.js`, and
          # this image's own ENTRYPOINT resolves `dist/cli.js` relative to its
          # workdir -- so setting one without the other fails MODULE_NOT_FOUND.
          # Replicating both would couple this gate to the overlay's command
          # shape for no gain: all it suppresses is a few non-fatal
          # `EACCES ... mkdir './data'` cache warnings, which do not affect
          # whether the config is accepted, and that is the only question here.
          STATE=$(mktemp -d)
          chmod 777 "$STATE"
          set +e
          OUTPUT=$(timeout 45 docker run --rm \
            -v "$PWD/$CONFIG":/app/config/swap.config.json:ro \
            -v "$STATE":/app/state \
            -e SWAP_AUTOGEN_IDENTITY=1 \
            "$IMAGE" 2>&1)
          STATUS=$?
          set -e

          echo "----- container output -----"
          echo "$OUTPUT"
          echo "----- exit code: $STATUS -----"

          # 124 = `timeout` killed a still-running process = the config was
          # accepted and the node got as far as running. That is the pass.
          if [ "$STATUS" -eq 124 ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            echo "detail=config accepted; node ran until killed at 45s" >> "$GITHUB_OUTPUT"
            echo "✓ the committed maker config still boots the current :release image"
            exit 0
          fi

          # INVALID_CONFIG is the maker's own name for "this config does not
          # satisfy my schema" -- swap#134's failure mode exactly. Grep for it
          # rather than trusting a bare nonzero exit, so an unrelated crash
          # (an unreachable RPC, say) is not misreported as a config break.
          if echo "$OUTPUT" | grep -q 'INVALID_CONFIG'; then
            REASON=$(echo "$OUTPUT" | grep -o 'INVALID_CONFIG[^"]*' | head -1)
            echo "verdict=incompatible" >> "$GITHUB_OUTPUT"
            echo "detail=$REASON" >> "$GITHUB_OUTPUT"
            echo "::error::$IMAGE REFUSES the committed $CONFIG — $REASON"
            echo "::error::A swap-node deployed from this config would crash-loop on boot."
            exit 1
          fi

          echo "verdict=inconclusive" >> "$GITHUB_OUTPUT"
          echo "detail=exited $STATUS without INVALID_CONFIG" >> "$GITHUB_OUTPUT"
          echo "::warning::$IMAGE exited $STATUS against the committed config, but not with INVALID_CONFIG — not a config-schema break, see output above"

  # ─────────────────────────────────────────────────────────────────────────
  # Do the three nodes still agree with each other about a FORWARDED route?
  #
  # Free, unauthenticated, and on every run. It reads nothing but each node's
  # public `GET /ilp` self-description (ADR 0050) — no ssh key, no bearer
  # token, no Linode token, no packet, no money — and holds the three
  # documents to each other.
  #
  # The three are the relay, store and gas-station nodes: the ones that
  # forward to one another. They share one host now, and that changes
  # nothing here — a hop between two nodes on the same host is still two
  # connectors, two keys and one payment channel (infra ADR 0001). The
  # workload gateway's node forwards nothing, so it has no row to agree on.
  #
  # WHAT IT CANNOT DO, stated here so nobody reads a green tick as more than
  # it is: it proves the two sides AGREE. It does not prove a packet gets
  # through. The 2026-08-28 10:26Z `T01` outage is the counter-example — every
  # document stayed correct for all seven hours; the peering was simply down.
  # Only `paid-probe` below can say otherwise.
  #
  # The assertions and their failure branches live in
  # tools/ci/fleet-peering-crosscheck.py, which is a file rather than a
  # heredoc because it is testable: its FAIL paths are unreachable from a
  # healthy fleet by construction, so `--self-test` drives every one of them
  # against synthetic documents, and this job runs that FIRST. A monitor whose
  # failure branches have never executed is a green tick over nothing.
  # ─────────────────────────────────────────────────────────────────────────
  peering-crosscheck:
    name: The fleet agrees with itself about a forwarded route
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the script is trusted against the live fleet, prove its FAIL
      # branches still fire. A regression here is a monitor that reports
      # health it never checked, which is worse than no monitor.
      - name: The cross-check's own failure branches still fire
        run: python3 tools/ci/fleet-peering-crosscheck.py --self-test

      - name: Hold the three self-descriptions to each other
        id: crosscheck
        run: |
          set -uo pipefail
          python3 tools/ci/fleet-peering-crosscheck.py /tmp/peering.tsv || true
          if [ ! -s /tmp/peering.tsv ]; then
            printf 'FAIL\t(fleet)\tcross-check\tthe cross-check produced no output at all\n' > /tmp/peering.tsv
          fi

          FAILS=$(grep -c '^FAIL' /tmp/peering.tsv || true)
          {
            echo "### peering cross-check — $( [ "$FAILS" -eq 0 ] && echo 'the fleet agrees with itself' || echo "**$FAILS disagreement(s)**" )"
            echo ""
            echo "| | between | check | detail |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r st subject chk det; do
              icon=$( [ "$st" = "OK" ] && echo '✅' || echo '❌' )
              echo "| $icon | \`$subject\` | $chk | $det |"
            done < /tmp/peering.tsv
            echo ""
          } > /tmp/report-peering.md

          cat /tmp/report-peering.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/peering.tsv
          [ "$FAILS" -eq 0 ] || exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-health-peering
          path: /tmp/report-peering.md
          if-no-files-found: ignore
          retention-days: 7


  # ─────────────────────────────────────────────────────────────────────────
  # The host probes.
  #
  # ── THE STALENESS RULE ──────────────────────────────────────────────────
  # "Is this node running what was merged?" is `deploy/.applied` (the commit
  # the last apply VERIFIED) against `origin/main` in that checkout — read as
  # the timer last fetched it, because fetching would be a write. Equal is
  # green. Unequal is not immediately red, because every merge passes through
  # a window where it is true: the timer fetches, THEN applies, and only
  # writes `.applied` once the connector is healthy.
  #
  # So the clock that matters is how long `origin/main` has pointed at the
  # commit the node has not applied — which is the reflog time of that
  # remote-tracking ref (`git log -g -1 --date=unix`), the moment THIS
  # checkout learned of it. Not `.applied`'s own age: `.applied` is only
  # rewritten on a successful apply, so on a healthy, quiet node it is
  # arbitrarily old, and on a stuck one it measures time since the last
  # success rather than how long the new commit has been waiting.
  #
  # The grace is 20 minutes: one tick to fetch plus three more to apply or
  # retry, which covers the slowest bundle's apply (the gateway builds, with
  # a 30-minute systemd timeout, so an apply still running is also green).
  # Past that the node is BEHIND. `.applied`'s own age is the fallback only
  # where the reflog is missing.
  #
  # A failing apply does not wait for the grace at all: the service's last
  # `Result` goes non-`success` on the first failed tick, and that row fails
  # on its own, quoting the apply's own FAILED/REFUSING line from the journal.
  # And a timer that stopped firing — which would freeze `origin/main` too and
  # make the equality meaningless — fails the "fired recently" row.
  # ─────────────────────────────────────────────────────────────────────────
  probe:
    name: Probe the devnet host
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The devnet's one host (infra ADR 0001). Resolved to an IP per run.
      HOST_LABEL: relay
      LINODE_API: https://api.linode.com/v4
    steps:
      - name: Settle
        if: inputs.settle_seconds != '' && inputs.settle_seconds != '0'
        run: |
          set -euo pipefail
          # Give the node's timer its 5-minute tick plus an apply before
          # asking whether the merge came up.
          echo "Waiting ${{ inputs.settle_seconds }}s for the host to settle…"
          sleep "${{ inputs.settle_seconds }}"

      - name: Preconditions
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          [ -n "${DEVNET_SSH_KEY:-}" ] || { echo "::error::DEVNET_SSH_KEY is not set — cannot reach the host (see fleet-ops.yml)."; fail=1; }
          [ -n "${LINODE_CLI_TOKEN:-}" ] || { echo "::error::LINODE_CLI_TOKEN is not set — cannot resolve the host's label to an IP."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - name: Resolve the host IP from its Linode label
        id: host
        env:
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          ip=$(curl -sf -H "Authorization: Bearer $LINODE_CLI_TOKEN" \
                 "$LINODE_API/linode/instances" \
               | jq -r --arg l "$HOST_LABEL" '.data[] | select(.label==$l) | .ipv4[0]' | head -1)
          if [ -z "$ip" ] || [ "$ip" = "null" ]; then
            echo "::error::No Linode labelled '$HOST_LABEL'."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          HOST_IP: ${{ steps.host.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVNET_SSH_KEY" > ~/.ssh/devnet
          chmod 600 ~/.ssh/devnet
          {
            echo "Host devnet-host"
            echo "  HostName $HOST_IP"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/devnet"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Probe on the host (read-only)
        run: |
          set -uo pipefail
          sshhost() { ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-host "$@"; }

          # ── On-host probe ───────────────────────────────────────────────
          # One script, one connection, two samples. Emits TSV:
          #   <OK|FAIL>\t<subject>\t<check>\t<detail>
          # so the reporting below needs no parsing cleverness and a new probe
          # is one `case` arm. The CHECK column must not vary from run to run
          # (no ages, counts or ports that move) — the alert's change-detection
          # signature is built from subject/check, and a moving value there
          # would make every run a "change". Moving values go in DETAIL.
          #
          # The FH_* knobs exist only so a test harness can drive every FAIL
          # branch against a fabricated host; this workflow never sets them.
          REMOTE=$(cat <<'REMOTE_SCRIPT'
          set -u
          export LC_ALL=C
          APPLY_GRACE=${FH_APPLY_GRACE:-1200}     # 20 min; see THE STALENESS RULE
          TIMER_MAX_AGE=${FH_TIMER_MAX_AGE:-900}  # the timer fires every 300s
          MEM_MIN_KB=${FH_MEM_MIN_KB:-102400}     # 100 MB of a 961 MB nanode
          DISK_MAX_PCT=${FH_DISK_MAX_PCT:-90}
          SAMPLE_GAP=${FH_SAMPLE_GAP:-15}
          MEMINFO=${FH_MEMINFO:-/proc/meminfo}
          # Compose projects watched although no timer deploys them.
          HAND_DEPLOYED=${FH_HAND_DEPLOYED:-linode-faucet}
          STARTED=$(date +%s)

          row() { printf '%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$(printf '%s' "$4" | tr '\t\r\n|' '   /')"; }
          ago() {
            if [ "$1" -lt 120 ]; then echo "${1}s"
            elif [ "$1" -lt 7200 ]; then echo "$(( $1 / 60 ))m"
            else echo "$(( $1 / 3600 ))h"; fi
          }

          # ── Discover the watched set ──────────────────────────────────────
          # Every enabled `toon-auto-apply-<node>.timer`: its service's
          # ExecStart is `<repo>/<...>/deploy/auto-apply.sh`, and that
          # directory is both where `.applied` lives and the compose working
          # dir of every container the node runs.
          timers=$(systemctl list-unit-files 'toon-auto-apply-*.timer' --state=enabled --no-legend --plain 2>/dev/null | awk '{print $1}')
          [ -n "$timers" ] || row FAIL '(host)' 'auto-apply timers' 'no enabled toon-auto-apply-*.timer: either no node deploys by GitOps here, or systemd is unreachable'

          names=""
          for t in $timers; do
            node=${t#toon-auto-apply-}; node=${node%.timer}
            svc="toon-auto-apply-${node}.service"
            exe=$(systemctl show -p ExecStart --value "$svc" 2>/dev/null | sed -n 's/.*path=\([^ ;]*\).*/\1/p' | head -1)
            if [ -z "$exe" ]; then
              row FAIL "$node" 'auto-apply service' "$svc names no ExecStart: cannot tell which checkout this node deploys"
              continue
            fi
            dir=$(dirname "$exe")

            # The node's containers.
            mine=$(docker ps -a --filter "label=com.docker.compose.project.working_dir=$dir" --format '{{.Names}}' 2>/dev/null)
            if [ -z "$mine" ]; then
              row FAIL "$node" 'containers' "the timer is enabled but no container runs from $dir: the node is down, or never came up"
            fi
            names="$names $mine"

            # The timer is active and has fired recently.
            tstate=$(systemctl is-active "$t" 2>/dev/null)
            last=$(systemctl show -p LastTriggerUSec --value "$t" 2>/dev/null)
            lastsec=$(date -d "$last" +%s 2>/dev/null || echo 0)
            age=$(( $(date +%s) - lastsec ))
            if [ "$tstate" != "active" ]; then
              row FAIL "$node" 'auto-apply timer' "$t is $tstate: nothing merged to this node's repo will reach the host"
            elif [ "$lastsec" -eq 0 ]; then
              row FAIL "$node" 'auto-apply timer' "$t is active but has never fired"
            elif [ "$age" -gt "$TIMER_MAX_AGE" ]; then
              row FAIL "$node" 'auto-apply timer' "$t is active but last fired $(ago "$age") ago (expected every 5m)"
            else
              row OK "$node" 'auto-apply timer' "active, last fired $(ago "$age") ago"
            fi

            # The last apply succeeded.
            result=$(systemctl show -p Result --value "$svc" 2>/dev/null)
            status=$(systemctl show -p ExecMainStatus --value "$svc" 2>/dev/null)
            running=$(systemctl show -p ActiveState --value "$svc" 2>/dev/null)
            if [ "$result" = "success" ]; then
              row OK "$node" 'last apply' "Result=success (exit ${status:-?})"
            else
              why=$(journalctl -u "$svc" -n 60 --no-pager -o cat 2>/dev/null | grep -E 'FAILED|REFUSING' | tail -1)
              row FAIL "$node" 'last apply' "Result=${result:-unknown} (exit ${status:-?}): ${why:-see journalctl -u $svc}"
            fi

            # The node is running what was merged (THE STALENESS RULE).
            head=$(git -C "$dir" rev-parse -q --verify origin/main 2>/dev/null)
            applied=$(cat "$dir/.applied" 2>/dev/null | tr -d '[:space:]')
            if [ -z "$head" ]; then
              row FAIL "$node" 'deploy/.applied = origin/main' "$dir has no origin/main: not a checkout the timer can follow"
            elif [ "$applied" = "$head" ]; then
              row OK "$node" 'deploy/.applied = origin/main' "${head:0:7} applied and verified"
            else
              since=$(git -C "$dir" log -g -1 --date=unix --format=%gd refs/remotes/origin/main 2>/dev/null | sed -n 's/.*@{\([0-9]*\)}.*/\1/p')
              clock="origin/main moved"
              if [ -z "$since" ]; then
                since=$(date -r "$dir/.applied" +%s 2>/dev/null || echo 0)
                clock="no reflog; .applied written"
              fi
              wait=$(( $(date +%s) - since ))
              if [ "$running" = "activating" ]; then
                row OK "$node" 'deploy/.applied = origin/main' "applying ${head:0:7} now (.applied is ${applied:0:7})"
              elif [ "$since" -gt 0 ] && [ "$wait" -le "$APPLY_GRACE" ]; then
                row OK "$node" 'deploy/.applied = origin/main' "${head:0:7} pending: $clock $(ago "$wait") ago, within the $(( APPLY_GRACE / 60 ))m grace (.applied is ${applied:0:7})"
              else
                row FAIL "$node" 'deploy/.applied = origin/main' "BEHIND: main is ${head:0:7} but the last verified apply is $( [ -n "$applied" ] && echo "${applied:0:7}" || echo "<none>" ); $clock $(ago "$wait") ago. The merge is not on the host."
              fi
            fi
          done

          for p in $HAND_DEPLOYED; do
            mine=$(docker ps -a --filter "label=com.docker.compose.project=$p" --format '{{.Names}}' 2>/dev/null)
            [ -n "$mine" ] || row FAIL "$p" 'containers' "no container in the hand-deployed compose project $p"
            names="$names $mine"
          done
          names=$(printf '%s' "$names" | tr ' ' '\n' | awk 'NF && !seen[$0]++')

          # ── Per container ─────────────────────────────────────────────────
          # First restart sample, then the serving probes, then a second
          # sample at least SAMPLE_GAP seconds after the first.
          sample1=""
          for n in $names; do
            sample1="$sample1$n $(docker inspect -f '{{.RestartCount}}' "$n" 2>/dev/null || echo -1)
          "
          done

          for n in $names; do
            proj=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$n" 2>/dev/null)
            svc=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$n" 2>/dev/null)
            [ -n "$svc" ] || svc="$n"
            who="${proj:-?}/$svc"
            st=$(docker inspect -f '{{.State.Status}}|{{.State.Restarting}}|{{.State.ExitCode}}|{{.HostConfig.RestartPolicy.Name}}|{{if .State.Health}}{{.State.Health.Status}}|{{.State.Health.FailingStreak}}{{else}}none|0{{end}}' "$n" 2>/dev/null) \
              || st='unknown|unknown|?|?|none|0'
            IFS='|' read -r status restarting code policy health streak <<< "$st"

            # A one-shot job that ran to completion is not a dead service.
            if [ "$status" = "exited" ] && [ "$code" = "0" ] && { [ "$policy" = "no" ] || [ -z "$policy" ]; }; then
              row OK "$who" 'container state' 'one-shot, exited 0 (restart policy: no)'
              continue
            fi
            if [ "$status" != "running" ] || [ "$restarting" = "true" ]; then
              row FAIL "$who" 'container state' "status=$status restarting=$restarting exit=$code"
              continue
            fi
            row OK "$who" 'container state' 'status=running'

            # Docker's own verdict, wherever the image or bundle defines one.
            case "$health" in
              none) ;;
              healthy) row OK "$who" 'docker healthcheck' 'healthy' ;;
              *) row FAIL "$who" 'docker healthcheck' "$health (failing streak $streak)" ;;
            esac

            # Serving probe. An unknown service is a FAILURE by design: a
            # service added to a watched project without a probe is the exact
            # omission this file refuses.
            case "$svc" in
              connector|connector-rust)
                # The client edge is published on loopback at a different port
                # per node (relay 3000, gateway 4001, gas 4002, store 4003), and
                # the container port differs too (3000 on the relay, 4000
                # elsewhere). Read the container port off the container and ask
                # `docker compose port` where it lands — by project name, which
                # reads the running containers, not the bundle's files, so a
                # half-rendered bundle cannot blind this probe.
                cport=$(docker inspect -f '{{range $p, $b := .NetworkSettings.Ports}}{{if $b}}{{$p}} {{end}}{{end}}' "$n" 2>/dev/null | awk '{print $1}' | cut -d/ -f1)
                addr=""
                [ -z "$cport" ] || addr=$(docker compose -p "$proj" port "$svc" "$cport" 2>/dev/null | head -1)
                if [ -z "$addr" ]; then
                  row FAIL "$who" 'GET /ilp/identity' 'publishes no host port: cannot be reached on loopback'
                else
                  got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$addr/ilp/identity" 2>/dev/null)
                  if [ "$got" = "200" ]; then
                    row OK "$who" 'GET /ilp/identity' "200 on $addr"
                  else
                    row FAIL "$who" 'GET /ilp/identity' "${got:-000} on $addr: up but not serving"
                  fi
                fi
                ;;
              relay|store|gas-station|gateway|faucet|caddy)
                # Each of these defines a container HEALTHCHECK, read above,
                # rather than having its probe restated here. Without one the
                # probe is blind, and that is a failure, not a pass.
                [ "$health" != "none" ] || row FAIL "$who" 'docker healthcheck' 'defines no healthcheck, and this arm relies on one: the probe is blind'
                ;;
              swap-node)
                # Not on the devnet since the one-host cutover; kept so a maker
                # that comes back into a watched project is probed, not reported
                # as unknown. Loopback-published blsPort.
                if curl -sf --max-time 10 http://127.0.0.1:8080/health >/dev/null 2>&1; then
                  row OK "$who" 'GET :8080/health' '200'
                else
                  row FAIL "$who" 'GET :8080/health' 'no 200: up but not serving'
                fi
                ;;
              *)
                row FAIL "$who" 'serving probe' 'NO PROBE DEFINED for a watched service: add one to fleet-health.yml before deploying a service onto the devnet host'
                ;;
            esac
          done

          # ── Host headroom ─────────────────────────────────────────────────
          # Every node shares one nanode; a leak in one starves the others.
          memkb=$(awk '/^MemAvailable:/ {print $2}' "$MEMINFO" 2>/dev/null)
          if [ -z "$memkb" ]; then
            row FAIL '(host)' 'MemAvailable' "could not read $MEMINFO"
          elif [ "$memkb" -lt "$MEM_MIN_KB" ]; then
            row FAIL '(host)' 'MemAvailable' "$(( memkb / 1024 )) MB, under the $(( MEM_MIN_KB / 1024 )) MB floor: the next allocation spike is an OOM kill"
          else
            row OK '(host)' 'MemAvailable' "$(( memkb / 1024 )) MB"
          fi
          disk=$(df -P / 2>/dev/null | awk 'NR==2 {gsub("%","",$5); print $5}')
          if [ -z "$disk" ]; then
            row FAIL '(host)' 'root disk' 'could not read df /'
          elif [ "$disk" -ge "$DISK_MAX_PCT" ]; then
            row FAIL '(host)' 'root disk' "${disk}% used, at or over ${DISK_MAX_PCT}%: images, logs and chain state share this filesystem"
          else
            row OK '(host)' 'root disk' "${disk}% used"
          fi

          # ── Second restart sample ─────────────────────────────────────────
          # A rising counter is a crash-loop even though every single-shot
          # look above said `running`.
          elapsed=$(( $(date +%s) - STARTED ))
          [ "$elapsed" -ge "$SAMPLE_GAP" ] || sleep $(( SAMPLE_GAP - elapsed ))
          for n in $names; do
            proj=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$n" 2>/dev/null)
            svc=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$n" 2>/dev/null)
            [ -n "$svc" ] || svc="$n"
            before=$(printf '%s' "$sample1" | awk -v k="$n" '$1==k {print $2}')
            after=$(docker inspect -f '{{.RestartCount}}' "$n" 2>/dev/null || echo -1)
            if [ -n "$before" ] && [ "$after" -gt "$before" ] 2>/dev/null; then
              row FAIL "${proj:-?}/$svc" 'crash-loop' "RestartCount rose $before -> $after during this probe"
            else
              row OK "${proj:-?}/$svc" 'crash-loop' "RestartCount steady at $after"
            fi
          done
          REMOTE_SCRIPT
          )

          sshhost "bash -s" <<< "$REMOTE" > /tmp/onhost.tsv 2>/tmp/onhost.err || true
          if [ ! -s /tmp/onhost.tsv ]; then
            printf 'FAIL\t(host)\tssh probe\tproduced no output: %s\n' "$(head -c 300 /tmp/onhost.err | tr '\t\n|' '  /')" > /tmp/onhost.tsv
          fi
          cat /tmp/onhost.tsv

      # Runs even when the host could not be reached: the edge's answer is
      # still worth having in the same alert, and a host that is unreachable
      # over SSH but serving publicly is a different failure from one that
      # is simply gone.
      - name: Probe every public hostname, from the runner
        if: always()
        run: |
          set -uo pipefail
          # ── Public-edge probe, FROM THE RUNNER ──────────────────────────
          # The only layer that crosses the edge. Loopback reaches a container
          # directly, so an edge that cannot reach its upstream, or serves a
          # certificate that does not cover the name (curl verifies it), looks
          # perfect from on the host.
          #
          # <url> <expected status> [<required toon-gateway-reason>]
          # The random label is fresh every run so no cache can answer for
          # the gateway; the CHECK column names it `<random>` so the alert's
          # change signature does not move with it.
          LABEL="fleet-health-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          D=devnet.toonprotocol.dev
          while read -r url want reason; do
            [ -n "$url" ] || continue
            shown="${url/$LABEL/<random>}"
            # Up to three tries, so a single dropped connection is not an
            # outage — and a real one still fails all three.
            for try in 1 2 3; do
              got=$(curl -s -o /dev/null -D /tmp/public-headers -w '%{http_code}' --max-time 20 "$url" 2>/dev/null || true)
              got=${got:-000}
              seen=$(tr -d '\r' < /tmp/public-headers 2>/dev/null | awk -F': *' 'tolower($1)=="toon-gateway-reason" {print $2}' | tail -1)
              if [ "$got" = "$want" ] && { [ -z "${reason:-}" ] || [ "$seen" = "$reason" ]; }; then
                break
              fi
              [ "$try" -eq 3 ] || sleep 5
            done
            if [ "$got" = "$want" ] && { [ -z "${reason:-}" ] || [ "$seen" = "$reason" ]; }; then
              printf 'OK\t(edge)\t%s\t%s%s\n' "$shown" "$got" "${reason:+ $reason}"
            else
              printf 'FAIL\t(edge)\t%s\texpected %s%s, got %s%s\n' "$shown" "$want" "${reason:+ $reason}" "$got" "${seen:+ $seen}"
            fi
          done > /tmp/public.tsv <<EOF
          https://proxy.relay.$D/ilp/identity 200
          https://relay-ws.$D/ 426
          https://proxy.ario.$D/ilp/identity 200
          https://dvm.$D/health 200
          https://proxy.gas.$D/ilp/identity 200
          https://gas.$D/health 200
          https://proxy.gateway.$D/ilp/identity 200
          https://gw.$D/ 503 no_grant
          https://$LABEL.gw.$D/ 503 no_grant
          https://faucet.$D/health 200
          EOF
          cat /tmp/public.tsv

      - name: Verdict
        if: always()
        run: |
          set -uo pipefail
          [ -s /tmp/onhost.tsv ] || printf 'FAIL\t(host)\tssh probe\tdid not run: the host could not be resolved or reached (see the steps above)\n' > /tmp/onhost.tsv
          [ -s /tmp/public.tsv ] || printf 'FAIL\t(edge)\tpublic probe\tdid not run\n' > /tmp/public.tsv
          cat /tmp/onhost.tsv /tmp/public.tsv > /tmp/probe.tsv

          FAILS=$(grep -c '^FAIL' /tmp/probe.tsv || true)
          {
            echo "### devnet host — $( [ "$FAILS" -eq 0 ] && echo 'healthy' || echo "**$FAILS failing check(s)**" )"
            echo ""
            echo "| | subject | check | detail |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r st subj chk det; do
              icon=$( [ "$st" = "OK" ] && echo '✅' || echo '❌' )
              echo "| $icon | \`$subj\` | $chk | $det |"
            done < /tmp/probe.tsv
            echo ""
          } > /tmp/report-host.md

          cat /tmp/report-host.md >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILS" -eq 0 ] || exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-health-host
          path: /tmp/report-host.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/devnet ~/.ssh/config

  # ─────────────────────────────────────────────────────────────────────────
  # Does a packet ACTUALLY cross a peering?
  #
  # DISPATCH ONLY, and `off` by default. This is the only check in this file
  # that spends, and arming it on the cron is an operator's decision, not a
  # reviewer's — see "THE COST" below and
  # docs/operators/fleet-release-and-health.md.
  #
  # ── WHY A PROBE HAS TO BE PAID ──────────────────────────────────────────
  # A forwarded route is a PAID route. An unpaid request to `g.toon.relay.store`
  # comes back as x402 payment terms, which the relay answers out of its own
  # config without consulting the store at all — so it proves nothing about
  # the peering. The `T01`/`T00`/FULFILL distinction only exists once a packet
  # has been paid for and forwarded.
  #
  # ── IT NEEDS NO FUNDED CI WALLET ────────────────────────────────────────
  # The obvious design — a dedicated CI wallet, a channel opened from CI, a
  # client SDK, a channel-watermark file to reconcile on every run — needs a
  # funded private key in GitHub secrets, and would be the operator's call.
  # None of it is necessary, because the connector can originate a packet
  # through its OWN routing: `POST /packets` (ADR 0008), which `connector send`
  # forms and signs (ADR 0058 cites it as the precedent). Driven that way the
  # money comes from the relay's own peer channel — the very channel being
  # tested — and the packet takes exactly the path a client's would.
  #
  # So this job adds NO new secret. It needs:
  #   * `DEVNET_SSH_KEY`, which this workflow already holds; and
  #   * the relay node's own operator write key, which already lives at
  #     `/root/relay/deploy/operator-write.key` and never leaves the host —
  #     it is bind-mounted read-only into a throwaway container and nothing
  #     is copied anywhere.
  #
  # ── THE COST, STATED PLAINLY ────────────────────────────────────────────
  # ~1011 base units for the store leg and ~1001 for the gas leg: ~2000 units,
  # about $0.002, per run, out of the relay's peer channels.
  #
  # A REJECT COSTS THE SAME AS A FULFILL. ADR 0042 retires ADR 0004's "value
  # moves on fulfilment": a peer PREPARE carries its covering claim and the
  # claim is banked on ARRIVAL, before the packet is handled at all. So
  # pointing the probe at an envelope the app refuses makes it cheap in the
  # sense that the app does no work — no Arweave upload, no gas transaction —
  # and NOT in the sense that the packet is free. Anyone reasoning about
  # arming this on the 15-minute cron should price it at ~$0.20/day and plan
  # to `POST /channels/:id/fund` the relay's channels; hourly is ~$0.05/day.
  #
  # ── WHAT THE ANSWER MEANS ───────────────────────────────────────────────
  #   FULFILL       the packet crossed the peering AND the far app answered.
  #                 `connector send` checks the fulfilment against the one its
  #                 own gift-wrap derives (ADR 0019), so this is proof the
  #                 packet reached the node holding the shared secret — not
  #                 merely *a* node willing to answer.
  #   REJECT F..    the packet CROSSED the peering and the far side answered
  #                 with a final error — `F99 app declined the delivery with
  #                 HTTP 4xx` is the expected one, since the probe deliberately
  #                 sends an envelope the app refuses. The peering is proven.
  #                 F02 is the exception: it means the far side has no route
  #                 for the name, which `peering-crosscheck` should have caught
  #                 first and is a real failure.
  #   REJECT T01    the peering itself is down. This is 10:26Z. The message
  #                 names the peer.
  #   REJECT T00    the claim or channel state is broken between the two — the
  #                 01:27Z shape. Read `peering-crosscheck`'s settlement rows
  #                 in the same run: a mint or token-network change on one node
  #                 moves every channel id it shares.
  #
  # `dry-run` forms and signs the packet, prints what it would have sent, and
  # sends nothing. It proves the credential, the container, the loopback
  # address and the leg table without spending — worth running after any
  # change to this job.
  # ─────────────────────────────────────────────────────────────────────────
  paid-probe:
    name: A packet crosses a peering (${{ inputs.paid_probe }})
    if: always() && github.event_name == 'workflow_dispatch' && inputs.paid_probe != 'off'
    needs: peering-crosscheck
    # `always()`: a disagreeing fleet is exactly when an operator most wants
    # to know which hop a packet dies at, so a failed cross-check must not
    # cancel the one check that can say.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINODE_API: https://api.linode.com/v4
      MODE: ${{ inputs.paid_probe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preconditions
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          [ -n "${DEVNET_SSH_KEY:-}" ] || { echo "::error::DEVNET_SSH_KEY is not set — cannot reach the host (see fleet-ops.yml)."; fail=1; }
          [ -n "${LINODE_CLI_TOKEN:-}" ] || { echo "::error::LINODE_CLI_TOKEN is not set — cannot resolve the host's label to an IP."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      # Which legs exist, and what each costs, read off the SAME fleet map the
      # cross-check uses — never a second table here. A copy is a copy that
      # goes stale, and a paid probe aimed at a prefix nobody routes any more
      # would report a real-looking failure about nothing.
      - name: Read the fleet's forwarded legs
        id: legs
        run: |
          set -euo pipefail
          python3 tools/ci/fleet-peering-crosscheck.py --legs > /tmp/legs.tsv
          echo "the fleet forwards:"
          cat /tmp/legs.tsv
          # Only the relay's own legs are drivable here: this job SSHes to the
          # host's relay node, and the relay is the node with a peer-forwarding
          # table and an operator key on disk. Adding another node means adding it to
          # this step, not a new source of truth.
          awk -F'\t' '$1 == "relay"' /tmp/legs.tsv > /tmp/relay-legs.tsv
          if [ ! -s /tmp/relay-legs.tsv ]; then
            echo "::error::the relay forwards nothing — there is no paid route to probe."
            exit 1
          fi

      - name: Resolve the host IP from its Linode label
        id: host
        env:
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
        run: |
          set -euo pipefail
          ip=$(curl -sf -H "Authorization: Bearer $LINODE_CLI_TOKEN" \
                 "$LINODE_API/linode/instances" \
               | jq -r '.data[] | select(.label=="relay") | .ipv4[0]' | head -1)
          if [ -z "$ip" ] || [ "$ip" = "null" ]; then
            echo "::error::No Linode labelled 'relay'."
            exit 1
          fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        env:
          DEVNET_SSH_KEY: ${{ secrets.DEVNET_SSH_KEY }}
          HOST_IP: ${{ steps.host.outputs.ip }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEVNET_SSH_KEY" > ~/.ssh/devnet
          chmod 600 ~/.ssh/devnet
          {
            echo "Host devnet-host"
            echo "  HostName $HOST_IP"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/devnet"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 30"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Send one packet down each forwarded leg
        id: probe
        run: |
          set -uo pipefail
          sshhost() { ssh -F ~/.ssh/config -o LogLevel=ERROR devnet-host "$@"; }

          # The image the relay is ACTUALLY running, not a pin read from this
          # repo: `connector send` has to be the same build as the node it is
          # driving, and ADR 0068 put that pin in the relay's own repository.
          # Scoped to the relay's compose project: every node on the host runs
          # a service called `connector`, each on its own pin.
          # The single-quoted `$(...)` and `$…` in this step run on the host or
          # are TSV text; neither is meant to expand here.
          : > /tmp/paid.tsv
          # shellcheck disable=SC2016
          IMAGE=$(sshhost 'docker inspect -f "{{.Config.Image}}" "$(docker ps --filter label=com.docker.compose.project=relay --filter label=com.docker.compose.service=connector --format "{{.Names}}" | head -1)"' | tr -d '\r')
          # shellcheck disable=SC2016
          if [ -z "$IMAGE" ]; then
            printf 'FAIL\t(relay)\tconnector container\tno running container with compose project `relay` and service `connector` — nothing to originate from\n' > /tmp/paid.tsv
            IMAGE=""
          fi

          FLAG=$( [ "$MODE" = "dry-run" ] && echo "--dry-run" || echo "" )

          # shellcheck disable=SC2016
          while IFS=$'\t' read -r near prefix far far_url amount; do
            [ -n "$IMAGE" ] || break
            # `--network host`: the relay's client edge and operator surface
            # share 127.0.0.1:3000 on the host (docker-compose.operator.yml
            # mounts the surface onto the port the edge already serves).
            # The key is bind-mounted read only and never copied anywhere.
            OUT=$(sshhost "docker run --rm --network host \
                    -v /root/relay/deploy/operator-write.key:/k:ro '$IMAGE' \
                    send --operator http://127.0.0.1:3000 --operator-key /k \
                    --to '$prefix' --seal-to '$far_url' --amount '$amount' \
                    --target /fleet-health-probe --method POST \
                    --expires-in 30 $FLAG" 2>&1)
            echo "── $near -> $far ($prefix, $amount units) ─────────"
            echo "$OUT"

            LEG="$near -> $far"
            # One line, no tabs: this lands in a TSV field, and a stray tab
            # or newline in a peer's message would silently split the row and
            # render the alert table as nonsense.
            HEAD=$(printf '%s' "$OUT" | head -1 | tr '\t\n' '  ')
            case "$OUT" in
              "DRY RUN"*)
                printf 'OK\t%s\tdry run `%s`\tformed and signed, nothing sent and nothing paid — the key, the container and the leg table are all good\n' "$LEG" "$prefix" ;;
              "FULFILL WITH THE WRONG FULFILMENT"*)
                printf 'FAIL\t%s\tpaid probe `%s`\tfulfilled, but NOT by the node this packet was sealed to (ADR 0019). `%s` is not the connector terminating `%s`.\n' "$LEG" "$prefix" "$far_url" "$prefix" ;;
              "FULFILL"*)
                printf 'OK\t%s\tpaid probe `%s`\tFULFILL — the packet crossed the peering and the terminating app answered\n' "$LEG" "$prefix" ;;
              "REJECT T01"*)
                printf 'FAIL\t%s\tpaid probe `%s`\tT01 PEER UNREACHABLE — the peering itself is down; the packet never left this node. %s\n' "$LEG" "$prefix" "$HEAD" ;;
              "REJECT T00"*)
                printf 'FAIL\t%s\tpaid probe `%s`\tT00 — the two sides disagree about the channel. Read this run cross-check settlement rows: a mint or token-network change on one node moves every channel id it shares. %s\n' "$LEG" "$prefix" "$HEAD" ;;
              "REJECT F02"*)
                printf 'FAIL\t%s\tpaid probe `%s`\tF02 — the packet CROSSED the peering, and the far side routes no such name. The cross-check should have caught this first. %s\n' "$LEG" "$prefix" "$HEAD" ;;
              "REJECT F"*)
                printf 'OK\t%s\tpaid probe `%s`\tthe packet CROSSED the peering and the far side answered — %s. The probe sends an envelope the app refuses on purpose; a final error from the far end is the peering proving itself.\n' "$LEG" "$prefix" "$HEAD" ;;
              *)
                printf 'FAIL\t%s\tpaid probe `%s`\tunrecognised answer: %s\n' "$LEG" "$prefix" "$(printf '%s' "$OUT" | head -3 | tr '\t\n' '  ')" ;;
            esac >> /tmp/paid.tsv
          done < /tmp/relay-legs.tsv

          FAILS=$(grep -c '^FAIL' /tmp/paid.tsv || true)
          {
            echo "### paid probe (\`$MODE\`) — $( [ "$FAILS" -eq 0 ] && echo 'every forwarded leg carries a packet' || echo "**$FAILS leg(s) failing**" )"
            echo ""
            echo "| | leg | check | detail |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r st leg chk det; do
              icon=$( [ "$st" = "OK" ] && echo '✅' || echo '❌' )
              echo "| $icon | \`$leg\` | $chk | $det |"
            done < /tmp/paid.tsv
            echo ""
          } > /tmp/report-paid.md

          cat /tmp/report-paid.md >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILS" -eq 0 ] || exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-health-paid-probe
          path: /tmp/report-paid.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/devnet ~/.ssh/config

  # ─────────────────────────────────────────────────────────────────────────
  # The alert. This is the half that makes detection worth anything.
  # ─────────────────────────────────────────────────────────────────────────
  alert:
    name: Alert a human
    needs: [probe, config-compat, peering-crosscheck, paid-probe]
    # `always()` so this runs on the failure it exists to report. A skipped
    # `probe` (a PR run) must not be treated
    # as a fleet-wide verdict, which the `result` checks below take care of.
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # One rolling issue, matched by exact title. Not one issue per failure:
      # a fleet that stays down for an hour would otherwise open four.
      ALERT_TITLE: '[fleet-health] devnet fleet is unhealthy'
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/reports
          pattern: fleet-health-*
          merge-multiple: true
        continue-on-error: true

      - name: Open, update or close the rolling alert issue
        run: |
          set -euo pipefail

          PROBE='${{ needs.probe.result }}'
          COMPAT='${{ needs.config-compat.result }}'
          PEERING='${{ needs.peering-crosscheck.result }}'
          PAID='${{ needs.paid-probe.result }}'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # A cancelled or skipped upstream job is not evidence of health, so
          # only `success` counts as green. Anything else alerts.
          #
          # `paid-probe` is the ONE exception, and only for `skipped`: it is
          # off by default and skipped on every scheduled run, which is its
          # designed state and not a verdict. A paid probe that RAN and failed
          # alerts like anything else — that is the whole point of running it.
          if [ "$PAID" = "skipped" ]; then
            PAID_VERDICT=success
          else
            PAID_VERDICT="$PAID"
          fi

          if [ "$PROBE" = "success" ] && [ "$COMPAT" = "success" ] \
             && [ "$PEERING" = "success" ] && [ "$PAID_VERDICT" = "success" ]; then
            VERDICT=healthy
          else
            VERDICT=unhealthy
          fi
          echo "probe=$PROBE compat=$COMPAT peering=$PEERING paid=$PAID -> $VERDICT"

          # Deliberately NOT `--search "... in:title"`: the title contains `[`
          # and `]`, which GitHub's search syntax does not treat as literals,
          # and a search that silently matched nothing would open a fresh
          # alert on every run instead of updating one. Listing the label and
          # comparing titles exactly in jq has no such failure mode.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
                       --label "needs:human" --limit 100 \
                       --json number,title \
                       --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" | head -1)

          if [ "$VERDICT" = "healthy" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body \
                "✅ Recovered — every probe passed in [this run]($RUN_URL). Closing; a later failure reopens a fresh alert."
              gh issue close "$EXISTING" --repo "${{ github.repository }}" \
                --reason completed
              echo "Closed alert #$EXISTING."
            else
              echo "Fleet healthy, no open alert. Nothing to do."
            fi
            exit 0
          fi

          # --- What this failure IS, as a comparable value -------------------
          #
          # A rolling alert that comments on every run is unreadable: #1248
          # collected 137 near-identical comments over three weeks and nobody
          # could tell today's failure from August's at a glance. So a comment
          # is reserved for a CHANGE -- the alert's body is rewritten on every
          # run and always shows the current verdict, but the thread only gains
          # an entry when the failure changes shape (or the fleet recovers).
          #
          # The signature is the four job verdicts, the config-compat detail,
          # and the service/check pairs that actually failed -- deliberately
          # NOT the detail column of each row, which carries restart counts and
          # timestamps that differ run to run and would make every run a
          # "change". Two failures with the same signature are the same
          # outage continuing; a different signature is news.
          COMPAT_DETAIL='${{ needs.config-compat.outputs.detail }}'
          # The artifact download is `continue-on-error`, so the reports may be
          # absent. "I could not see which rows failed" is NOT the same as "no
          # rows failed" -- treating it as the latter would flip the signature
          # and comment, which is exactly the noise this exists to stop. So the
          # two halves stay separable and the failing half is skipped when it
          # cannot be observed.
          if ls /tmp/reports/*.md >/dev/null 2>&1; then
            REPORTS_SEEN=yes
          else
            REPORTS_SEEN=no
          fi
          FAILING=$(cat /tmp/reports/*.md 2>/dev/null \
                      | grep '^| ❌ |' \
                      | awk -F'|' '{ print $3 "/" $4 }' \
                      | tr -d ' ' | sort -u | paste -sd, - || true)
          SIG_CORE="probe=$PROBE;compat=$COMPAT;peering=$PEERING;paid=$PAID_VERDICT"
          SIG_CORE="$SIG_CORE;detail=$(printf '%s' "$COMPAT_DETAIL" | tr -d '\n')"
          SIG="$SIG_CORE;failing=$FAILING"

          # Carry the previous state forward out of the alert's own body, so
          # "how long has this been red" survives without any external store.
          PREV_SIG=""
          SINCE="$(date -u +%Y-%m-%dT%H:%MZ)"
          RUNS=1
          CHANGED=yes
          if [ -n "$EXISTING" ]; then
            PREV_STATE=$(gh issue view "$EXISTING" --repo "${{ github.repository }}" \
                           --json body --jq .body \
                         | sed -n 's/.*<!-- fleet-health-state: \(.*\) -->.*/\1/p' | head -1)
            if [ -n "$PREV_STATE" ]; then
              PREV_SIG=$(printf '%s' "$PREV_STATE" | sed -n 's/.*sig=\(.*\); since=.*/\1/p')
              PREV_SINCE=$(printf '%s' "$PREV_STATE" | sed -n 's/.*; since=\([^;]*\);.*/\1/p')
              PREV_RUNS=$(printf '%s' "$PREV_STATE" | sed -n 's/.*; runs=\([0-9]*\).*/\1/p')
              # An unchanged signature continues the same outage; a changed one
              # starts a new clock, because the thing being counted is new.
              if [ "$PREV_SIG" = "$SIG" ]; then
                CHANGED=no
              elif [ "$REPORTS_SEEN" = "no" ] \
                   && [ "${PREV_SIG%%;failing=*}" = "$SIG_CORE" ]; then
                # Same verdicts, and the rows we cannot see this run are the
                # only difference. Keep the previous signature so the recorded
                # failing set is not lost to a flaky artifact download.
                CHANGED=no
                SIG="$PREV_SIG"
              fi
              if [ "$CHANGED" = "no" ]; then
                [ -n "$PREV_SINCE" ] && SINCE="$PREV_SINCE"
                [ -n "$PREV_RUNS" ] && RUNS=$((PREV_RUNS + 1))
              fi
            fi
          fi

          # The body echoes shell commands verbatim, `$` and trailing `\`
          # included; none of them is meant to expand here.
          BODY=/tmp/alert-body.md
          # shellcheck disable=SC2016,SC1003
          {
            echo "The devnet host failed one or more health probes."
            echo ""
            echo "**Run:** $RUN_URL"
            echo "**Host probes:** \`$PROBE\` · **Config compatibility:** \`$COMPAT\` · **Peering cross-check:** \`$PEERING\` · **Paid probe:** \`$PAID\`"
            echo "**This failure since:** $SINCE · **consecutive runs:** $RUNS"
            echo ""
            if [ "$RUNS" -gt 1 ]; then
              echo "> This body is rewritten on every run and always shows the CURRENT verdict."
              echo "> The thread gains a comment only when the failure changes shape, or when the"
              echo "> fleet recovers — so a quiet thread under a red alert means \"still the same"
              echo "> failure\", not \"nobody looked\"."
              echo ""
            fi
            if [ "$PEERING" != "success" ]; then
              echo "> ⚠️ **Two nodes no longer agree about a forwarded route.**"
              echo ">"
              echo "> This is the class nothing used to check, and both 2026-08-28 outages"
              echo "> were in it. The table below names the disagreement. A settlement-facts"
              echo "> row means a mint or token-network changed on one node and not the other,"
              echo "> which moves every channel id the two share — the far side is then asked"
              echo "> about a channel it has never heard of (\`T00\`). A DANGLING FORWARD means"
              echo "> a node sells a prefix nobody routes: the payer is charged and refused."
              echo ">"
              echo "> A green cross-check is NOT proof a packet crosses. To prove that, run"
              echo "> this workflow with \`paid_probe: send\` — it spends ~\$0.002 and says"
              echo "> which hop the packet dies at."
              echo ""
            fi
            if [ "$COMPAT" != "success" ]; then
              echo "> ⚠️ **The committed maker config and the current \`:release\` image disagree.**"
              echo "> \`${{ needs.config-compat.outputs.detail }}\`"
              echo ">"
              echo "> This is the swap#134 shape: an image requiring a config key the committed"
              echo "> \`infra/linode-relay/swap.config.json\` does not have. No maker runs on the"
              echo "> devnet host today, so nothing is down — but a maker deployed from this"
              echo "> config would crash-loop on boot. Fix the committed config in \`infra/\`."
              echo ""
            fi
            for f in /tmp/reports/*.md; do
              [ -e "$f" ] && cat "$f"
            done
            echo ""
            echo "### Recovering"
            echo ""
            echo "Every node on the host deploys by GitOps from its own repository: its"
            echo "\`toon-auto-apply-<node>.timer\` applies whatever that repo's \`main\` says,"
            echo "every five minutes. So a rollback is a **revert of the merge in the node's"
            echo "repo** — the timer applies the revert like any other commit. Nothing here, and"
            echo "nothing on the runner, can make the host deploy."
            echo ""
            echo "| subject | repository | on the host |"
            echo "|---|---|---|"
            echo "| \`relay\` | toon-protocol/relay | \`/root/relay\` |"
            echo "| \`store\` | toon-protocol/store | \`/root/store\` |"
            echo "| \`gas\` | toon-protocol/gas-station | \`/root/gas-station\` |"
            echo "| \`gateway\` | toon-protocol/gateway | \`/root/gateway\` |"
            echo "| \`edge\` | toon-protocol/infra (\`edge/deploy\`) | \`/root/infra/edge\` |"
            echo "| \`linode-faucet\` | toon-protocol/connector (\`infra/linode-faucet\`), **hand-deployed, no timer** | \`/root/faucet-connector\` |"
            echo ""
            echo '```sh'
            echo '# A bad merge in a node repo: revert it there, and let the timer apply the revert.'
            echo 'gh pr view <pr> --repo toon-protocol/<repo> --json mergeCommit'
            echo 'git revert <merge-sha> && git push   # or a revert PR, merged'
            echo ''
            echo '# A node whose apply keeps failing (`last apply` row): read why, on the host.'
            echo 'journalctl -u toon-auto-apply-<node>.service -n 50 --no-pager'
            echo '#   REFUSING: dirty working tree -> a human is mid-edit there; commit/stash/discard it.'
            echo '#   FAILED: render.sh / pull / up -d / connector not healthy -> fix it in the node repo;'
            echo '#   deploy/.applied keeps naming the last commit that DID apply until then.'
            echo ''
            echo '# The faucet has no timer: roll it back by hand, from the checkout root on the host.'
            echo 'cd /root/faucet-connector && git checkout <known-good-sha>'
            echo 'docker compose -f infra/linode-faucet/docker-compose.faucet.yml \'
            echo '               -f infra/linode-faucet/docker-compose.edge.yml up -d --build'
            echo '```'
            echo ""
            if [ "$PEERING" != "success" ] || [ "$PAID_VERDICT" != "success" ]; then
              echo "### Recovering a peering"
              echo ""
              echo "A peering is not rolled back — it is re-established, or re-priced, from the"
              echo "operator surface of the node that owns the row (ADR 0058). Reads need only the"
              echo "bearer token; writes are RFC 9421-signed with \`docs/operators/sign-write.sh\`."
              echo ""
              echo '```sh'
              echo '# On the host, in that node deploy/ dir, see what it thinks it forwards and to whom:'
              echo 'T=$(cat operator-bearer.token)'
              echo '# <port>: relay 3000, gateway 4001, gas 4002, store 4003 (docker compose port connector ...)'
              echo 'curl -s -H "Authorization: Bearer $T" http://127.0.0.1:<port>/routes/peers'
              echo 'curl -s -H "Authorization: Bearer $T" http://127.0.0.1:<port>/peers'
              echo ''
              echo '# A DANGLING FORWARD is a runtime row the config no longer owns. Delete it:'
              echo './sign-write.sh -k operator-write.key -X DELETE -p /routes/peers/<prefix>'
              echo ''
              echo '# A peering whose channel ids moved, or that cannot be dialled, is'
              echo '# re-established from the far side URL — the same write that made it:'
              echo './sign-write.sh -k operator-write.key -X POST -p /peers \'
              echo '  -b "{\"id\":\"<peer>\",\"url\":\"https://…/ilp\",\"fee\":1,\"max_packet_amount\":100000}"'
              echo ''
              echo '# Then prove a packet actually crosses, rather than assuming it does:'
              echo 'gh workflow run fleet-health.yml -f paid_probe=send'
              echo '```'
              echo ""
            fi
            echo "Full runbook: \`docs/operators/fleet-release-and-health.md\`."
            echo ""
            echo "<sub>Opened automatically by \`.github/workflows/fleet-health.yml\`. It closes itself when a later run is green.</sub>"
            echo ""
            echo "<!-- fleet-health-state: sig=$SIG; since=$SINCE; runs=$RUNS -->"
          } > "$BODY"

          if [ -n "$EXISTING" ]; then
            # The body is the current verdict, so it is rewritten every run.
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --body-file "$BODY"

            if [ "$CHANGED" = "no" ]; then
              # Same failure, still failing. Rewriting the body already recorded
              # it; a comment would only add to the pile that made #1248
              # unreadable. Staying silent here is the whole point of the change.
              echo "Alert #$EXISTING refreshed; unchanged signature, no comment (run $RUNS since $SINCE)."
            else
              {
                if [ -z "$PREV_SIG" ]; then
                  echo "🔄 **This alert now reports only changes.** Its body above is rewritten"
                  echo "every run and always shows the current verdict; this thread will gain a"
                  echo "comment only when the failure changes shape, or when the fleet recovers."
                else
                  echo "🔄 **The failure changed shape.**"
                  echo ""
                  echo "\`\`\`"
                  echo "was: $PREV_SIG"
                  echo "now: $SIG"
                  echo "\`\`\`"
                fi
                echo ""
                echo "Current verdict in [this run]($RUN_URL); full detail in the issue body."
              } | gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file -
              echo "Alert #$EXISTING updated; signature changed, commented."
            fi
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$ALERT_TITLE" \
              --label "needs:human" --label "bug" \
              --body-file "$BODY"
            echo "Opened a new alert."
          fi

          # The run itself must also be red — a scheduled or dispatched check
          # that finds the fleet down must not report success.
          echo "::error::devnet fleet is unhealthy — see the alert issue"
          exit 1
