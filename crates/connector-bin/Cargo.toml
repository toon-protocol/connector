[package]
name = "connector"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "connector"
path = "src/main.rs"

[[bin]]
name = "stub-app"
path = "src/bin/stub_app.rs"

[dependencies]
connector-cli = { path = "../connector-cli" }
axum = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
# `devnet_configs_load.rs`: the committed devnet configs' keyed
# `[settlement.<chain>]` legs are asserted by loading them through the real
# `Config::load` (issue #628's typed per-chain tables), which is the only
# way to cover a leg no test can boot without reaching a public cluster.
# `documented_config_keys.rs` (issue #900) hands that same `Config::load` a
# probe per key the committed config-key table names -- `configuration-spec.md`
# §2.1 since #1173, the README's own table before that -- so the table cannot
# again document a key the parser refuses.
connector-config = { path = "../connector-config" }
connector-domain = { path = "../connector-domain" }
# `two_connectors_peer.rs` only (issue #734): a peer MESSAGE and the
# RESPONSE that answers it are encoded by the one codec both carriages
# share, never a second one hand-rolled in a test -- the drift
# peer-carriage-spec.md §9 exists to prevent starts with a test that
# reimplements a frame.
connector-btp = { path = "../connector-btp" }
hex = "0.4"
connector-signer = { path = "../connector-signer" }
connector-settlement = { path = "../connector-settlement" }
# `settlement_over_a_circuit.rs` (ADR 0073): the production backends over
# `RpcTransport::through`, driven only when a SOCKS proxy is named.
connector-chain-rpc = { path = "../connector-chain-rpc" }
url = "2"
connector-settlement-evm = { path = "../connector-settlement-evm", features = ["test-util"] }
connector-settlement-solana = { path = "../connector-settlement-solana", features = ["test-util"] }
connector-operator = { path = "../connector-operator", features = ["test-util"] }
connector-runtime = { path = "../connector-runtime" }
solana-sdk = "=2.1.0"
# solana-rpc-client, not the solana-client meta-crate -- see
# crates/connector-settlement-solana/Cargo.toml for why.
solana-rpc-client = "=2.1.0"
spl-token = { version = "=6.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = "=4.0.0"
chrono = "0.4"
ed25519-dalek = "1"
ethers = { version = "2", default-features = false, features = ["rustls"] }
rand = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
libsecp256k1 = "0.6"
base64 = "0.22"
# `local_stack_rehearsal.rs` only. A Nostr event is signed BIP-340 Schnorr over
# its own SHA-256 id, which neither `libsecp256k1` 0.6 nor `connector-signer`
# does -- and the relay verifies that signature (TOON_DEV_MODE=false), so a
# probe cannot make an event up. `tokio-tungstenite` is the free-read side: a
# plain NIP-01 `REQ` over the relay's public WS.
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
tokio-tungstenite = "0.20"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# `evm_channel_domain_is_the_deployment.rs` (issue #1136): the committed
# configs are read as raw TOML rather than through `Config::load`, because
# that gate is over what the FILES say -- it needs none of the key material
# and container paths a real load demands, and it keeps working if the typed
# shape of those channel tables changes.
toml = "0.8"

# `records_state_their_own_falsifier.rs` (the ADR/spec drift gate): a record
# declares what would prove its "not yet built" claim wrong as a regex over a
# path glob, and the harness runs it. A regex rather than a substring because
# the distinctions that matter are word-boundary ones -- `\bClaimEnforcement\b`
# must not fire on the live `ForwardedClaimEnforcement`, and a substring search
# cannot express that without inviting exactly the false positive that gets a
# doc gate deleted. Already in `Cargo.lock` via `tracing-subscriber`.
regex = "1"
