[package]
name = "connector-settlement-xrpl"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# `test_support::Xrpld`, the disposable stand-alone chain. Gated for the
# reason the EVM and Solana crates gate theirs: a downstream crate's tests
# cannot see anything behind `#[cfg(test)]`, and the shipped binary must
# not carry a harness that shells out to `docker`.
test-util = ["connector-chain-rpc/test-support", "dep:tempfile"]

[dependencies]
# The XRPL JSON-RPC client over a table's one `RpcTransport` (ADR 0073).
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["xrpl"] }
# The receiving half of the batch-settlement port, and the one XRPL key and
# claim implementation (`XrplSigner`, `verify_xrpl_claim`): the backend signs
# its own `PaymentChannelClaim` and checks a voucher with them, never a second.
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
async-trait = "0.1"
hex = "0.4"
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["sync", "time", "rt"] }

[dev-dependencies]
connector-settlement-xrpl = { path = ".", features = ["test-util"] }
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["xrpl", "test-support"] }
connector-settlement = { path = "../connector-settlement", features = ["test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
