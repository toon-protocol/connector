[package]
name = "connector-client-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The BTP frame grammar and session framing (issue #713, ADR 0027): shared
# with the peer carriage so neither side can fork the dialect.
connector-btp = { path = "../connector-btp" }
connector-config = { path = "../connector-config" }
connector-domain = { path = "../connector-domain" }
# The peer carriages, mounted on the listeners this crate already serves
# (issue #678). ADR 0027 put peers on the same two wires clients ride and
# told them apart by authentication, so the crate that owns those wires is
# the one that has to dispatch -- and none of the three depends on this one,
# so nothing here is circular.
connector-peer-auth = { path = "../connector-peer-auth" }
connector-peer-btp = { path = "../connector-peer-btp" }
connector-peer-http = { path = "../connector-peer-http" }
connector-runtime = { path = "../connector-runtime" }
# The settlement port's payout types (ADR 0075 decision 7, issue #1381): a
# client payout is a voucher on one of this node's outbound x402 channels.
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
async-trait = "0.1"
# `ws` for the client BTP websocket carriage (client-edge-spec.md §1.9, ADR
# 0026); pulls tokio-tungstenite 0.20, already in the lockfile.
axum = { version = "0.6", features = ["ws"] }
# `split` on the BTP websocket (issue #688): the session's read half admits
# claims in order while a writer task owns the send half, so responses can
# complete out of order. Already in the tree through axum/hyper.
futures-util = "0.3"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time`: the unresolvable-lookup shaper (issue #613) holds a lookup for
# its slot rather than refusing it, and that hold is a `sleep`. `sync`: the
# claim gate's group commit (issue #686) resolves a claim's durability
# through a oneshot. This crate's own runtime comes from whoever mounts its
# router.
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"
# Hashes the outgoing PREPARE bytes into a job id for the payout dedupe (issue
# #770 AC3, ADR 0069): must be derived from what THIS connector asked a
# session to do, never from what the session answers, since nothing verifies
# that answer any more and a job id taken from it would be payee-forgeable.
sha2 = "0.10"

[dev-dependencies]
chrono = "0.4"
# `test-support` for `covering_fake`: a payable hop for every test here that
# forwards to a peer (ADR 0042, ADR 0075 decision 6).
connector-runtime = { path = "../connector-runtime", features = ["test-support"] }
connector-settlement = { path = "../connector-settlement" }
connector-settlement-evm = { path = "../connector-settlement-evm", features = ["test-util"] }
ethers = { version = "2", default-features = false, features = ["rustls"] }
ed25519-dalek = "1"
# `test-util` for `#[tokio::test(start_paused = true)]`: the shaper of issue
# #613 holds a lookup for its slot, and the only way to exercise that hold
# end-to-end -- rather than working around it with a zero wait ceiling -- is
# a runtime whose clock a test can advance.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
libsecp256k1 = "0.6"
rand = "0.7"
# The payer half of `tests/pay_channel_claim_state_round_trip.rs`:
# `OwnedHttpClaimState` asks a real `POST /ilp/claim-state` over a real
# socket, and its constructor takes the caller's own client. Same 0.11 and
# same feature set `connector-runtime` builds it against, so the test dials
# with exactly the client a deployed node would.
reqwest = { version = "0.11", default-features = false, features = [
  "rustls-tls",
  "json",
] }
tempfile = "3"
# The client half of the BTP integration test (`tests/btp_session.rs`): a
# real websocket session against a served router, since `tower::oneshot`
# cannot carry an upgrade. Same 0.20 the `ws` feature above resolves to.
tokio-tungstenite = "0.20"
# The `AppClient` trait's `deliver` names `url::Url`; the throughput test's
# slow-app fake (issue #688) implements it. Same `url` the runtime itself
# uses.
url = "2"
