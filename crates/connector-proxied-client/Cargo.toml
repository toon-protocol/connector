[package]
name = "connector-proxied-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `socks` because the whole point of this crate is the one place a
# `socks5h://` `reqwest::Proxy` is built (ADR 0070). 0.11 because both chain
# SDKs build their clients on 0.11 and a client handed across that seam has to
# be the same type.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "socks"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
