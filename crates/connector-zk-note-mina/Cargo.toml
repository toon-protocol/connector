[package]
name = "connector-zk-note-mina"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The zk edge's Mina vault adapter (ADR 0080 decision 15): reads the vault through a daemon and an archive node, and verifies request proofs under the key the binary carries."

# The one `ZkNoteVault` that reads a real vault. The in-memory fake stays in
# `connector-client-edge`; both run the same contract suite. It proves nothing
# and sends no Mina transaction (ADR 0080, ADR 0002): every operation is a read.
[dependencies]
async-trait = "0.1"
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["graphql"] }
connector-client-edge = { path = "../connector-client-edge" }
connector-zk-note = { path = "../connector-zk-note" }
connector-zk-verifier = { path = "../connector-zk-verifier" }
serde_json = "1"
thiserror = "2"
# `sync` bounds how many proofs verify at once; `rt` is `spawn_blocking`.
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
ark-ff = { version = "0.5", default-features = false }
# Spelled exactly as `connector-zk-note` spells it, so there is one source and one `Fp`.
mina-poseidon = { git = "https://github.com/o1-labs/proof-systems", rev = "ab84160fa2c22290a8506a7742ac1378879fc386", default-features = false }

[dev-dependencies]
axum = "0.6"
connector-runtime = { path = "../connector-runtime", features = ["test-support"] }
connector-client-edge = { path = "../connector-client-edge", features = ["test-util"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
url = "2"
