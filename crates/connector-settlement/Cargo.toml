[package]
name = "connector-settlement"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Exposes `batch::contract`'s suites outside this crate's own
# tests, so `connector-settlement-evm`/`-solana` can hold their real
# implementations to the same suite from their own dev-dependencies
# without shipping the assertion helpers in a normal build.
test-util = []

[dependencies]
async-trait = "0.1"
chrono = "0.4"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
