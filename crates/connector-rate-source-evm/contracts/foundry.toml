# A self-contained forge project for one test fixture: nothing here is ever
# deployed outside a test's disposable `anvil`. `crates/connector-settlement-evm`'s
# own `contracts/` directory is the same arrangement.
[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
