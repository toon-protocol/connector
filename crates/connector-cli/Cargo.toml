[package]
name = "connector-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The BTP frame codec, for the announce's BTP carriage (issue #784): the ONE
# codec both roles share (ADR 0027, issue #713) and the one
# `connector-vectors` pins -- never a second implementation of a frame.
connector-btp = { path = "../connector-btp" }
# Each settlement table's one transport, built here and handed to every
# client of its rpc_url (ADR 0073 decision 2).
connector-chain-rpc = { path = "../connector-chain-rpc" }
connector-config = { path = "../connector-config" }
connector-client-edge = { path = "../connector-client-edge" }
connector-domain = { path = "../connector-domain" }
connector-operator = { path = "../connector-operator" }
# The two dial-side carriages (issue #678 gap 2): `[[peers]]` becomes a
# transport here, dispatched by peer id, because this is the one place a
# loaded `Config` and a `Connector` are both in scope.
connector-peer-btp = { path = "../connector-peer-btp" }
connector-peer-http = { path = "../connector-peer-http" }
# The rate-source port (ADR 0071 decision 6, issue #1294): `spawn_rate_pollers`
# takes one and starts a background poller per declared quote path. The port
# only -- a reader behind it is its own crate, and this is the one place a
# loaded `Config`, a built rate table and a source are all in scope.
connector-rate-source = { path = "../connector-rate-source" }
# The one reader behind that port (ADR 0071 decision 6, issue #1293): the
# Uniswap-v3-compatible `observe()` TWAP, over the settlement backend's own
# RPC endpoint. Named here and nowhere else -- `spawn_rate_pollers` takes the
# port, and this is the single place a concrete source is chosen.
connector-rate-source-evm = { path = "../connector-rate-source-evm" }
connector-runtime = { path = "../connector-runtime" }
connector-settlement = { path = "../connector-settlement" }
connector-settlement-evm = { path = "../connector-settlement-evm" }
connector-settlement-solana = { path = "../connector-settlement-solana" }
connector-signer = { path = "../connector-signer" }
async-trait = "0.1"
arc-swap = "1.9.2"
axum = "0.6"
# The `ilp-payment-channel-claim` header is base64 of the claim JSON -- the
# client send path of `connector announce` (issue #784).
base64 = "0.22"
# `connector announce` (issue #784): the free, unauthenticated negotiation
# against the through-URL (its x402 greeting and its `/ilp/identity`), and
# the clock the PREPARE's expiry and the event's `created_at` are read from.
chrono = "0.4"
# `connector send` signs its RFC 9421 operator write with an ed25519 key --
# the same curve and the same crate `connector-operator` verifies with.
ed25519-dalek = "1"
ethers = { version = "2", default-features = false, features = ["rustls"] }
# `socks` because ADR 0070 decision 5 gives `connector send` a
# `--socks-proxy` flag, and an onion URL -- the operator surface it signs a
# write to, or the `--seal-to` node whose self-description it fetches -- is
# dialed through that proxy, which is a dial reqwest cannot make without
# this feature. Same 0.11 the carriage and the runtime already resolve to,
# and the same `tokio-socks` already in the lockfile.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "=2.1.0"
tokio = { version = "1", features = ["net", "time"] }
# The websocket under the announce's BTP carriage -- the same 0.20 the peer
# carriage and the client edge's own BTP integration test already speak.
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
# `is_onion_endpoint` takes a parsed `Url`, and a proxy value is refused at
# parse time by its scheme and its host (ADR 0070 decision 5) -- both are
# questions about a URL, asked of the same crate every other URL in this
# workspace is parsed by.
url = "2"

[dev-dependencies]
# `FakeRpc` behind the SOCKS5 fake: the proxied settlement route is asserted
# at the seam where the node builds its settlement clients (ADR 0073).
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["evm", "solana", "test-support"] }
# `test-support` for the SOCKS5 server fake the onion dial tests dial through
# (ADR 0070). A dev-dependency, so `cargo build` never carries a listener.
connector-runtime = { path = "../connector-runtime", features = ["test-support"] }
base64 = "0.22"
# Reads a Solana channel account and program id back off a rendered claim
# and a rendered claim-state ask (issue #1146's `[[pay_channels]]` wiring
# test), so the assertions are against the base58 the far side decodes
# rather than against this crate's own idea of it.
bs58 = "0.5"
connector-operator = { path = "../connector-operator", features = ["test-util"] }
connector-settlement-evm = { path = "../connector-settlement-evm", features = ["test-util"] }
connector-settlement-solana = { path = "../connector-settlement-solana", features = ["test-util"] }
chrono = "0.4"
ed25519-dalek = "1"
hyper = { version = "0.14", features = ["full"] }
# Derives an announced pubkey INDEPENDENTLY of `connector_signer::nostr`
# (issue #799's `identity_key_file` pubkey-pinning test), so a bug in that
# module's own BIP-340 derivation could not make the test agree with it by
# construction. Same version `connector-signer` itself uses.
k256 = { version = "0.13", features = ["schnorr"] }
libsecp256k1 = "0.6"
rand = "0.7"
serde_json = "1"
# solana-rpc-client, not the solana-client meta-crate -- see
# crates/connector-settlement-solana/Cargo.toml for why.
solana-rpc-client = "=2.1.0"
# Derives the node's own associated token account, so the Solana settle
# proof can read the SPL payout straight off the chain rather than trusting
# a `ChannelView`. Pinned to the same version `connector-settlement-solana`
# builds its instructions with.
spl-associated-token-account = "=4.0.0"
tempfile = "3"
# `test-util` for the rate poller's spawn test (issue #1294): a paused clock
# asserts the cadence a `ttl` implies without spending it in real seconds.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower = { version = "0.4", features = ["util"] }
# Reads the WARNs `ConfiguredPeerTransport` emits when a peering registers
# no carriage (issue #1240). A silence is only fixed if something fails when
# it comes back, and a `T01` assertion cannot tell the two apart. Already in
# `Cargo.lock` via `connector-bin`.
tracing-subscriber = "0.3"
