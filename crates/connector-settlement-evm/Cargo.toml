[package]
name = "connector-settlement-evm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
connector-settlement = { path = "../connector-settlement" }
# ADR 0074 (#1342): the batch-settlement backend recomputes a presented
# channel's id and checks a voucher's signature with the one implementation
# of each (`evm_batch_channel_id`, `verify_evm_voucher`), never a second.
connector-signer = { path = "../connector-signer" }
async-trait = "0.1"
chrono = "0.4"
thiserror = "2"
ethers = { version = "2", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The table's shared transport (ADR 0073): bounds, refusal retries and,
# when `rpc_via_socks_proxy` is set, the pinned circuit. The backend and the
# channel-index syncer take one rather than a URL.
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["evm"] }

[dev-dependencies]
# `FakeRpc`: confirmation and the lost-send path are tested against an
# endpoint that drops, refuses or loses an answer on cue, in front of anvil.
connector-chain-rpc = { path = "../connector-chain-rpc", features = ["evm", "test-support"] }
# This crate itself, with `test-util` on, so its own integration tests can
# reach the fixture-only `fund_counterparty` (issue #1118) -- the delegate
# deposit that is no longer part of the port. Mirrors what
# `connector-settlement-solana` already does for its validator harness.
connector-settlement-evm = { path = ".", features = ["test-util"] }
connector-settlement = { path = "../connector-settlement", features = ["test-util"] }
connector-signer = { path = "../connector-signer" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
libsecp256k1 = "0.6"
serde_json = "1"
tempfile = "3"
