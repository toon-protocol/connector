[package]
name = "connector-peer-btp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]

# The one BTP codec (issue #713, ADR 0027). This crate encodes and decodes
# *nothing* itself -- every frame it puts on a wire goes through these
# functions, so the peer carriage cannot fork the client edge's grammar.
connector-btp = { path = "../connector-btp" }
# The peering relation's configured shape: credential, endpoint scheme,
# timeouts, `[[peer_channels]]` (issue #723).
connector-config = { path = "../connector-config" }
# The role decision (issue #726). Called, never re-implemented.
connector-peer-auth = { path = "../connector-peer-auth" }
connector-domain = { path = "../connector-domain" }
connector-runtime = { path = "../connector-runtime" }
connector-signer = { path = "../connector-signer" }
arc-swap = "1.9.2"
async-trait = "0.1"
base64 = "0.22"
# Solana peer-claim identities render as base58 (issue #742), the same
# encoding `connector-runtime`'s `ClaimBook` already decodes channel
# accounts and counterparty keys through.
bs58 = "0.5"
chrono = "0.4"
hex = "0.4"
serde_json = "1"
# `sync` for the session's reply channel and the per-relation ledgers;
# `time` for §6.3's two deadlines. `net` and `io-util` since ADR 0070: the
# onion dial opens its own `TcpStream` to the SOCKS5 proxy and hands the
# established stream to the websocket client, because the websocket library
# below has no proxy support at all. No runtime is started here -- whoever
# owns the socket owns the runtime.
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
tracing = "0.1"
# The one place this crate touches a socket (`ws`): the same 0.20 the
# client edge's own BTP integration test speaks, and the same rustls +
# webpki roots already in the lockfile. `wss://` for every endpoint whose
# identity a CA attests -- a peering carries signed balance proofs -- and
# `ws://` only where an operator opted in or where the host is a `.onion`
# one, whose address is itself the key the circuit authenticates to.
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
# The SOCKS5 client half of ADR 0070 decision 3. `tokio-tungstenite` takes
# an already-established stream (`client_async_tls_with_config`) but cannot
# establish one through a proxy, so the CONNECT is made here and the stream
# handed over. Already in the lockfile -- reqwest's `socks` feature pulled
# it in for the HTTP carriage -- so both carriages speak one SOCKS5.
tokio-socks = "0.5"
# `split` on the dialed websocket: one writer task owns the send half while
# the read loop correlates answers and serves the far side's requests.
futures-util = "0.3"
url = "2"

[dev-dependencies]
# `test-support` for the SOCKS5 server fake the onion dial tests dial through
# (ADR 0070). A dev-dependency, so `cargo build` never carries a listener.
connector-runtime = { path = "../connector-runtime", features = ["test-support"] }
# `net` and `io-util` on top of the library's own features: the onion-dial
# test stands up a real websocket server beside `connector-runtime`'s real
# SOCKS5 server, because "which socket did that dial reach" is a question
# no in-process fake can answer (ADR 0070 decision 3).
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "test-util",
    "net",
    "io-util",
] }
libsecp256k1 = "0.6"
# A genuinely signed Solana balance proof, for the tests that hold what
# this carriage does with a peer claim's declared `programId`
# (`tests/a_peer_claims_declared_program_is_not_consulted.rs`). The same
# ed25519-dalek `connector-signer` verifies with, so a test cannot pass
# against a second implementation of the signature.
ed25519-dalek = "1"
# `Config::load` reads a file, so the two config-driven carriage tests
# write a real TOML and a real key file rather than hand-building a value.
tempfile = "3"
