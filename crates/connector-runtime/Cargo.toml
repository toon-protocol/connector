[package]
name = "connector-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The SOCKS5 server fake (`socks5_test_server`), which BINDS A LISTENER and
# is therefore not something the shipped binary should carry. Both peer
# carriage crates need it and a `#[cfg(test)]` item is invisible outside its
# own crate, so it is gated rather than private -- each crate that tests
# against it turns this on in its `[dev-dependencies]`, and `cargo build`
# leaves it out. Deliberately unlike `FakeAppClient`/`TestClock`, which are
# ordinary values with no socket of their own.
test-support = []

[dependencies]
connector-domain = { path = "../connector-domain" }
connector-config = { path = "../connector-config" }
# The rate-source port (ADR 0071 decision 6, issue #1291): what the
# background poller in `rate_poller` drives. The port only -- the readers
# behind it (the Uniswap-v3-compatible `observe()` TWAP one, issue #1293)
# are their own crates and reach a node through `connector-cli`, never from
# here.
connector-rate-source = { path = "../connector-rate-source" }
connector-settlement = { path = "../connector-settlement" }
connector-signer = { path = "../connector-signer" }
arc-swap = "1.9.2"
async-trait = "0.1"
# The encoding a Solana claim's ed25519 signature travels in, on both the
# claim wire and the `POST /ilp/claim-state` challenge (issue #1146) --
# the same one `connector_client_edge`'s gate decodes them from.
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
prometheus = "0.13"
# Mints a per-packet log correlation id (ADR 0014, amended by issue #1269 /
# ADR 0069): the id used to be the packet's own execution condition, free
# because it was already invariant across every hop; now that the condition
# is gone, this hop mints its own random one instead, at the same version
# `connector-signer` already pins for gift-wrap nonces.
rand = "0.7"
# `json`, for the outbound client ledger's `POST /ilp/claim-state` round
# trip (issue #873): the receiver is asked for its watermark as JSON and
# answers as JSON.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `time`, for the one timer on the packet path: a termination waits for its
# app no longer than the packet's own deadline allows (ADR 0064, PF-25). The
# *decision* is `connector_domain::delivery_budget`, pure arithmetic over the
# injected clock; this feature supplies only the mechanism that stops waiting.
tokio = { version = "1", features = ["sync", "rt", "net", "io-util", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
ed25519-dalek = "1"
# `test-util` for the poller's cadence test (issue #1294): a paused clock
# asserts the schedule a `ttl` implies without spending it in real seconds.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# A real HTTP server for the self-description fetch's own bounds (ADR
# 0058): a redirect, a status, and a body that never ends are properties of
# an exchange, not values a fake can hand back.
axum = "0.6"
futures-util = "0.3"
hyper = { version = "0.14", features = ["server", "http1", "tcp", "runtime", "stream"] }
tempfile = "3"
proptest = "1"
